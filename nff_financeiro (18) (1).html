<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFF Serviços LTDA — Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --navy-950:#0d1626;
    --navy-900:#12203b;
    --navy-800:#182b4d;
    --navy-700:#213862;
    --paper:#f5f6f8;
    --paper-line:#e4e7ec;
    --card:#ffffff;
    --ink:#182338;
    --ink-soft:#5b6576;
    --gold:#c9a227;
    --green:#1c8f6f;
    --green-soft:#e4f4ee;
    --red:#c94c4c;
    --red-soft:#fbeaea;
    --radius:14px;
    --shadow: 0 1px 2px rgba(13,22,38,.06), 0 8px 24px -12px rgba(13,22,38,.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:#fff; }

  /* ---------- layout shell ---------- */
  #root{ display:flex; min-height:100vh; }

  .sidebar{
    width:250px;
    flex-shrink:0;
    background: linear-gradient(180deg, var(--navy-900), var(--navy-950));
    color:#fff;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .sidebar::before{
    content:"";
    position:absolute; right:-70px; bottom:-40px; width:340px; height:340px;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M0 70 L25 30 L40 55 L65 10' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-size:contain; opacity:.05; pointer-events:none;
    transform:rotate(8deg);
  }
  .sidebar::after{
    content:"";
    position:absolute; top:0; right:0; width:3px; height:100%;
    background:linear-gradient(180deg, var(--gold), transparent 70%);
    opacity:.55;
  }
  .sidebar-logo{
    padding:28px 22px 20px 22px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .sidebar-logo img{ width:100%; max-width:180px; display:block; }
  .sidebar-tag{
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(255,255,255,.45); margin-top:10px; font-weight:500;
  }

  .nav{ padding:18px 12px; display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-label{
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(255,255,255,.32); padding:14px 12px 6px;
    font-weight:600;
  }
  .nav button{
    all:unset; box-sizing:border-box; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:10px;
    font-size:14px; color:rgba(255,255,255,.72); font-weight:500;
    transition:background .15s, color .15s;
    position:relative;
  }
  .nav button:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .nav button.active{ background:rgba(255,255,255,.1); color:#fff; }
  .nav button.active::before{
    content:""; position:absolute; left:-12px; top:50%; transform:translateY(-50%);
    width:3px; height:16px; border-radius:0 3px 3px 0; background:var(--gold);
  }
  .nav button .ic{ width:18px; height:18px; flex-shrink:0; opacity:.9; }

  .sidebar-foot{
    padding:16px 22px 20px; font-size:11px; color:rgba(255,255,255,.32);
    border-top:1px solid rgba(255,255,255,.08);
  }
  .backup-actions{ display:flex; flex-direction:column; gap:4px; }
  .link-btn{
    all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:7px;
    font-size:11.5px; font-weight:500; color:rgba(255,255,255,.55);
    padding:6px 2px; transition:color .12s;
  }
  .link-btn:hover{ color:#fff; }
  .import-hint{ font-size:10px; color:rgba(255,255,255,.3); padding:4px 2px 0; line-height:1.4; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  .topbar{
    padding:22px 34px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--paper-line);
    background:var(--card);
    position:relative;
  }
  .topbar::after{
    content:""; position:absolute; left:0; bottom:-1px; width:100%; height:2px;
    background:linear-gradient(90deg, var(--navy-900) 0%, var(--gold) 18%, transparent 18.5%);
  }
  .topbar .kicker{ font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); font-weight:700; margin-bottom:3px; }
  .topbar h1{ font-family:'Sora', sans-serif; font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .topbar .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .topbar-right{ display:flex; align-items:center; gap:14px; }
  .period-select{
    font-family:'IBM Plex Mono', monospace; font-size:12.5px;
    border:1px solid var(--paper-line); background:var(--paper);
    padding:8px 12px; border-radius:8px; color:var(--ink); cursor:pointer;
  }

  .content{ padding:28px 34px 60px; flex:1; }

  /* ---------- generic components ---------- */
  .cards-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:22px; }
  .card{
    background:var(--card); border-radius:var(--radius); padding:20px 22px;
    box-shadow:var(--shadow); border:1px solid var(--paper-line);
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; width:100%; height:3px;
    background:var(--bar-color, var(--navy-700));
  }
  .card.acc-green::before{ background:var(--green); }
  .card.acc-red::before{ background:var(--red); }
  .card.acc-navy::before{ background:var(--navy-700); }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card-top svg{ flex-shrink:0; margin-top:2px; }
  .card-icon{
    width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .card-icon svg{ width:17px; height:17px; }
  .card-icon.green{ background:var(--green-soft); color:var(--green); }
  .card-icon.red{ background:var(--red-soft); color:var(--red); }
  .card-icon.navy{ background:#eef1f6; color:var(--navy-700); }
  .kpi-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:600; }
  .kpi-value{ font-family:'IBM Plex Mono', monospace; font-size:28px; font-weight:600; margin-top:8px; letter-spacing:-.01em; }
  .kpi-value.green{ color:var(--green); }
  .kpi-value.red{ color:var(--red); }
  .kpi-sub{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  .panel{
    background:var(--card); border-radius:var(--radius); border:1px solid var(--paper-line);
    box-shadow:var(--shadow); padding:24px;
    transition:box-shadow .18s;
  }
  .panel:hover{ box-shadow:0 2px 4px rgba(13,22,38,.07), 0 12px 28px -12px rgba(13,22,38,.16); }
  .panel + .panel{ margin-top:18px; }
  .grid-2 > .panel + .panel, .cat-cols > .panel + .panel{ margin-top:0; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--paper-line); position:relative; }
  .panel-head::after{ content:""; position:absolute; left:0; bottom:-1px; width:34px; height:2px; background:var(--gold); }
  .panel-head h2{ font-family:'Sora', sans-serif; font-size:15.5px; font-weight:700; }
  .panel-head .hint{ font-size:12px; color:var(--ink-soft); }

  @keyframes fadeIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  .content{ animation:fadeIn .28s ease; }

  .grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start; }
  .grid-2 + .grid-2{ margin-top:18px; }
  .cards-row-4{ grid-template-columns:repeat(4,1fr); }

  /* bars */
  .bar-row{ display:flex; align-items:center; gap:12px; padding:9px 0; }
  .bar-row .label{ width:150px; flex-shrink:0; font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; height:8px; background:var(--paper-line); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; }
  .bar-fill.green{ background:linear-gradient(90deg, var(--green), #2fb894); }
  .bar-fill.red{ background:linear-gradient(90deg, var(--red), #e07070); }
  .bar-val{ width:88px; text-align:right; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink); flex-shrink:0; }

  /* table */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--ink-soft); font-weight:600; padding:0 10px 10px; border-bottom:1px solid var(--paper-line);
  }
  tbody td{ padding:12px 10px; border-bottom:1px solid var(--paper-line); vertical-align:middle; }
  tbody tr:hover{ background:#fafbfc; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .tag{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:500;
    padding:4px 9px; border-radius:20px; white-space:nowrap;
  }
  .tag.receita{ background:var(--green-soft); color:var(--green); }
  .tag.despesa{ background:var(--red-soft); color:var(--red); }
  .tag .bar{ width:3px; height:10px; border-radius:2px; }
  .tag.receita .bar{ background:var(--green); }
  .tag.despesa .bar{ background:var(--red); }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .icon-btn{
    all:unset; box-sizing:border-box; cursor:pointer; width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    border-radius:7px; color:var(--ink-soft); transition:background .12s, color .12s;
  }
  .icon-btn:hover{ background:var(--paper-line); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--red-soft); color:var(--red); }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state .glyph{ font-size:30px; margin-bottom:10px; }
  .empty-state .t{ font-weight:600; color:var(--ink); font-size:14px; margin-bottom:4px; }

  /* forms */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px 18px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .field input, .field select, .field textarea{
    font-family:'Inter', sans-serif; font-size:13.5px; padding:10px 12px;
    border:1px solid var(--paper-line); border-radius:9px; background:var(--paper); color:var(--ink);
    transition:border-color .12s, background .12s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--navy-700); background:#fff;
  }
  .field textarea{ resize:vertical; min-height:64px; font-family:'Inter', sans-serif; }
  .field.money input{ font-family:'IBM Plex Mono', monospace; }

  .btn{
    all:unset; box-sizing:border-box; cursor:pointer; font-family:'Inter', sans-serif; font-weight:600; font-size:13.5px;
    padding:11px 20px; border-radius:9px; text-align:center; transition:filter .12s, transform .05s;
  }
  .btn:active{ transform:translateY(1px); }
  .btn.primary.receita{ background:var(--green); color:#fff; }
  .btn.primary.despesa{ background:var(--red); color:#fff; }
  .btn.primary.neutral{ background:var(--navy-900); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--paper-line); }
  .btn.ghost:hover{ background:var(--paper); color:var(--ink); }
  .form-actions{ display:flex; gap:10px; margin-top:6px; grid-column:1 / -1; }

  .banner{
    display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:10px;
    font-size:13px; font-weight:500; margin-bottom:16px;
  }
  .banner.ok{ background:var(--green-soft); color:var(--green); }
  .banner.err-banner{ background:var(--red-soft); color:var(--red); }

  /* sync status */
  .sync-status{ display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600; color:rgba(255,255,255,.55); }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); flex-shrink:0; box-shadow:0 0 0 3px rgba(28,143,111,.18); }
  .sync-dot.err{ background:var(--red); box-shadow:0 0 0 3px rgba(201,76,76,.18); }
  .last-updated{ font-size:10.5px; color:rgba(255,255,255,.35); margin-top:3px; margin-bottom:12px; }

  /* setup screen */
  .setup-screen{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
    background:var(--navy-950); padding:40px 20px;
  }
  .setup-card{
    max-width:640px; background:#fff; border-radius:18px; padding:40px 44px;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.5);
  }
  .setup-card h1{ font-family:'Sora',sans-serif; font-size:22px; font-weight:700; margin-bottom:14px; color:var(--ink); }
  .setup-card .lead{ font-size:14px; color:var(--ink-soft); line-height:1.6; margin-bottom:20px; }
  .setup-card ol{ padding-left:20px; margin-bottom:18px; }
  .setup-card ol li{ font-size:13.5px; line-height:1.9; color:var(--ink); }
  .setup-card code{
    background:var(--paper); border:1px solid var(--paper-line); padding:1px 6px; border-radius:5px;
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--navy-900);
  }
  .setup-card pre{
    background:var(--navy-950); color:#d8e0ee; padding:16px 18px; border-radius:10px;
    font-family:'IBM Plex Mono', monospace; font-size:12px; line-height:1.6; overflow-x:auto; margin-bottom:16px;
  }
  .setup-card .note{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; background:var(--paper); padding:12px 14px; border-radius:9px; }

  /* autenticação */
  .auth-screen{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--navy-900), var(--navy-950)); padding:20px;
  }
  .auth-loading{ color:rgba(255,255,255,.6); font-size:13px; }
  .auth-card{
    width:100%; max-width:380px; background:#fff; border-radius:18px; padding:38px 34px;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.5); text-align:center;
  }
  .auth-logo{ width:120px; margin:0 auto 22px; display:block; }
  .auth-card h1{ font-family:'Sora',sans-serif; font-size:19px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .auth-card .auth-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:22px; line-height:1.5; }
  .auth-card form{ text-align:left; }
  .auth-card .banner{ text-align:left; margin-bottom:16px; }
  .auth-link{
    all:unset; box-sizing:border-box; cursor:pointer; display:inline-block; margin-top:18px; font-size:12.5px; font-weight:600;
    color:var(--navy-700); text-decoration:underline; text-underline-offset:2px;
  }
  .auth-link:hover{ color:var(--navy-900); }

  .logged-user{ display:flex; align-items:center; gap:9px; padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,.1); }
  .logged-user .lu-email{ font-size:11.5px; font-weight:600; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .logged-user .auth-link{ color:rgba(255,255,255,.5); margin-top:2px; font-size:11px; }
  .logged-user .auth-link:hover{ color:#fff; }

  /* classificacoes */
  .cat-cols{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .cat-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .cat-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; background:var(--paper); border:1px solid var(--paper-line); border-radius:9px; font-size:13px;
  }
  .cat-item .name{ display:flex; align-items:center; gap:9px; }
  .cat-add{ display:flex; gap:8px; margin-top:14px; }
  .cat-add input{ flex:1; }

  .services-strip{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .service-chip{
    display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--paper);
    border:1px solid var(--paper-line); border-radius:20px; font-size:12px; font-weight:500; color:var(--ink-soft);
  }
  .service-chip .sq{ width:7px; height:7px; border-radius:2px; background:var(--gold); }

  .filters-row{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .filters-row select, .filters-row input{
    font-size:12.5px; padding:8px 12px; border-radius:8px; border:1px solid var(--paper-line); background:var(--paper);
  }
  .search-input{
    width:100%; font-size:13px; padding:10px 14px; border-radius:9px; border:1px solid var(--paper-line);
    background:var(--paper); margin-bottom:16px; font-family:'Inter', sans-serif;
  }
  .search-input:focus{ outline:none; border-color:var(--navy-700); background:#fff; }
  .form-divider{
    margin-top:4px; padding-top:14px; border-top:1px solid var(--paper-line);
  }
  .form-divider span{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft);
  }

  /* usuários */
  .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--navy-900); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:700; font-size:13px; flex-shrink:0;
  }
  .user-row{ display:flex; align-items:center; gap:12px; }
  .user-meta .nm{ font-weight:600; font-size:13px; }
  .user-meta .em{ font-size:11.5px; color:var(--ink-soft); }
  .status-pill{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .status-pill.ativo, .status-pill.pago{ background:var(--green-soft); color:var(--green); }
  .status-pill.inativo, .status-pill.atrasado{ background:var(--red-soft); color:var(--red); }
  .status-pill.pendente{ background:#fbf1d9; color:#9c7a12; }
  .role-pill{ font-size:11.5px; font-weight:500; padding:3px 9px; border-radius:20px; background:#eef1f6; color:var(--navy-700); }

  /* alerta de pendências no dashboard */
  .pending-alert{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .pa-item{
    flex:1; min-width:220px; display:flex; align-items:center; gap:10px;
    padding:13px 16px; border-radius:12px; cursor:pointer; font-size:13px; color:var(--ink);
    border:1px solid transparent; transition:filter .12s;
  }
  .pa-item:hover{ filter:brightness(0.97); }
  .pa-item.atrasado{ background:var(--red-soft); border-color:rgba(201,76,76,.25); }
  .pa-item.pendente{ background:#fbf1d9; border-color:rgba(156,122,18,.25); }
  .pa-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .pa-item.atrasado .pa-dot{ background:var(--red); }
  .pa-item.pendente .pa-dot{ background:#9c7a12; }
  .pa-val{ font-family:'IBM Plex Mono', monospace; margin-left:6px; font-weight:600; }

  .totals-row td{
    border-top:2px solid var(--navy-900); border-bottom:none; padding-top:12px;
    font-size:12.5px; font-weight:600; color:var(--ink-soft); background:#fafbfd;
  }
  .readonly-tag{
    font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:#e0b84a; background:rgba(224,184,74,.12); border:1px solid rgba(224,184,74,.3);
    padding:5px 9px; border-radius:7px; margin-bottom:12px; display:inline-block;
  }
  .analise-list{ list-style:none; display:flex; flex-direction:column; gap:10px; }
  .analise-list li{
    font-size:13px; line-height:1.5; padding:10px 12px 10px 34px; border-radius:9px; position:relative;
  }
  .analise-list li::before{ position:absolute; left:11px; top:10px; font-size:13px; }
  .analise-list.positivo li{ background:var(--green-soft); color:#0e5a44; }
  .analise-list.positivo li::before{ content:"✓"; color:var(--green); font-weight:700; }
  .analise-list.atencao li{ background:var(--red-soft); color:#7a2626; }
  .analise-list.atencao li::before{ content:"!"; color:var(--red); font-weight:700; }

  /* DRE */
  .dre-period{ display:flex; justify-content:flex-end; margin-bottom:14px; }
  .dre-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .dre-table tr td{ padding:11px 8px; border-bottom:1px solid var(--paper-line); }
  .dre-table tr.line-main td{ font-weight:700; font-family:'Sora', sans-serif; font-size:13.5px; color:var(--navy-900); background:#fafbfd; }
  .dre-table tr.line-sub td.label{ padding-left:26px; color:var(--ink-soft); font-size:12.5px; }
  .dre-table tr.line-total td{ font-weight:700; border-top:2px solid var(--navy-900); border-bottom:none; padding-top:13px; }
  .dre-table td.val{ text-align:right; font-family:'IBM Plex Mono', monospace; white-space:nowrap; }
  .dre-table tr.negativo td.val{ color:var(--red); }
  .dre-table tr.positivo td.val{ color:var(--green); }
  .dre-note{ font-size:12px; color:var(--ink-soft); margin-top:14px; line-height:1.5; }
  .dre-margin{ display:flex; gap:24px; margin-top:18px; }
  .dre-margin .mcard{ flex:1; background:var(--paper); border:1px solid var(--paper-line); border-radius:10px; padding:14px 16px; }
  .dre-margin .mcard .mv{ font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600; margin-top:4px; }
  .grupo-select{ font-size:12px; padding:6px 8px; border-radius:6px; border:1px solid var(--paper-line); background:#fff; }

  /* report tabs */
  .report-tabs{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .tabs-group{ display:flex; gap:4px; background:var(--card); padding:4px; border-radius:11px; border:1px solid var(--paper-line); box-shadow:var(--shadow); }
  .tab-btn{
    all:unset; box-sizing:border-box; cursor:pointer; font-size:12.5px; font-weight:600; padding:9px 15px; border-radius:8px;
    color:var(--ink-soft); transition:background .15s, color .15s;
  }
  .tab-btn:hover:not(.active){ background:var(--paper); color:var(--ink); }
  .tab-btn.active{ background:var(--navy-900); color:#fff; }

  .mobile-menu-btn{
    display:none; align-items:center; justify-content:center; flex-shrink:0;
    width:36px; height:36px; border-radius:9px; border:1px solid var(--paper-line);
    background:var(--paper); color:var(--ink); cursor:pointer;
  }
  .mobile-overlay{ display:none; }

  @media (max-width: 880px){
    .sidebar{
      display:flex; position:fixed; top:0; left:0; height:100vh; z-index:60;
      transform:translateX(-100%); transition:transform .25s ease;
      box-shadow:0 0 40px rgba(0,0,0,.35);
    }
    .sidebar.mobile-open{ transform:translateX(0); }
    .mobile-overlay.show{
      display:block; position:fixed; inset:0; background:rgba(13,22,38,.5); z-index:55;
    }
    .mobile-menu-btn{ display:flex; }
    .cards-row, .grid-2, .cat-cols, .form-grid{ grid-template-columns:1fr; }
    .content{ padding:20px; }
    .topbar{ padding:16px 20px; }
  }

  /* impressão / PDF de relatórios */
  .print-header{ display:none; }
  @media print{
    @page{ size:A4; margin:12mm 14mm; }
    html, body{ background:#fff; height:auto; }

    /* esconde tudo que não é o relatório — sem reservar espaço no layout */
    .sidebar, .topbar, .no-print{ display:none !important; }
    #root{ display:block; }
    .main{ width:100%; }
    .content{ padding:0; animation:none; }

    .print-header{
      display:flex; align-items:center; gap:12px; margin-bottom:12px; padding-bottom:10px;
      border-bottom:2px solid #12203b;
    }
    .print-header img{ width:56px; }
    .print-header .ph-title{ font-family:'Sora',sans-serif; font-weight:700; font-size:13px; color:#12203b; }
    .print-header .ph-sub{ font-size:9.5px; color:#5b6576; margin-top:1px; }

    .panel{ box-shadow:none !important; border:1px solid #ddd !important; padding:12px 14px; break-inside:avoid; }
    .panel:hover{ box-shadow:none !important; }
    .panel-head{ margin-bottom:8px; padding-bottom:6px; }
    .panel-head h2{ font-size:12px; }
    .panel-head .hint{ font-size:9.5px; }

    table{ font-size:10px; }
    thead th{ padding:0 5px 5px; font-size:8.5px; }
    tbody td{ padding:5px; }
    tr{ break-inside:avoid; }

    .dre-table tr td{ padding:4px 5px; font-size:10px; }
    .dre-table tr.line-main td{ font-size:10px; }
    .dre-table tr.line-sub td.label{ padding-left:16px; font-size:9px; }
    .dre-table tr.line-total td{ padding-top:7px; }

    .dre-margin{ margin-top:8px; gap:14px; }
    .dre-margin .mcard{ padding:6px 10px; }
    .dre-margin .mcard .mv{ font-size:13px; margin-top:2px; }
    .dre-note{ font-size:9px; margin-top:8px; padding:8px 10px; line-height:1.4; }

    .dist-col{ display:none; }
  }
</style>
</head>

let authReady = false;
let authUser = null;
let authView = "login"; // login | esqueci
let authError = null;
let authMsg = null;
let authBusy = false;

function usuarioLogado(){
  if(!authUser || !authUser.email) return null;
  return (state.usuarios||[]).find(u => (u.email||"").toLowerCase() === authUser.email.toLowerCase()) || null;
}
function perfilAtual(){
  const u = usuarioLogado();
  // sem cadastro correspondente em Usuários = acesso total (evita travar contas já existentes)
  return u ? u.perfil : "Administrador";
}
function podeEditar(){
  return perfilAtual() !== "Somente Leitura";
}
function podeGerenciarUsuarios(){
  return perfilAtual() === "Administrador";
}

const ADMIN_EMAIL = "jvo.wallas@gmail.com";
let sessaoDocId = null;

function registrarAcessoInicio(){
  if(!FIREBASE_READY || !db || !authUser) return;
  db.collection("nff_acessos").add({
    email: authUser.email || "desconhecido",
    entrada: firebase.firestore.FieldValue.serverTimestamp(),
    saida: null,
    userAgent: navigator.userAgent || "",
  }).then(ref=>{ sessaoDocId = ref.id; }).catch(e=>console.warn("Falha ao registrar acesso:", e));
}

function registrarAcessoFim(){
  if(!FIREBASE_READY || !db || !sessaoDocId) return Promise.resolve();
  const id = sessaoDocId;
  sessaoDocId = null;
  return db.collection("nff_acessos").doc(id).update({
    saida: firebase.firestore.FieldValue.serverTimestamp(),
  }).catch(e=>console.warn("Falha ao encerrar registro de acesso:", e));
}

function iniciarAutenticacao(){
  if(!FIREBASE_READY || !auth){ authReady = true; render(); return; }
  auth.onAuthStateChanged(user=>{
    const eraLogado = !!authUser;
    authUser = user;
    authReady = true;
    authView = "login";
    authError = null;
    authMsg = null;
    if(user){
      if(!eraLogado) registrarAcessoInicio();
      loadState();
    } else {
      ready = false;
      render();
    }
    render();
  });
}

function traduzErroAuth(code){
  const mapa = {

    "auth/user-disabled": "Este usuário foi desativado.",
    "auth/user-not-found": "E-mail ou senha incorretos.",
    "auth/wrong-password": "E-mail ou senha incorretos.",
    "auth/invalid-credential": "E-mail ou senha incorretos.",
    "auth/missing-password": "Informe a senha.",
    "auth/too-many-requests": "Muitas tentativas. Aguarde um momento e tente novamente.",
    "auth/network-request-failed": "Falha de conexão. Verifique sua internet.",
  };
  return mapa[code] || "Não foi possível concluir. Tente novamente.";
}

function uid(){ return Math.random().toString(36).slice(2,10); }

function migrarEstado(parsed){
  state = Object.assign({}, DEFAULT_STATE, parsed);
  if(!Array.isArray(state.usuarios)) state.usuarios = [];
  if(!Array.isArray(state.clientes)) state.clientes = [];
  if(!Array.isArray(state.fornecedores)) state.fornecedores = [];
  if(!Array.isArray(state.contasBancarias)) state.contasBancarias = [];
  if(!Array.isArray(state.bancos) || !state.bancos.length) state.bancos = JSON.parse(JSON.stringify(DEFAULT_STATE.bancos));
  if(!Array.isArray(state.tiposTransacao) || !state.tiposTransacao.length) state.tiposTransacao = JSON.parse(JSON.stringify(DEFAULT_STATE.tiposTransacao));
  // migra contas bancárias antigas que ainda não possuem saldo inicial (conciliação bancária)
  state.contasBancarias = (state.contasBancarias||[]).map(c=>
    ("saldoInicial" in c) ? c : Object.assign({}, c, {saldoInicial:0, saldoInicialData:null})
  );
  state.categoriasDespesa = (state.categoriasDespesa||[]).map(c=>
    c.grupoDRE ? c : Object.assign({}, c, {grupoDRE:"administrativa"})
  );
  // migra lançamentos antigos que usavam o campo único "formaPagamento" (texto)
  state.lancamentos = (state.lancamentos||[]).map(l=>{
    if(l.tipoTransacaoId || !l.formaPagamento) return l;
    const match = state.tiposTransacao.find(t=>t.nome.toLowerCase() === String(l.formaPagamento).toLowerCase());
    return Object.assign({}, l, { tipoTransacaoId: match ? match.id : "" });
  });
}

function estaDigitandoEmFormulario(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = (el.tagName||"").toLowerCase();
  return (tag==="input" || tag==="textarea" || tag==="select") && !!el.closest("form");
}

function loadState(){
  if(!FIREBASE_READY){ ready = true; render(); return; }
  docRef.onSnapshot(
    async (snap)=>{
      if(snap.exists){
        const data = snap.data();
        try{
          const parsed = data.payload ? JSON.parse(data.payload) : null;
          if(parsed) migrarEstado(parsed);
        }catch(e){ console.warn("Payload inválido recebido do Firestore.", e); }
        lastUpdated = data.updatedAt && data.updatedAt.toDate ? data.updatedAt.toDate() : lastUpdated;
      } else {
        await saveState();
      }
      syncError = null;
      ready = true;
      render();
    },
    (err)=>{
      console.error("Erro de sincronização com o Firestore:", err);
      syncError = "Não foi possível conectar ao banco de dados. Verifique a configuração do Firebase e as regras do Firestore.";
      ready = true;
      render();
    }
  );
}

async function saveState(){
  if(!FIREBASE_READY) return;
  savingNow = true;
  try{
    await docRef.set({
      payload: JSON.stringify(state),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    syncError = null;
  }catch(e){
    console.error("Falha ao salvar no Firestore:", e);
    syncError = "Não foi possível salvar suas alterações. Verifique sua conexão com a internet.";
  }
  savingNow = false;
}

function fmtMoney(v){

}
function ultimosNMeses(refYM, n){
  const ref = (refYM === "all" || !refYM) ? thisMonthYM() : refYM;
  const [y,m] = ref.split("-").map(Number);
  const meses = [];
  for(let i=n-1; i>=0; i--){
    const d = new Date(y, m-1-i, 1);
    meses.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  return meses;
}
function sparklineSVG(valores, cor){
  const comDados = valores.filter(v => v !== 0).length;
  if(comDados < 2){
    return `<div style="font-size:9px; color:var(--ink-soft); text-align:right; line-height:1.3; max-width:60px;">Histórico insuficiente</div>`;
  }
  const w=52, h=26;
  const max = Math.max(...valores);
  const min = Math.min(...valores);
  const range = (max-min) || 1;
  const step = valores.length>1 ? w/(valores.length-1) : w;
  const pontos = valores.map((v,i)=> `${(i*step).toFixed(1)},${(h-((v-min)/range)*h).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pontos}" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function progressRingSVG(pct, cor){
  const clamped = Math.max(0, Math.min(100, pct===null||!isFinite(pct) ? 0 : pct));
  return `<svg width="40" height="40" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--paper-line)" stroke-width="3.5"/>
    <circle cx="18" cy="18" r="15.5" fill="none" stroke="${cor}" stroke-width="3.5" stroke-dasharray="${clamped.toFixed(1)} 100" stroke-linecap="round" transform="rotate(-90 18 18)"/>
  </svg>`;
}
function prepararFatiasDonut(lista, max){
  const top = lista.slice(0, max);
  const outrosValor = lista.slice(max).reduce((a,c)=>a+c.valor,0);
  const fatias = top.map(c=>({nome:c.nome, valor:c.valor}));
  if(outrosValor > 0) fatias.push({nome:"Outros", valor:outrosValor});
  return fatias;
}
function donutSVG(fatias, cores){
  const total = fatias.reduce((a,f)=>a+f.valor,0);
  let offset = 25;
  let circulos = `<circle cx="21" cy="21" r="15.9" fill="transparent" stroke="var(--paper-line)" stroke-width="6"></circle>`;
  fatias.forEach((f,i)=>{
    const pct = total>0 ? (f.valor/total*100) : 0;
    circulos += `<circle cx="21" cy="21" r="15.9" fill="transparent" stroke="${cores[i%cores.length]}" stroke-width="6" stroke-dasharray="${pct.toFixed(2)} 100" stroke-dashoffset="${offset.toFixed(2)}"></circle>`;
    offset -= pct;
  });
  return `<svg width="92" height="92" viewBox="0 0 42 42">${circulos}</svg>`;
}
function evolucaoMensalSVG(seriesDados){
  const w=760, h=110;
  const n = seriesDados.length;
  const max = Math.max(1, ...seriesDados.map(x=>Math.max(x.r,x.d)));
  const step = n>1 ? w/(n-1) : w;
  const ptsR = seriesDados.map((x,i)=> `${(i*step).toFixed(1)},${(h-(x.r/max*h)).toFixed(1)}`).join(" ");
  const ptsD = seriesDados.map((x,i)=> `${(i*step).toFixed(1)},${(h-(x.d/max*h)).toFixed(1)}`).join(" ");
  return `
    <svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polygon points="0,${h} ${ptsR} ${w},${h}" fill="var(--green)" opacity="0.14"></polygon>
      <polyline points="${ptsR}" fill="none" stroke="var(--green)" stroke-width="2"></polyline>
      <polygon points="0,${h} ${ptsD} ${w},${h}" fill="var(--red)" opacity="0.12"></polygon>
      <polyline points="${ptsD}" fill="none" stroke="var(--red)" stroke-width="2"></polyline>
    </svg>
    <div style="display:flex; margin-top:6px;">
      ${seriesDados.map(x=>`<div style="flex:1; text-align:center; font-size:10.5px; color:var(--ink-soft);">${monthLabel(x.ym).split("/")[0]}</div>`).join("")}
    </div>
  `;
}
function trendBadge(pct, orientacaoAltaBoa, sufixo){
  if(pct === null || !isFinite(pct)) return "";
  const bom = orientacaoAltaBoa ? pct >= 0 : pct <= 0;
  const seta = pct >= 0 ? "↑" : "↓";
  const cor = bom ? "var(--green)" : "var(--red)";
  return `<div style="font-size:10.5px; color:${cor}; margin-top:2px;">${seta} ${Math.abs(pct).toFixed(1)}${sufixo||"%"} vs mês anterior</div>`;
}
function fmtDate(d){
  if(!d) return "—";
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${y}`;
}
function monthLabel(ym){
  const [y,m] = ym.split("-");
  const meses = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${meses[parseInt(m,10)-1]}/${y}`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function thisMonthYM(){ return new Date().toISOString().slice(0,7); }
function mesAnterior(ym){
  const [y,m] = ym.split("-").map(Number);
  const d = new Date(y, m-2, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}

function catName(tipo, id){
  const list = tipo === "receita" ? state.categoriasReceita : state.categoriasDespesa;
  const c = list.find(c=>c.id===id);
  return c ? c.nome : "—";
}
function lancamentosOrfaos(tipo){
  const cats = tipo === "receita" ? state.categoriasReceita : state.categoriasDespesa;
  const idsValidos = new Set(cats.map(c=>c.id));
  return state.lancamentos.filter(l=> l.tipo===tipo && l.categoriaId && !idsValidos.has(l.categoriaId));
}
function bancoName(id){
  const b = (state.bancos||[]).find(b=>b.id===id);
  return b ? b.nome : "—";
}
function tipoTransacaoName(id){
  const t = (state.tiposTransacao||[]).find(t=>t.id===id);
  return t ? t.nome : "—";
}
function formatDocumento(tipoPessoa, raw){
  const d = String(raw||"").replace(/\D/g,"");
  if(tipoPessoa === "juridica"){
    if(d.length !== 14) return raw || "—";
    return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5");
  }
  if(d.length !== 11) return raw || "—";
  return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
}
function bancoNomeById(id){
  const b = (state.bancos||[]).find(b=>b.id===id);
  return b ? b.nome : "";
}
function statusPill(status){
  const cls = status === "Pago" ? "pago" : status === "Atrasado" ? "atrasado" : status === "Pendente" ? "pendente" : "";
  return `<span class="status-pill ${cls}">${status||"—"}</span>`;
}
function contaLabel(id){
  const c = (state.contasBancarias||[]).find(c=>c.id===id);
  if(!c) return "";
  const banco = bancoNomeById(c.bancoId);
  const partes = [banco, c.agencia?`Ag ${c.agencia}`:"", c.numero?`Cc ${c.numero}`:"", c.tipoConta].filter(Boolean);
  return partes.join(" · ");
}

function attachAuthHandlers(){
  const loginForm = document.getElementById("loginForm");
  if(loginForm){
    loginForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const fd = new FormData(loginForm);
      const email = String(fd.get("email")||"").trim();
      const senha = String(fd.get("senha")||"");
      authBusy = true; authError = null; render();
      try{
        await auth.signInWithEmailAndPassword(email, senha);
        // onAuthStateChanged cuida do resto
      }catch(err){
        authBusy = false;
        authError = traduzErroAuth(err.code);
        render();
      }
    });
  }
  const btnEsqueciSenha = document.getElementById("btnEsqueciSenha");
  if(btnEsqueciSenha) btnEsqueciSenha.addEventListener("click", ()=>{
    authView = "esqueci"; authError = null; authMsg = null; render();
  });
  const btnVoltarLogin = document.getElementById("btnVoltarLogin");
  if(btnVoltarLogin) btnVoltarLogin.addEventListener("click", ()=>{
    authView = "login"; authError = null; authMsg = null; render();
  });
  const forgotForm = document.getElementById("forgotForm");
  if(forgotForm){
    forgotForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const fd = new FormData(forgotForm);
      const email = String(fd.get("email")||"").trim();
      authBusy = true; authError = null; authMsg = null; render();
      try{
        await auth.sendPasswordResetEmail(email);
        authBusy = false;
        authMsg = "Link de redefinição enviado! Confira sua caixa de entrada (e o spam).";
        render();
      }catch(err){
        authBusy = false;
        authError = traduzErroAuth(err.code);
        render();
      }
    });
  }
}

function getAvailableMonths(){
  const set = new Set(state.lancamentos.map(l=>l.data.slice(0,7)));
  set.add(thisMonthYM());
  return Array.from(set).sort().reverse();
}

function getAvailableCompetencias(){
  const set = new Set(state.lancamentos.map(l=>l.competencia || l.data.slice(0,7)));
  set.add(thisMonthYM());
  return Array.from(set).sort().reverse();
}

/* ---------------------------------------------------------
   DASHBOARD
--------------------------------------------------------- */
function filteredByPeriod(list, period){
  if(period === "all") return list;
  return list.filter(l=>l.data.slice(0,7) === period);
}

function dashboardView(){
  const usandoCompetenciaDash = dashCompetenciaPeriod !== "all";
  const lancs = usandoCompetenciaDash
    ? state.lancamentos.filter(l => (l.competencia || l.data.slice(0,7)) === dashCompetenciaPeriod)
    : filteredByPeriod(state.lancamentos, dashPeriod);
  const receitas = lancs.filter(l=>l.tipo==="receita");
  const despesas = lancs.filter(l=>l.tipo==="despesa");
  const totalR = receitas.reduce((a,l)=>a+Number(l.valor),0);
  const totalD = despesas.reduce((a,l)=>a+Number(l.valor),0);
  const saldo = totalR - totalD;
  const margem = totalR > 0 ? (saldo/totalR*100) : null;

  let variR = null, variD = null, variSaldo = null, variMargem = null;
  const periodoAtivoDash = usandoCompetenciaDash ? dashCompetenciaPeriod : dashPeriod;
  if(periodoAtivoDash !== "all"){
    const anterior = mesAnterior(periodoAtivoDash);
    const lancsAnt = usandoCompetenciaDash
      ? state.lancamentos.filter(l => (l.competencia || l.data.slice(0,7)) === anterior)
      : filteredByPeriod(state.lancamentos, anterior);
    const totalRAnt = lancsAnt.filter(l=>l.tipo==="receita").reduce((a,l)=>a+Number(l.valor),0);
    const totalDAnt = lancsAnt.filter(l=>l.tipo==="despesa").reduce((a,l)=>a+Number(l.valor),0);
    const saldoAnt = totalRAnt - totalDAnt;
    const margemAnt = totalRAnt > 0 ? (saldoAnt/totalRAnt*100) : null;
    if(totalRAnt > 0) variR = (totalR-totalRAnt)/totalRAnt*100;
    if(totalDAnt > 0) variD = (totalD-totalDAnt)/totalDAnt*100;
    if(saldoAnt !== 0) variSaldo = (saldo-saldoAnt)/Math.abs(saldoAnt)*100;
    if(margem !== null && margemAnt !== null) variMargem = margem - margemAnt;
  }

  const seriesMeses = ultimosNMeses(periodoAtivoDash, 6);
  const seriesDados = seriesMeses.map(ym=>{
    const l = usandoCompetenciaDash
      ? state.lancamentos.filter(x => (x.competencia || x.data.slice(0,7)) === ym)
      : filteredByPeriod(state.lancamentos, ym);
    const r = l.filter(x=>x.tipo==="receita").reduce((a,x)=>a+Number(x.valor),0);
    const d = l.filter(x=>x.tipo==="despesa").reduce((a,x)=>a+Number(x.valor),0);
    return { ym, r, d, saldo: r-d, margem: r>0 ? (r-d)/r*100 : 0 };
  });
  const serieR = seriesDados.map(x=>x.r);
  const serieD = seriesDados.map(x=>x.d);
  const serieSaldo = seriesDados.map(x=>x.saldo);

  const porCategoria = (list, cats) => {
    const map = {};
    list.forEach(l=>{ map[l.categoriaId] = (map[l.categoriaId]||0) + Number(l.valor); });
    return cats
      .map(c=>({nome:c.nome, valor: map[c.id]||0}))
      .filter(c=>c.valor>0)
      .sort((a,b)=>b.valor-a.valor);
  };
  const catR = porCategoria(receitas, state.categoriasReceita);
  const catD = porCategoria(despesas, state.categoriasDespesa);
  const maxR = Math.max(1, ...catR.map(c=>c.valor));
  const maxD = Math.max(1, ...catD.map(c=>c.valor));

  const recentes = [...lancs].sort((a,b)=> b.data.localeCompare(a.data) || b.id.localeCompare(a.id)).slice(0,4);

  const emAberto = state.lancamentos.filter(l=>l.status==="Pendente" || l.status==="Atrasado");
  const atrasados = emAberto.filter(l=>l.status==="Atrasado");
  const pendentes = emAberto.filter(l=>l.status==="Pendente");
  const totalAtrasados = atrasados.reduce((a,l)=>a+Number(l.valor),0);
  const totalPendentes = pendentes.reduce((a,l)=>a+Number(l.valor),0);

  const saldoContas = state.contasBancarias.map(c=>{
    const movs = state.lancamentos.filter(l=>l.contaId===c.id);
    const r = movs.filter(l=>l.tipo==="receita").reduce((a,l)=>a+Number(l.valor),0);
    const d = movs.filter(l=>l.tipo==="despesa").reduce((a,l)=>a+Number(l.valor),0);
    return { nome: `${bancoNomeById(c.bancoId)||"—"}${c.numero?" · Cc "+c.numero:""}`, saldo: r-d, movs: movs.length };
  }).filter(c=>c.movs>0).sort((a,b)=>Math.abs(b.saldo)-Math.abs(a.saldo));
  const maxSaldoConta = Math.max(1, ...saldoContas.map(c=>Math.abs(c.saldo)));

  const topClientes = (()=>{
    const map = {};
    receitas.forEach(l=>{
      const key = (l.parte||"").trim();
      if(!key) return;
      map[key] = (map[key]||0) + Number(l.valor);
    });
    return Object.entries(map).map(([nome,valor])=>({nome,valor})).sort((a,b)=>b.valor-a.valor).slice(0,5);
  })();
  const maxTopCliente = Math.max(1, ...topClientes.map(c=>c.valor));

  return `
    ${(atrasados.length || pendentes.length) ? `
    <div class="pending-alert">
      ${atrasados.length ? `
        <div class="pa-item atrasado" data-nav="lancamentos">
          <span class="pa-dot"></span>
          <div><strong>${atrasados.length}</strong> lançamento(s) atrasado(s) <span class="pa-val">R$ ${fmtMoney(totalAtrasados)}</span></div>
        </div>` : ""}
      ${pendentes.length ? `
        <div class="pa-item pendente" data-nav="lancamentos">
          <span class="pa-dot"></span>
          <div><strong>${pendentes.length}</strong> lançamento(s) pendente(s) <span class="pa-val">R$ ${fmtMoney(totalPendentes)}</span></div>
        </div>` : ""}
    </div>` : ""}
    <div class="cards-row cards-row-4">
      <div class="card acc-green">
        <div class="card-top">
          <div>
            <div class="kpi-label">Receitas</div>
            <div class="kpi-value green">R$ ${fmtMoney(totalR)}</div>
          </div>
          ${sparklineSVG(serieR, "var(--green)")}
        </div>
        <div class="kpi-sub">${receitas.length} lançamento(s)</div>
        ${trendBadge(variR, true)}
      </div>
      <div class="card acc-red">
        <div class="card-top">
          <div>
            <div class="kpi-label">Despesas</div>
            <div class="kpi-value red">R$ ${fmtMoney(totalD)}</div>
          </div>
          ${sparklineSVG(serieD, "var(--red)")}
        </div>
        <div class="kpi-sub">${despesas.length} lançamento(s)</div>
        ${trendBadge(variD, false)}
      </div>
      <div class="card ${saldo>=0?'acc-green':'acc-red'}">
        <div class="card-top">
          <div>
            <div class="kpi-label">Saldo</div>
            <div class="kpi-value" style="color:${saldo>=0 ? 'var(--green)':'var(--red)'}">R$ ${fmtMoney(saldo)}</div>
          </div>
          ${sparklineSVG(serieSaldo, saldo>=0 ? "var(--navy-900)" : "var(--red)")}
        </div>
        <div class="kpi-sub">${saldo>=0 ? "Resultado positivo" : "Resultado negativo"}</div>
        ${trendBadge(variSaldo, true)}
      </div>
      <div class="card acc-navy">
        <div class="card-top">
          <div>
            <div class="kpi-label">Margem líquida</div>
            <div class="kpi-value" style="color:var(--navy-900)">${margem===null ? "—" : margem.toFixed(1)+"%"}</div>
          </div>
          ${progressRingSVG(margem===null ? 0 : margem, "var(--gold)")}
        </div>
        <div class="kpi-sub">${margem===null ? "Sem receita no período" : (margem>=20 ? "Patamar saudável" : margem>=10 ? "Patamar razoável" : "Abaixo do recomendado")}</div>
        ${variMargem===null ? "" : trendBadge(variMargem, true, " pts")}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Evolução mensal</h2><span class="hint">últimos 6 meses · <span style="color:var(--green)">● Receita</span> &nbsp;<span style="color:var(--red)">● Despesa</span></span></div>
      ${evolucaoMensalSVG(seriesDados)}
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Receitas por classificação</h2><span class="hint">${usandoCompetenciaDash ? `Competência ${monthLabel(dashCompetenciaPeriod)}` : (dashPeriod==="all"?"todo o período":monthLabel(dashPeriod))}</span></div>
        ${catR.length ? catR.map(c=>`
          <div class="bar-row">
            <div class="label" title="${c.nome}">${c.nome}</div>
            <div class="bar-track"><div class="bar-fill green" style="width:${(c.valor/maxR*100).toFixed(1)}%"></div></div>
            <div class="bar-val">R$ ${fmtMoney(c.valor)}</div>
          </div>
        `).join("") : `<div class="empty-state"><div class="glyph">＋</div><div class="t">Nenhuma receita ainda</div></div>`}
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Despesas por classificação</h2></div>
        ${catD.length ? (()=>{
          const fatias = prepararFatiasDonut(catD, 5);
          const totalD2 = fatias.reduce((a,f)=>a+f.valor,0);
          const coresDespesa = ["#c94c4c","#d97a72","#e8a49a","#f0c3ba","#f7dbd4","#8a93a3"];
          return `
          <div style="display:flex; align-items:center; gap:20px;">
            ${donutSVG(fatias, coresDespesa)}
            <div style="display:flex; flex-direction:column; gap:8px; font-size:12px; flex:1; min-width:0;">
              ${fatias.map((f,i)=>`
                <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                  <div style="display:flex; align-items:center; gap:7px; min-width:0;">
                    <span style="width:8px;height:8px;border-radius:2px;background:${coresDespesa[i%coresDespesa.length]}; flex-shrink:0;"></span>
                    <span style="color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${f.nome}">${f.nome}</span>
                  </div>
                  <span class="mono" style="color:var(--ink-soft); flex-shrink:0;">${totalD2>0 ? (f.valor/totalD2*100).toFixed(0) : 0}%</span>
                </div>
              `).join("")}
            </div>
          </div>`;
        })() : `<div class="empty-state"><div class="glyph">＋</div><div class="t">Nenhuma despesa ainda</div></div>`}
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Saldo por conta bancária</h2><span class="hint">acumulado</span></div>
        ${saldoContas.length ? saldoContas.map(c=>`
          <div class="bar-row">
            <div class="label" title="${c.nome}">${c.nome}</div>
            <div class="bar-track"><div class="bar-fill ${c.saldo>=0?'green':'red'}" style="width:${(Math.abs(c.saldo)/maxSaldoConta*100).toFixed(1)}%"></div></div>
            <div class="bar-val" style="color:${c.saldo>=0?'var(--green)':'var(--red)'}">R$ ${fmtMoney(c.saldo)}</div>
          </div>
        `).join("") : `<div class="empty-state"><div class="glyph">🏦</div><div class="t">Nenhum lançamento vinculado a conta</div>Informe a conta bancária nos lançamentos para ver esse resumo.</div>`}
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Top clientes</h2><span class="hint">${usandoCompetenciaDash ? `Competência ${monthLabel(dashCompetenciaPeriod)}` : (dashPeriod==="all"?"todo o período":monthLabel(dashPeriod))}</span></div>
        ${topClientes.length ? topClientes.map((c,i)=>`
          <div class="bar-row">
            <div class="label" title="${c.nome}">${i+1}. ${c.nome}</div>
            <div class="bar-track"><div class="bar-fill green" style="width:${(c.valor/maxTopCliente*100).toFixed(1)}%"></div></div>
            <div class="bar-val">R$ ${fmtMoney(c.valor)}</div>
          </div>
        `).join("") : `<div class="empty-state"><div class="glyph">🧾</div><div class="t">Nenhuma receita com cliente informado</div></div>`}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Últimos lançamentos</h2>
        <span class="hint" style="cursor:pointer; text-decoration:underline;" data-nav="lancamentos">ver todos</span>
      </div>
      ${recentes.length ? `
      <table>
        <thead><tr><th>Data</th><th>Descrição</th><th>Classificação</th><th>Tipo</th><th>Status</th><th style="text-align:right">Valor</th></tr></thead>
        <tbody>
          ${recentes.map(l=>`
            <tr>
              <td class="mono">${fmtDate(l.data)}${l.competencia ? `<div style="font-size:10.5px;color:var(--ink-soft);margin-top:2px;">Comp: ${monthLabel(l.competencia)}</div>` : ""}</td>
              <td>${l.descricao || "—"}</td>
              <td>${catName(l.tipo, l.categoriaId)}</td>
              <td><span class="tag ${l.tipo}"><span class="bar"></span>${l.tipo==="receita"?"Receita":"Despesa"}</span></td>
              <td>${statusPill(l.status)}</td>
              <td class="mono" style="text-align:right; color:${l.tipo==="receita"?"var(--green)":"var(--red)"}">
                ${l.tipo==="receita"?"+":"−"} R$ ${fmtMoney(l.valor)}
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>` : `<div class="empty-state"><div class="glyph">📋</div><div class="t">Sem lançamentos no período</div></div>`}
    </div>
  `;
}

let editingId = null;

function lancamentoForm(tipo, existing){
  const cats = tipo === "receita" ? state.categoriasReceita : state.categoriasDespesa;
  const l = existing || { data: todayISO(), competencia: todayISO().slice(0,7), descricao:"", categoriaId: cats[0]?.id || "", subClassificacao:"", tipoResultado:"Resultado", tipoLancamento:"Realizado", valor:"", parte:"", bancoId: state.bancos[0]?.id || "", contaId: "", tipoTransacaoId: state.tiposTransacao[0]?.id || "", status:"Pago", obs:"" };
  const partLabel = tipo === "receita" ? "Cliente" : "Fornecedor";

  return `
    <div class="panel" style="max-width:760px;">
      <div class="panel-head">
        <h2>${existing ? "Editar" : "Novo"} lançamento — ${tipo === "receita" ? "Receita" : "Despesa"}</h2>
      </div>
      <form id="lancForm" class="form-grid">

/* ---------------------------------------------------------
   LISTA DE LANÇAMENTOS
--------------------------------------------------------- */
function lancamentosView(){
  if(editingId){
    const l = state.lancamentos.find(x=>x.id===editingId);
    if(l) return lancamentoForm(l.tipo, l);
  }

  let list = [...state.lancamentos];
  if(filters.tipo !== "todos") list = list.filter(l=>l.tipo===filters.tipo);
  if(filters.periodo !== "all") list = list.filter(l=>l.data.slice(0,7)===filters.periodo);
  if(filters.busca.trim()){
    const q = filters.busca.trim().toLowerCase();
    list = list.filter(l=> (l.descricao||"").toLowerCase().includes(q) || (l.parte||"").toLowerCase().includes(q) || catName(l.tipo,l.categoriaId).toLowerCase().includes(q));
  }
  list.sort((a,b)=> b.data.localeCompare(a.data) || b.id.localeCompare(a.id));
  listaLancamentosFiltrada = list;

  const totalR = list.filter(l=>l.tipo==="receita").reduce((a,l)=>a+Number(l.valor),0);
  const totalD = list.filter(l=>l.tipo==="despesa").reduce((a,l)=>a+Number(l.valor),0);
  const saldoFiltro = totalR - totalD;

  const months = getAvailableMonths();
  const filtroResumo = [
    filters.tipo !== "todos" ? (filters.tipo==="receita"?"Receitas":"Despesas") : null,
    filters.periodo !== "all" ? monthLabel(filters.periodo) : null,
    filters.busca.trim() ? `busca: "${filters.busca.trim()}"` : null,
  ].filter(Boolean).join(" · ") || "todos os lançamentos, sem filtro";

  return `
    <div class="panel">
      <div class="filters-row no-print" style="justify-content:space-between; align-items:center;">
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <select id="fTipo">
            <option value="todos" ${filters.tipo==="todos"?"selected":""}>Todos os tipos</option>
            <option value="receita" ${filters.tipo==="receita"?"selected":""}>Receitas</option>
            <option value="despesa" ${filters.tipo==="despesa"?"selected":""}>Despesas</option>
          </select>
          <select id="fPeriodo">
            <option value="all" ${filters.periodo==="all"?"selected":""}>Todo o período</option>
            ${months.map(m=>`<option value="${m}" ${filters.periodo===m?"selected":""}>${monthLabel(m)}</option>`).join("")}
          </select>
          <input id="fBusca" type="text" placeholder="Buscar por descrição, cliente/fornecedor ou classificação…" value="${filters.busca}" style="min-width:260px;" />
        </div>
        <div style="display:flex; gap:8px; flex-shrink:0;">
          <button class="btn ghost" id="btnExportExcelLancamentos">${ICONS.exportIc} Exportar Excel</button>
          <button class="btn ghost" id="btnPrintLancamentos">${ICONS.print} Imprimir / Salvar PDF</button>
        </div>
      </div>

      <div class="print-area">
        <div class="print-header">
          <img src="${LOGO_DARK_SRC}" alt="NFF Serviços LTDA" />
          <div>
            <div class="ph-title">NFF Serviços LTDA — Lançamentos</div>
            <div class="ph-sub">Filtro: ${filtroResumo} · Emitido em ${new Date().toLocaleString('pt-BR')}</div>
          </div>
        </div>

      ${list.length ? `
      <table>
        <thead><tr><th>Data</th><th>Descrição</th><th>Classificação</th><th>Pagamento</th><th>Tipo</th><th>Status</th><th style="text-align:right">Valor</th><th></th></tr></thead>
        <tbody>
          ${list.map(l=>`
            <tr>
              <td class="mono">${fmtDate(l.data)}${l.competencia ? `<div style="font-size:10.5px;color:var(--ink-soft);margin-top:2px;">Comp: ${monthLabel(l.competencia)}</div>` : ""}</td>
              <td>${l.descricao||"—"}${l.parte?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${l.parte}</div>`:""}</td>
              <td>${catName(l.tipo,l.categoriaId)}</td>
              <td>${bancoName(l.bancoId)}${l.tipoTransacaoId?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${tipoTransacaoName(l.tipoTransacaoId)}</div>`:""}${l.contaId?`<div style="font-size:11px;color:var(--ink-soft);">${contaLabel(l.contaId)}</div>`:""}</td>
              <td><span class="tag ${l.tipo}"><span class="bar"></span>${l.tipo==="receita"?"Receita":"Despesa"}</span></td>
              <td>${statusPill(l.status)}</td>
              <td class="mono" style="text-align:right; color:${l.tipo==="receita"?"var(--green)":"var(--red)"}">
                ${l.tipo==="receita"?"+":"−"} R$ ${fmtMoney(l.valor)}
              </td>
              <td class="no-print">
                ${podeEditar() ? `
                <div class="row-actions">
                  <button class="icon-btn" data-edit="${l.id}" title="Editar">${ICONS.edit}</button>
                  <button class="icon-btn danger" data-del="${l.id}" title="Excluir">${ICONS.trash}</button>
                </div>` : ""}
              </td>
            </tr>
          `).join("")}
        </tbody>
        <tfoot>
          <tr class="totals-row">
            <td colspan="6">${list.length} lançamento(s) · Receitas <span class="mono" style="color:var(--green)">R$ ${fmtMoney(totalR)}</span> · Despesas <span class="mono" style="color:var(--red)">R$ ${fmtMoney(totalD)}</span></td>
            <td class="mono" style="text-align:right; color:${saldoFiltro>=0?'var(--green)':'var(--red)'}">R$ ${fmtMoney(saldoFiltro)}</td>
            <td></td>
          </tr>
        </tfoot>
      </table>` : `<div class="empty-state"><div class="glyph">📋</div><div class="t">Nenhum lançamento encontrado</div>Ajuste os filtros ou registre um novo lançamento.</div>`}
      </div>
    </div>
  `;
}

function opcoesCategorias(tipo){
  const cats = tipo === "receita" ? state.categoriasReceita : state.categoriasDespesa;
  const contagemNomes = {};
  cats.forEach(c=>{ contagemNomes[c.nome] = (contagemNomes[c.nome]||0) + 1; });
  return cats.map(c=>{
    let rotulo = c.nome;
    if(tipo === "despesa"){
      rotulo += ` — ${GRUPOS_DRE[c.grupoDRE] || GRUPOS_DRE.administrativa}`;
    } else if(contagemNomes[c.nome] > 1){
      rotulo += ` (ID ${c.id.slice(-5)})`;
    }
    return `<option value="${c.id}">${rotulo}</option>`;
  }).join("");
}

function catItem(c, tipo){
  const grupoTag = tipo === "despesa" ? `<span class="role-pill">${GRUPOS_DRE[c.grupoDRE] || GRUPOS_DRE.administrativa}</span>` : "";
  return `
    <div class="cat-item">
      <div class="name"><span class="tag ${tipo}"><span class="bar"></span></span>${c.nome} ${grupoTag}</div>
      ${podeEditar() ? `<button class="icon-btn danger" data-delcat="${tipo}:${c.id}" title="Remover">${ICONS.trash}</button>` : ""}
    </div>
  `;
}

function conciliacaoView(){
  if(!state.contasBancarias.length){
    return `
      <div class="panel">
        <div class="empty-state">
          <div class="glyph">🏦</div>
          <div class="t">Nenhuma conta bancária cadastrada</div>
          Cadastre uma conta em <strong>Cadastros → Bancos e Pagamentos</strong> para iniciar a conciliação bancária.
        </div>
      </div>
    `;
  }

  if(!conciliacaoContaId || !state.contasBancarias.some(c=>c.id===conciliacaoContaId)){
    conciliacaoContaId = state.contasBancarias[0].id;
  }
  const conta = state.contasBancarias.find(c=>c.id===conciliacaoContaId);

  if(editingSaldoInicial){
    return `
      ${conciliacaoSeletorContas()}
      ${saldoInicialForm(conta)}
    `;
  }

  const saldoInicial = Number(conta.saldoInicial) || 0;

  let movs = state.lancamentos.filter(l=>l.contaId===conta.id);
  if(conciliacaoPeriodo !== "all") movs = movs.filter(l=>l.data.slice(0,7)===conciliacaoPeriodo);
  movs = [...movs].sort((a,b)=> a.data.localeCompare(b.data) || a.id.localeCompare(b.id));

  // saldo corrente sempre parte do saldo inicial da conta, mesmo com filtro de período aplicado
  const movsAnteriores = conciliacaoPeriodo === "all" ? [] : state.lancamentos.filter(l=>l.contaId===conta.id && l.data.slice(0,7) < conciliacaoPeriodo);
  const saldoArraste = saldoInicial + movsAnteriores.reduce((a,l)=> a + (l.tipo==="receita" ? Number(l.valor) : -Number(l.valor)), 0);

  const totalEntradas = movs.filter(l=>l.tipo==="receita").reduce((a,l)=>a+Number(l.valor),0);
  const totalSaidas = movs.filter(l=>l.tipo==="despesa").reduce((a,l)=>a+Number(l.valor),0);

  let corrente = saldoArraste;
  const linhas = movs.map(l=>{
    corrente += (l.tipo==="receita" ? Number(l.valor) : -Number(l.valor));
    return { l, saldoCorrente: corrente };
  });
  const saldoAtual = corrente;

  const months = getAvailableMonths();

  return `
    ${conciliacaoSeletorContas()}

    <div class="cards-row cards-row-4">
      <div class="card acc-navy">
        <div class="card-top">
          <div>
            <div class="kpi-label">Saldo inicial</div>
            <div class="kpi-value" style="color:var(--navy-900)">R$ ${fmtMoney(saldoInicial)}</div>
          </div>
        </div>
        <div class="kpi-sub">${conta.saldoInicialData ? "Referência: "+fmtDate(conta.saldoInicialData) : "Ainda não definido"}</div>
      </div>
      <div class="card acc-green">
        <div class="card-top">
          <div>
            <div class="kpi-label">Entradas no período</div>
            <div class="kpi-value green">R$ ${fmtMoney(totalEntradas)}</div>
          </div>
        </div>
        <div class="kpi-sub">${movs.filter(l=>l.tipo==="receita").length} lançamento(s)</div>
      </div>
      <div class="card acc-red">
        <div class="card-top">
          <div>
            <div class="kpi-label">Saídas no período</div>
            <div class="kpi-value red">R$ ${fmtMoney(totalSaidas)}</div>
          </div>
        </div>
        <div class="kpi-sub">${movs.filter(l=>l.tipo==="despesa").length} lançamento(s)</div>
      </div>
      <div class="card ${saldoAtual>=0?'acc-green':'acc-red'}">
        <div class="card-top">
          <div>
            <div class="kpi-label">Saldo atual da conta</div>
            <div class="kpi-value" style="color:${saldoAtual>=0 ? 'var(--green)':'var(--red)'}">R$ ${fmtMoney(saldoAtual)}</div>
          </div>
        </div>
        <div class="kpi-sub">${saldoAtual>=0 ? "Posição positiva" : "Posição negativa"}</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head" style="justify-content:space-between;">
        <h2>Extrato — ${contaLabel(conta.id)}</h2>
        ${podeEditar() ? `<button class="btn ghost" id="btnDefinirSaldoInicial">${ICONS.edit} ${conta.saldoInicialData ? "Alterar saldo inicial" : "Definir saldo inicial"}</button>` : ""}
      </div>
      <div class="filters-row no-print" style="justify-content:space-between; align-items:center;">
        <select id="conciliacaoPeriodoSel">
          <option value="all" ${conciliacaoPeriodo==="all"?"selected":""}>Todo o período</option>
          ${months.map(m=>`<option value="${m}" ${conciliacaoPeriodo===m?"selected":""}>${monthLabel(m)}</option>`).join("")}
        </select>
        <button class="btn ghost" id="btnPrintConciliacao">${ICONS.print} Imprimir / Salvar PDF</button>
      </div>

      <div class="print-area">
        <div class="print-header">
          <img src="${LOGO_DARK_SRC}" alt="NFF Serviços LTDA" />
          <div>
            <div class="ph-title">NFF Serviços LTDA — Conciliação Bancária</div>
            <div class="ph-sub">${contaLabel(conta.id)} · ${conciliacaoPeriodo==="all" ? "Todo o período" : monthLabel(conciliacaoPeriodo)} · Emitido em ${new Date().toLocaleString('pt-BR')}</div>
          </div>
        </div>

        ${linhas.length ? `
        <table>
          <thead><tr><th>Data</th><th>Descrição</th><th>Classificação</th><th>Tipo</th><th>Status</th><th style="text-align:right">Valor</th><th style="text-align:right">Saldo corrente</th><th></th></tr></thead>
          <tbody>
            <tr>
              <td class="mono" colspan="6" style="color:var(--ink-soft);">Saldo inicial ${conciliacaoPeriodo!=="all" ? "(arrastado até o início do período)" : ""}</td>
              <td class="mono" style="text-align:right; font-weight:700;">R$ ${fmtMoney(saldoArraste)}</td>
              <td></td>
            </tr>
            ${linhas.map(({l,saldoCorrente})=>`
              <tr>
                <td class="mono">${fmtDate(l.data)}</td>
                <td>${l.descricao||"—"}${l.parte?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${l.parte}</div>`:""}</td>
                <td>${catName(l.tipo,l.categoriaId)}</td>
                <td><span class="tag ${l.tipo}"><span class="bar"></span>${l.tipo==="receita"?"Receita":"Despesa"}</span></td>
                <td>${statusPill(l.status)}</td>
                <td class="mono" style="text-align:right; color:${l.tipo==="receita"?"var(--green)":"var(--red)"}">
                  ${l.tipo==="receita"?"+":"−"} R$ ${fmtMoney(l.valor)}
                </td>
                <td class="mono" style="text-align:right; font-weight:600; color:${saldoCorrente>=0?'var(--green)':'var(--red)'}">R$ ${fmtMoney(saldoCorrente)}</td>
                <td class="no-print">
                  ${podeEditar() ? `
                  <div class="row-actions">
                    <button class="icon-btn" data-editlanc-conciliacao="${l.id}" title="Editar">${ICONS.edit}</button>
                  </div>` : ""}
                </td>
              </tr>
            `).join("")}
          </tbody>
          <tfoot>
            <tr class="totals-row">
              <td colspan="6">${linhas.length} lançamento(s) nesta conta · Entradas <span class="mono" style="color:var(--green)">R$ ${fmtMoney(totalEntradas)}</span> · Saídas <span class="mono" style="color:var(--red)">R$ ${fmtMoney(totalSaidas)}</span></td>
              <td class="mono" style="text-align:right; color:${saldoAtual>=0?'var(--green)':'var(--red)'}">R$ ${fmtMoney(saldoAtual)}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>` : `
        <div class="empty-state">
          <div class="glyph">📄</div>
          <div class="t">Nenhum lançamento nesta conta ${conciliacaoPeriodo!=="all" ? "no período selecionado" : ""}</div>
          Saldo inicial da conta: <strong>R$ ${fmtMoney(saldoArraste)}</strong>
        </div>`}
      </div>
    </div>
  `;
}

function initials(nome){
  const parts = (nome||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return (parts[0][0] + (parts.length>1 ? parts[parts.length-1][0] : "")).toUpperCase();
}

function dreReport(){
  const usandoCompetencia = dreCompetenciaPeriod !== "all";
  const lancsBase = usandoCompetencia
    ? state.lancamentos.filter(l => (l.competencia || l.data.slice(0,7)) === dreCompetenciaPeriod)
    : filteredByPeriod(state.lancamentos, drePeriod);
  const lancs = lancsBase.filter(l => (l.tipoResultado || "Resultado") !== "Operacional");
  const excluidosOperacional = lancsBase.length - lancs.length;
  const receitas = lancs.filter(l=>l.tipo==="receita");
  const despesas = lancs.filter(l=>l.tipo==="despesa");

  const receitaBruta = receitas.reduce((a,l)=>a+Number(l.valor),0);

  const somaGrupo = (grupo) => despesas
    .filter(l=> (catGrupoDRE(l.categoriaId) === grupo))
    .reduce((a,l)=>a+Number(l.valor),0);

  const impostos = somaGrupo("imposto");
  const receitaLiquida = receitaBruta - impostos;
  const custos = somaGrupo("custo");
  const lucroBruto = receitaLiquida - custos;
  const adminstrativas = somaGrupo("administrativa");
  const resultado = lucroBruto - adminstrativas;

  const detalhe = (grupo) => {
    const map = {};
    despesas.filter(l=>catGrupoDRE(l.categoriaId)===grupo).forEach(l=>{
      map[l.categoriaId] = (map[l.categoriaId]||0) + Number(l.valor);
    });
    return state.categoriasDespesa
      .filter(c=>c.grupoDRE===grupo && map[c.id])
      .map(c=>({nome:c.nome, valor:map[c.id]}));
  };

  const linhaSub = (nome, valor) => `
    <tr class="line-sub"><td class="label">${nome}</td><td class="val">R$ ${fmtMoney(valor)}</td></tr>
  `;

  const margemBruta = receitaBruta > 0 ? (lucroBruto/receitaBruta*100) : 0;
  const margemOperacional = receitaBruta > 0 ? (resultado/receitaBruta*100) : 0;

  return `
    <div class="panel">
      <div class="panel-head">
        <h2>Demonstração do Resultado do Exercício</h2>
        <span class="hint">${usandoCompetencia ? `Competência: ${monthLabel(dreCompetenciaPeriod)}` : (drePeriod==="all" ? "todo o período (por data)" : monthLabel(drePeriod)+" (por data)")}</span>
      </div>

      ${receitas.length===0 && despesas.length===0 ? `
        <div class="empty-state"><div class="glyph">📊</div><div class="t">Sem dados para o período selecionado</div>Registre receitas e despesas para gerar a DRE.</div>
      ` : `
      <table class="dre-table">
        <tbody>
          <tr class="line-main positivo"><td class="label">(+) RECEITA OPERACIONAL BRUTA</td><td class="val">R$ ${fmtMoney(receitaBruta)}</td></tr>
          ${porCategoriaReceita(receitas).map(c=>linhaSub(c.nome, c.valor)).join("")}

          <tr class="line-main negativo"><td class="label">(−) IMPOSTOS</td><td class="val">− R$ ${fmtMoney(impostos)}</td></tr>
          ${detalhe("imposto").map(c=>linhaSub(c.nome, c.valor)).join("")}

          <tr class="line-total ${receitaLiquida>=0?'positivo':'negativo'}"><td class="label">(=) RECEITA OPERACIONAL LÍQUIDA</td><td class="val">R$ ${fmtMoney(receitaLiquida)}</td></tr>

          <tr class="line-main negativo"><td class="label">(−) CUSTOS</td><td class="val">− R$ ${fmtMoney(custos)}</td></tr>
          ${detalhe("custo").map(c=>linhaSub(c.nome, c.valor)).join("")}

          <tr class="line-total ${lucroBruto>=0?'positivo':'negativo'}"><td class="label">(=) LUCRO BRUTO</td><td class="val">R$ ${fmtMoney(lucroBruto)}</td></tr>

          <tr class="line-main negativo"><td class="label">(−) DESPESAS</td><td class="val">− R$ ${fmtMoney(adminstrativas)}</td></tr>
          ${detalhe("administrativa").map(c=>linhaSub(c.nome, c.valor)).join("")}

          <tr class="line-total ${resultado>=0?'positivo':'negativo'}"><td class="label">(=) LUCRO OPERACIONAL</td><td class="val">R$ ${fmtMoney(resultado)}</td></tr>
        </tbody>
      </table>

      <div class="dre-margin">
        <div class="mcard">
          <div class="kpi-label">Margem Bruta</div>
          <div class="mv" style="color:${margemBruta>=0?'var(--green)':'var(--red)'}">${margemBruta.toFixed(1)}%</div>
        </div>
        <div class="mcard">
          <div class="kpi-label">Margem Operacional</div>
          <div class="mv" style="color:${margemOperacional>=0?'var(--green)':'var(--red)'}">${margemOperacional.toFixed(1)}%</div>
        </div>
      </div>

      <div class="dre-note">
        A DRE segue o modelo gerencial padrão para prestadoras de serviço: os impostos são deduzidos
        diretamente sobre a Receita Bruta (antes dos custos), pois incidem sobre o faturamento.
        As despesas são agrupadas conforme o grupo definido em cada classificação (Custo, Despesa ou Imposto),
        configurável em Cadastros → Classificações.
        ${excluidosOperacional > 0 ? `<br><strong>${excluidosOperacional} lançamento(s)</strong> marcado(s) como "Operacional" foram excluídos deste cálculo (não afetam o resultado).` : ""}
      </div>
      `}
    </div>
  `;
}

function catReport(tipo){
  const lancs = filteredByPeriod(state.lancamentos, drePeriod).filter(l=>l.tipo===tipo);
  const cats = tipo === "receita" ? state.categoriasReceita : state.categoriasDespesa;
  const map = {};
  lancs.forEach(l=>{ map[l.categoriaId] = (map[l.categoriaId]||0) + Number(l.valor); });
  const rows = cats
    .map(c=>({nome:c.nome, valor: map[c.id]||0, count: lancs.filter(l=>l.categoriaId===c.id).length}))
    .filter(r=>r.valor>0)
    .sort((a,b)=>b.valor-a.valor);
  const total = rows.reduce((a,r)=>a+r.valor,0);
  const max = Math.max(1, ...rows.map(r=>r.valor));
  const cor = tipo === "receita" ? "green" : "red";

  return `
    <div class="panel">
      <div class="panel-head">
        <h2>${tipo==="receita" ? "Receitas" : "Despesas"} por Classificação</h2>
        <span class="hint">${drePeriod==="all"?"todo o período":monthLabel(drePeriod)} · total R$ ${fmtMoney(total)}</span>
      </div>
      ${rows.length ? `
      <table>
        <thead><tr><th>Classificação</th><th>Lançamentos</th><th style="text-align:right">Valor</th><th style="text-align:right">% do total</th><th class="dist-col" style="min-width:160px">Distribuição</th></tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${r.nome}</td>
              <td class="mono">${r.count}</td>
              <td class="mono" style="text-align:right; color:var(--${cor})">R$ ${fmtMoney(r.valor)}</td>
              <td class="mono" style="text-align:right">${total>0 ? (r.valor/total*100).toFixed(1) : "0.0"}%</td>
              <td class="dist-col"><div class="bar-track" style="max-width:160px;"><div class="bar-fill ${cor}" style="width:${(r.valor/max*100).toFixed(1)}%"></div></div></td>
            </tr>
          `).join("")}
        </tbody>
      </table>` : `<div class="empty-state"><div class="glyph">📊</div><div class="t">Sem dados para o período selecionado</div></div>`}
    </div>
  `;
}

function fluxoCaixaReport(){
  const months = getAvailableMonths().slice().sort();
  const data = months.map(m=>{
    const lm = filteredByPeriod(state.lancamentos, m);
    const r = lm.filter(l=>l.tipo==="receita").reduce((a,l)=>a+Number(l.valor),0);
    const d = lm.filter(l=>l.tipo==="despesa").reduce((a,l)=>a+Number(l.valor),0);
    return {m, r, d, saldo:r-d};
  });
  const max = Math.max(1, ...data.map(x=>Math.max(x.r,x.d)));
  const temMovimento = data.some(x=>x.r>0 || x.d>0);

  return `
    <div class="panel">
      <div class="panel-head"><h2>Fluxo de Caixa Mensal</h2><span class="hint">${data.length} mês(es) no histórico</span></div>
      ${temMovimento ? `

        <tbody>
          ${data.map(x=>`
            <tr>
              <td class="mono">${monthLabel(x.m)}</td>
              <td class="mono" style="text-align:right; color:var(--green)">R$ ${fmtMoney(x.r)}</td>
              <td class="mono" style="text-align:right; color:var(--red)">R$ ${fmtMoney(x.d)}</td>
              <td class="mono" style="text-align:right; color:${x.saldo>=0?'var(--green)':'var(--red)'}">R$ ${fmtMoney(x.saldo)}</td>
              <td class="dist-col">
                <div class="bar-track" style="margin-bottom:3px;"><div class="bar-fill green" style="width:${(x.r/max*100).toFixed(1)}%"></div></div>
                <div class="bar-track"><div class="bar-fill red" style="width:${(x.d/max*100).toFixed(1)}%"></div></div>
              </td>
            </tr>

    </div>
  `;
}

function agruparReceitaDespesa(lancs, keyFn, labelFn){
  const map = {};
  lancs.forEach(l=>{
    const key = keyFn(l) || "__vazio__";
    if(!map[key]) map[key] = { label: labelFn(key, l), receita:0, despesa:0 };
    if(l.tipo === "receita") map[key].receita += Number(l.valor);
    else map[key].despesa += Number(l.valor);
  });
  return Object.values(map)
    .map(v=>Object.assign({}, v, { saldo: v.receita - v.despesa }))
    .sort((a,b)=> (b.receita+b.despesa) - (a.receita+a.despesa));
}

function carregarAcessos(){
  if(!FIREBASE_READY || !db) return;
  acessosCarregando = true;
  render();
  db.collection("nff_acessos").orderBy("entrada","desc").limit(300).get()
    .then(snap=>{
      acessosLog = snap.docs.map(d=>{
        const v = d.data();
        return {
          id: d.id,
          email: v.email || "—",
          entrada: v.entrada && v.entrada.toDate ? v.entrada.toDate() : null,
          saida: v.saida && v.saida.toDate ? v.saida.toDate() : null,
        };
      });
      acessosCarregado = true;
      acessosCarregando = false;
      render();
    })
    .catch(e=>{
      console.warn("Falha ao carregar acessos:", e);
      acessosCarregando = false;
      acessosCarregado = true;
      render();
    });
}

function fmtDuracao(entrada, saida){
  if(!entrada) return "—";
  const fim = saida || new Date();
  const ms = fim.getTime() - entrada.getTime();
  if(ms < 0) return "—";
  const min = Math.floor(ms/60000);
  const h = Math.floor(min/60);
  const m = min%60;
  return h > 0 ? `${h}h ${m}min` : `${m}min`;
}

function acessosView(){
  if(!acessosCarregado && !acessosCarregando) carregarAcessos();

  return `
