/* ---------------------------------------------------------
   DASHBOARD
--------------------------------------------------------- */
function filteredByPeriod(list, period){
  if(period === "all") return list;
  return list.filter(l=>l.data.slice(0,7) === period);
}

/* resumo financeiro (receitas, despesas, saldo, margem) de uma lista de lançamentos —
   usado por dashboard, lançamentos, análise e comparativos de período anterior */
function resumoFinanceiro(lista){
  const receitas = lista.filter(l=>l.tipo==="receita");
  const despesas = lista.filter(l=>l.tipo==="despesa");
  const totalR = receitas.reduce((a,l)=>a+Number(l.valor),0);
  const totalD = despesas.reduce((a,l)=>a+Number(l.valor),0);
  const saldo = totalR - totalD;
  const margem = totalR > 0 ? (saldo/totalR*100) : null;
  return { receitas, despesas, totalR, totalD, saldo, margem };
}

function dashboardView(){
  const usandoCompetenciaDash = dashCompetenciaPeriod !== "all";
  const filtrarContaDash = list => dashContaId === "all" ? list : list.filter(l => l.contaId === dashContaId);
  const baseDash = filtrarContaDash(state.lancamentos);
  const lancs = usandoCompetenciaDash
    ? baseDash.filter(l => (l.competencia || l.data.slice(0,7)) === dashCompetenciaPeriod)
    : filteredByPeriod(baseDash, dashPeriod);
  const { receitas, despesas, totalR, totalD, saldo, margem } = resumoFinanceiro(lancs);

  let variR = null, variD = null, variSaldo = null, variMargem = null;
  const periodoAtivoDash = usandoCompetenciaDash ? dashCompetenciaPeriod : dashPeriod;
  if(periodoAtivoDash !== "all"){
    const anterior = mesAnterior(periodoAtivoDash);
    const lancsAnt = usandoCompetenciaDash
      ? baseDash.filter(l => (l.competencia || l.data.slice(0,7)) === anterior)
      : filteredByPeriod(baseDash, anterior);
    const { totalR: totalRAnt, totalD: totalDAnt, saldo: saldoAnt, margem: margemAnt } = resumoFinanceiro(lancsAnt);
    if(totalRAnt > 0) variR = (totalR-totalRAnt)/totalRAnt*100;
    if(totalDAnt > 0) variD = (totalD-totalDAnt)/totalDAnt*100;
    if(saldoAnt !== 0) variSaldo = (saldo-saldoAnt)/Math.abs(saldoAnt)*100;
    if(margem !== null && margemAnt !== null) variMargem = margem - margemAnt;
  }

  const seriesMeses = ultimosNMeses(periodoAtivoDash, 6);
  const seriesDados = seriesMeses.map(ym=>{
    const l = usandoCompetenciaDash
      ? baseDash.filter(x => (x.competencia || x.data.slice(0,7)) === ym)
      : filteredByPeriod(baseDash, ym);
    const r = l.filter(x=>x.tipo==="receita").reduce((a,x)=>a+Number(x.valor),0);
    const d = l.filter(x=>x.tipo==="despesa").reduce((a,x)=>a+Number(x.valor),0);
    return { ym, r, d, saldo: r-d, margem: r>0 ? (r-d)/r*100 : 0 };
  });
  const serieR = seriesDados.map(x=>x.r);
  const serieD = seriesDados.map(x=>x.d);
  const serieSaldo = seriesDados.map(x=>x.saldo);

  const porCategoria = (list, cats) => {
    const map = {};
    list.forEach(l=>{ map[l.categoriaId] = (map[l.categoriaId]||0) + Number(l.valor); });
    return cats
      .map(c=>({nome:c.nome, valor: map[c.id]||0}))
      .filter(c=>c.valor>0)
      .sort((a,b)=>b.valor-a.valor);
  };
  const catR = porCategoria(receitas, state.categoriasReceita);
  const catD = porCategoria(despesas, state.categoriasDespesa);
  const maxR = Math.max(1, ...catR.map(c=>c.valor));
  const maxD = Math.max(1, ...catD.map(c=>c.valor));

  const recentes = [...lancs].sort((a,b)=> b.data.localeCompare(a.data) || b.id.localeCompare(a.id)).slice(0,4);

  const emAberto = baseDash.filter(l=>l.status==="Pendente" || l.status==="Atrasado");
  const atrasados = emAberto.filter(l=>l.status==="Atrasado");
  const pendentes = emAberto.filter(l=>l.status==="Pendente");
  const totalAtrasados = atrasados.reduce((a,l)=>a+Number(l.valor),0);
  const totalPendentes = pendentes.reduce((a,l)=>a+Number(l.valor),0);

  const saldoContas = state.contasBancarias.filter(c=>dashContaId === "all" || c.id === dashContaId).map(c=>{
    const movs = state.lancamentos.filter(l=>l.contaId===c.id);
    const r = movs.filter(l=>l.tipo==="receita").reduce((a,l)=>a+Number(l.valor),0);
    const d = movs.filter(l=>l.tipo==="despesa").reduce((a,l)=>a+Number(l.valor),0);
    return { nome: `${bancoNomeById(c.bancoId)||"—"}${c.numero?" · Cc "+c.numero:""}`, saldo: (Number(c.saldoInicial)||0) + r - d, movs: movs.length };
  }).filter(c=>c.movs>0).sort((a,b)=>Math.abs(b.saldo)-Math.abs(a.saldo));
  const maxSaldoConta = Math.max(1, ...saldoContas.map(c=>Math.abs(c.saldo)));

  // quando uma conta específica está selecionada no dashboard, o card de Saldo
  // deve partir do saldo inicial da conta — igual à Conciliação Bancária
  const contaDashSelecionada = dashContaId !== "all" ? state.contasBancarias.find(c=>c.id===dashContaId) : null;
  const saldoExibido = contaDashSelecionada ? (Number(contaDashSelecionada.saldoInicial)||0) + totalR - totalD : saldo;

  const topClientes = (()=>{
    const map = {};
    receitas.forEach(l=>{
      const key = (l.parte||"").trim();
      if(!key) return;
      map[key] = (map[key]||0) + Number(l.valor);
    });
    return Object.entries(map).map(([nome,valor])=>({nome,valor})).sort((a,b)=>b.valor-a.valor).slice(0,5);
  })();
  const maxTopCliente = Math.max(1, ...topClientes.map(c=>c.valor));

  return `
    ${(atrasados.length || pendentes.length) ? `
    <div class="pending-alert">
      ${atrasados.length ? `
        <div class="pa-item atrasado" data-nav="lancamentos">
          <span class="pa-dot"></span>
          <div><strong>${atrasados.length}</strong> lançamento(s) atrasado(s) <span class="pa-val">R$ ${fmtMoney(totalAtrasados)}</span></div>
        </div>` : ""}
      ${pendentes.length ? `
        <div class="pa-item pendente" data-nav="lancamentos">
          <span class="pa-dot"></span>
          <div><strong>${pendentes.length}</strong> lançamento(s) pendente(s) <span class="pa-val">R$ ${fmtMoney(totalPendentes)}</span></div>
        </div>` : ""}
    </div>` : ""}
    <div class="cards-row cards-row-4">
      <div class="card acc-green">
        <div class="card-top">
          <div>
            <div class="kpi-label">Receitas</div>
            <div class="kpi-value green">R$ ${fmtMoney(totalR)}</div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
            <span class="card-icon green">${ICONS.receita}</span>
            ${sparklineSVG(serieR, "var(--green)")}
          </div>
        </div>
        <div class="kpi-sub">${receitas.length} lançamento(s)</div>
        ${trendBadge(variR, true)}
      </div>
      <div class="card acc-red">
        <div class="card-top">
          <div>
            <div class="kpi-label">Despesas</div>
            <div class="kpi-value red">R$ ${fmtMoney(totalD)}</div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
            <span class="card-icon red">${ICONS.despesa}</span>
            ${sparklineSVG(serieD, "var(--red)")}
          </div>
        </div>
        <div class="kpi-sub">${despesas.length} lançamento(s)</div>
        ${trendBadge(variD, false)}
      </div>
      <div class="card card-featured ${saldoExibido>=0?'acc-green':'acc-red'}">
        <div class="card-top">
          <div>
            <div class="kpi-label">Saldo</div>
            <div class="kpi-value" style="color:${saldoExibido>=0 ? 'var(--green)':'var(--red)'}">R$ ${fmtMoney(saldoExibido)}</div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
            <span class="card-icon ${saldoExibido>=0?'green':'red'}">${ICONS.saldo}</span>
            ${sparklineSVG(serieSaldo, saldoExibido>=0 ? "var(--navy-900)" : "var(--red)")}
          </div>
        </div>
        <div class="kpi-sub">${contaDashSelecionada ? "Saldo atual da conta" : (saldoExibido>=0 ? "Resultado positivo" : "Resultado negativo")}</div>
        ${trendBadge(variSaldo, true)}
      </div>
      <div class="card acc-navy">
        <div class="card-top">
          <div>
            <div class="kpi-label">Margem líquida</div>
            <div class="kpi-value" style="color:var(--navy-900)">${margem===null ? "—" : margem.toFixed(1)+"%"}</div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
            <span class="card-icon navy">${ICONS.percent}</span>
            ${progressRingSVG(margem===null ? 0 : margem, "var(--gold)")}
          </div>
        </div>
        <div class="kpi-sub">${margem===null ? "Sem receita no período" : (margem>=20 ? "Patamar saudável" : margem>=10 ? "Patamar razoável" : "Abaixo do recomendado")}</div>
        ${variMargem===null ? "" : trendBadge(variMargem, true, " pts")}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Evolução mensal</h2><span class="hint">últimos 6 meses · <span style="color:var(--green)">● Receita</span> &nbsp;<span style="color:var(--red)">● Despesa</span></span></div>
      ${evolucaoMensalSVG(seriesDados)}
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Receitas por classificação</h2><span class="hint">${usandoCompetenciaDash ? `Competência ${monthLabel(dashCompetenciaPeriod)}` : (dashPeriod==="all"?"todo o período":monthLabel(dashPeriod))}</span></div>
        ${catR.length ? catR.map(c=>`
          <div class="bar-row">
            <div class="label" title="${c.nome}">${c.nome}</div>
            <div class="bar-track"><div class="bar-fill green" style="width:${(c.valor/maxR*100).toFixed(1)}%"></div></div>
            <div class="bar-val">R$ ${fmtMoney(c.valor)}</div>
          </div>
        `).join("") : `<div class="empty-state"><div class="glyph">＋</div><div class="t">Nenhuma receita ainda</div></div>`}
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Despesas por classificação</h2></div>
        ${catD.length ? (()=>{
          const fatias = prepararFatiasDonut(catD, 5);
          const totalD2 = fatias.reduce((a,f)=>a+f.valor,0);
          const coresDespesa = ["#c94c4c","#d97a72","#e8a49a","#f0c3ba","#f7dbd4","#8a93a3"];
          return `
          <div style="display:flex; align-items:center; gap:20px;">
            ${donutSVG(fatias, coresDespesa)}
            <div style="display:flex; flex-direction:column; gap:8px; font-size:12px; flex:1; min-width:0;">
              ${fatias.map((f,i)=>`
                <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                  <div style="display:flex; align-items:center; gap:7px; min-width:0;">
                    <span style="width:8px;height:8px;border-radius:2px;background:${coresDespesa[i%coresDespesa.length]}; flex-shrink:0;"></span>
                    <span style="color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${f.nome}">${f.nome}</span>
                  </div>
                  <span class="mono" style="color:var(--ink-soft); flex-shrink:0;">${totalD2>0 ? (f.valor/totalD2*100).toFixed(0) : 0}%</span>
                </div>
              `).join("")}
            </div>
          </div>`;
        })() : `<div class="empty-state"><div class="glyph">＋</div><div class="t">Nenhuma despesa ainda</div></div>`}
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Saldo por conta bancária</h2><span class="hint">acumulado</span></div>
        ${saldoContas.length ? saldoContas.map(c=>`
          <div class="bar-row">
            <div class="label" title="${c.nome}">${c.nome}</div>
            <div class="bar-track"><div class="bar-fill ${c.saldo>=0?'green':'red'}" style="width:${(Math.abs(c.saldo)/maxSaldoConta*100).toFixed(1)}%"></div></div>
            <div class="bar-val" style="color:${c.saldo>=0?'var(--green)':'var(--red)'}">R$ ${fmtMoney(c.saldo)}</div>
          </div>
        `).join("") : `<div class="empty-state"><div class="glyph">🏦</div><div class="t">Nenhum lançamento vinculado a conta</div>Informe a conta bancária nos lançamentos para ver esse resumo.</div>`}
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Top clientes</h2><span class="hint">${usandoCompetenciaDash ? `Competência ${monthLabel(dashCompetenciaPeriod)}` : (dashPeriod==="all"?"todo o período":monthLabel(dashPeriod))}</span></div>
        ${topClientes.length ? topClientes.map((c,i)=>`
          <div class="bar-row">
            <div class="label" title="${c.nome}">${i+1}. ${c.nome}</div>
            <div class="bar-track"><div class="bar-fill green" style="width:${(c.valor/maxTopCliente*100).toFixed(1)}%"></div></div>
            <div class="bar-val">R$ ${fmtMoney(c.valor)}</div>
          </div>
        `).join("") : `<div class="empty-state"><div class="glyph">🧾</div><div class="t">Nenhuma receita com cliente informado</div></div>`}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Últimos lançamentos</h2>
        <span class="hint" style="cursor:pointer; text-decoration:underline;" data-nav="lancamentos">ver todos</span>
      </div>
      ${recentes.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Data</th><th>Descrição</th><th>Classificação</th><th>Tipo</th><th>Status</th><th style="text-align:right">Valor</th></tr></thead>
        <tbody>
          ${recentes.map(l=>`
            <tr>
              <td class="mono">${fmtDate(l.data)}${l.competencia ? `<div style="font-size:10.5px;color:var(--ink-soft);margin-top:2px;">Comp: ${monthLabel(l.competencia)}</div>` : ""}</td>
              <td>${l.descricao || "—"}</td>
              <td>${catName(l.tipo, l.categoriaId)}</td>
              <td><span class="tag ${l.tipo}"><span class="bar"></span>${l.tipo==="receita"?"Receita":"Despesa"}</span></td>
              <td>${statusPill(l.status)}</td>
              <td class="mono" style="text-align:right; color:${l.tipo==="receita"?"var(--green)":"var(--red)"}">
                ${l.tipo==="receita"?"+":"−"} R$ ${fmtMoney(l.valor)}
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>` : `<div class="empty-state"><div class="glyph">📋</div><div class="t">Sem lançamentos no período</div></div>`}
      </div>
    </div>
  `;
}

/* ---------------------------------------------------------
   FORMULÁRIO DE LANÇAMENTO (RECEITA / DESPESA)
--------------------------------------------------------- */
let editingId = null;

function lancamentoForm(tipo, existing){
  const cats = tipo === "receita" ? state.categoriasReceita : state.categoriasDespesa;
  const l = existing || { data: todayISO(), competencia: todayISO().slice(0,7), descricao:"", categoriaId: cats[0]?.id || "", subClassificacao:"", tipoResultado:"Resultado", tipoLancamento:"Realizado", valor:"", parte:"", bancoId: state.bancos[0]?.id || "", contaId: "", tipoTransacaoId: state.tiposTransacao[0]?.id || "", status:"Pago", obs:"" };
  const partLabel = tipo === "receita" ? "Cliente" : "Fornecedor";

  return `
    <div class="panel" style="max-width:760px;">
      <div class="panel-head">
        <h2>${existing ? "Editar" : "Novo"} lançamento — ${tipo === "receita" ? "Receita" : "Despesa"}</h2>
      </div>
      <form id="lancForm" class="form-grid">
        <div class="field">
          <label class="req">Data</label>
          <input type="date" name="data" value="${l.data}" required />
        </div>
        <div class="field">
          <label>Competência</label>
          <input type="month" name="competencia" value="${l.competencia || (l.data||todayISO()).slice(0,7)}" title="Mês a que essa receita/despesa se refere, mesmo que paga em outro mês" />
        </div>
        <div class="field">
          <label class="req">Classificação</label>
          <select name="categoriaId" required>
            ${cats.length ? cats.map(c=>`<option value="${c.id}" ${l.categoriaId===c.id?"selected":""}>${c.nome}</option>`).join("")
              : `<option value="">Cadastre uma classificação primeiro</option>`}
          </select>
        </div>
        <div class="field">
          <label>Sub-Classificação</label>
          <input type="text" name="subClassificacao" list="subClassificacaoDatalist" placeholder="Opcional" value="${l.subClassificacao||""}" />
          <datalist id="subClassificacaoDatalist">
            ${Array.from(new Set(state.lancamentos.filter(x=>x.tipo===tipo && x.subClassificacao).map(x=>x.subClassificacao))).map(s=>`<option value="${s}">`).join("")}
          </datalist>
        </div>
        <div class="field full">
          <label class="req">Descrição</label>
          <input type="text" name="descricao" placeholder="Ex: ${tipo==='receita' ? 'Contrato mensal de limpeza — Ed. Aurora' : 'Compra de material de limpeza'}" value="${l.descricao}" required />
        </div>
        <div class="field">
          <label>${partLabel}</label>
          <input type="text" name="parte" list="parteDatalist" placeholder="Nome do ${partLabel.toLowerCase()} (cadastrado ou novo)" value="${l.parte||""}" />
          <datalist id="parteDatalist">
            ${(tipo === "receita" ? state.clientes : state.fornecedores).map(p=>`<option value="${p.nome}">`).join("")}
          </datalist>
        </div>
        <div class="field money">
          <label class="req">Valor (R$)</label>
          <input type="text" inputmode="decimal" id="campoValorLancamento" name="valor" placeholder="0,00" value="${l.valor ? fmtMoney(l.valor) : ''}" required />
        </div>
        <div class="field full form-divider"><span>Pagamento</span></div>
        <div class="field">
          <label>Banco</label>
          <select name="bancoId">
            ${state.bancos.length ? state.bancos.map(b=>`<option value="${b.id}" ${l.bancoId===b.id?"selected":""}>${b.nome}</option>`).join("")
              : `<option value="">Cadastre um banco em Cadastros → Bancos e Pagamentos</option>`}
          </select>
        </div>
        <div class="field">
          <label>Conta bancária</label>
          <select name="contaId">
            <option value="">— Não informar —</option>
            ${state.contasBancarias.map(c=>`<option value="${c.id}" ${l.contaId===c.id?"selected":""}>${contaLabel(c.id)}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Tipo de transação</label>
          <select name="tipoTransacaoId">
            ${state.tiposTransacao.length ? state.tiposTransacao.map(t=>`<option value="${t.id}" ${l.tipoTransacaoId===t.id?"selected":""}>${t.nome}</option>`).join("")
              : `<option value="">Cadastre um tipo em Cadastros → Bancos e Pagamentos</option>`}
          </select>
        </div>
        <div class="field full form-divider"><span>Outras informações</span></div>
        <div class="field">
          <label>Status</label>
          <select name="status">
            ${["Pago","Pendente","Atrasado"].map(f=>`<option ${l.status===f?"selected":""}>${f}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Tipo de lançamento</label>
          <select name="tipoLancamento">
            ${["Realizado","Previsto"].map(f=>`<option ${l.tipoLancamento===f?"selected":""}>${f}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Tipo de despesa</label>
          <select name="tipoResultado" title="Define se esse lançamento entra no cálculo da DRE">
            <option value="Resultado" ${l.tipoResultado==="Resultado"?"selected":""}>Resultado (vai pra DRE)</option>
            <option value="Operacional" ${l.tipoResultado==="Operacional"?"selected":""}>Operacional (não vai pra DRE)</option>
          </select>
        </div>
        <div class="field"></div>
        <div class="field full">
          <label>Observações</label>
          <textarea name="obs" placeholder="Opcional">${l.obs||""}</textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary ${tipo}">${existing? "Salvar alterações" : (tipo==="receita" ? "Registrar receita" : "Registrar despesa")}</button>
          ${existing ? `<button type="button" class="btn ghost" data-nav="lancamentos">Cancelar</button>` : ""}
        </div>
      </form>
    </div>
  `;
}

/* ---------------------------------------------------------
   LISTA DE LANÇAMENTOS
--------------------------------------------------------- */
function lancamentosView(){
  if(editingId){
    const l = state.lancamentos.find(x=>x.id===editingId);
    if(l) return lancamentoForm(l.tipo, l);
  }

  let list = [...state.lancamentos];
  if(filters.tipo !== "todos") list = list.filter(l=>l.tipo===filters.tipo);
  if(filters.periodo !== "all") list = list.filter(l=>l.data.slice(0,7)===filters.periodo);
  if(filters.contaId !== "all") list = list.filter(l=>l.contaId===filters.contaId);
  if(filters.dataDe) list = list.filter(l=>l.data >= filters.dataDe);
  if(filters.dataAte) list = list.filter(l=>l.data <= filters.dataAte);
  if(filters.busca.trim()){
    const q = filters.busca.trim().toLowerCase();
    list = list.filter(l=> (l.descricao||"").toLowerCase().includes(q) || (l.parte||"").toLowerCase().includes(q) || catName(l.tipo,l.categoriaId).toLowerCase().includes(q));
  }
  list.sort((a,b)=> b.data.localeCompare(a.data) || b.id.localeCompare(a.id));
  listaLancamentosFiltrada = list;

  const totalPaginas = Math.max(1, Math.ceil(list.length / LANCAMENTOS_POR_PAGINA));
  if(lancamentosPagina > totalPaginas) lancamentosPagina = totalPaginas;
  if(lancamentosPagina < 1) lancamentosPagina = 1;
  const inicioPagina = (lancamentosPagina-1) * LANCAMENTOS_POR_PAGINA;
  const listaPagina = lancamentosImprimirTudo ? list : list.slice(inicioPagina, inicioPagina + LANCAMENTOS_POR_PAGINA);

  const { totalR, totalD, saldo: saldoFiltro } = resumoFinanceiro(list);

  const months = getAvailableMonths();
  const filtroResumo = [
    filters.tipo !== "todos" ? (filters.tipo==="receita"?"Receitas":"Despesas") : null,
    filters.periodo !== "all" ? monthLabel(filters.periodo) : null,
    filters.dataDe ? `data de: ${fmtDate(filters.dataDe)}` : null,
    filters.dataAte ? `data até: ${fmtDate(filters.dataAte)}` : null,
    filters.contaId !== "all" ? `conta: "${contaLabel(filters.contaId) || "Conta removida"}"` : null,
    filters.busca.trim() ? `busca: "${filters.busca.trim()}"` : null,
  ].filter(Boolean).join(" · ") || "todos os lançamentos, sem filtro";

  return `
    <div class="panel">
      <div class="filters-row no-print" style="justify-content:space-between; align-items:center;">
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <select id="fTipo">
            <option value="todos" ${filters.tipo==="todos"?"selected":""}>Todos os tipos</option>
            <option value="receita" ${filters.tipo==="receita"?"selected":""}>Receitas</option>
            <option value="despesa" ${filters.tipo==="despesa"?"selected":""}>Despesas</option>
          </select>
          <select id="fPeriodo">
            <option value="all" ${filters.periodo==="all"?"selected":""}>Todo o período</option>
            ${months.map(m=>`<option value="${m}" ${filters.periodo===m?"selected":""}>${monthLabel(m)}</option>`).join("")}
          </select>
          <select id="fConta">
            <option value="all" ${filters.contaId==="all"?"selected":""}>Todas as contas</option>
            ${state.contasBancarias.map(c=>`<option value="${c.id}" ${filters.contaId===c.id?"selected":""}>${contaLabel(c.id)}</option>`).join("")}
          </select>
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap;">DATA DE</span>
            <input id="fDataDe" type="date" value="${filters.dataDe||""}" title="Data de início" style="width:145px;" />
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap;">DATA ATÉ</span>
            <input id="fDataAte" type="date" value="${filters.dataAte||""}" title="Data final" style="width:145px;" />
          </div>
          <input id="fBusca" type="text" placeholder="Buscar por descrição, cliente/fornecedor ou classificação…" value="${filters.busca}" style="min-width:260px;" />
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn ghost" id="btnExportExcelLancamentos">${ICONS.exportIc} Exportar Excel</button>
          <button class="btn ghost" id="btnPrintLancamentos">${ICONS.print} Imprimir / Salvar PDF</button>
        </div>
      </div>

      <div class="print-area">
        <div class="print-header">
          <img src="${LOGO_DARK_SRC}" alt="NFF Serviços LTDA" />
          <div>
            <div class="ph-title">NFF Serviços LTDA — Lançamentos</div>
            <div class="ph-sub">Filtro: ${filtroResumo} · Emitido em ${new Date().toLocaleString('pt-BR')}</div>
          </div>
        </div>

      ${list.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Data</th><th>Descrição</th><th>Classificação</th><th>Pagamento</th><th>Tipo</th><th>Status</th><th style="text-align:right">Valor</th><th></th></tr></thead>
        <tbody>
          ${listaPagina.map(l=>`
            <tr>
              <td class="mono">${fmtDate(l.data)}${l.competencia ? `<div style="font-size:10.5px;color:var(--ink-soft);margin-top:2px;">Comp: ${monthLabel(l.competencia)}</div>` : ""}</td>
              <td>${l.descricao||"—"}${l.parte?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${l.parte}</div>`:""}</td>
              <td>
                ${catName(l.tipo,l.categoriaId)}
                ${l.subClassificacao ? `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:3px;">${l.subClassificacao}</div>` : ""}
              </td>

function opcoesCategorias(tipo){
  const cats = tipo === "receita" ? state.categoriasReceita : state.categoriasDespesa;
  const contagemNomes = {};
  cats.forEach(c=>{ contagemNomes[c.nome] = (contagemNomes[c.nome]||0) + 1; });
  return cats.map(c=>{
    let rotulo = c.nome;
    if(tipo === "despesa"){
      rotulo += ` — ${GRUPOS_DRE[c.grupoDRE] || GRUPOS_DRE.administrativa}`;
    } else if(contagemNomes[c.nome] > 1){
      rotulo += ` (ID ${c.id.slice(-5)})`;
    }
    return `<option value="${c.id}">${rotulo}</option>`;
  }).join("");
}

function catItem(c, tipo){
  const grupoTag = tipo === "despesa" ? `<span class="role-pill">${GRUPOS_DRE[c.grupoDRE] || GRUPOS_DRE.administrativa}</span>` : "";
  return `
    <div class="cat-item">
      <div class="name"><span class="tag ${tipo}"><span class="bar"></span></span>${c.nome} ${grupoTag}</div>
      ${podeEditar() ? `<button class="icon-btn danger" data-delcat="${tipo}:${c.id}" title="Remover">${ICONS.trash}</button>` : ""}
    </div>
  `;
}

function conciliacaoView(){
  if(!state.contasBancarias.length){
    return `
      <div class="panel">
        <div class="empty-state">
          <div class="glyph">🏦</div>
          <div class="t">Nenhuma conta bancária cadastrada</div>
          Cadastre uma conta em <strong>Cadastros → Bancos e Pagamentos</strong> para iniciar a conciliação bancária.
        </div>
      </div>
    `;
  }

  if(!conciliacaoContaId || !state.contasBancarias.some(c=>c.id===conciliacaoContaId)){
    conciliacaoContaId = state.contasBancarias[0].id;
  }
  const conta = state.contasBancarias.find(c=>c.id===conciliacaoContaId);

  if(editingSaldoInicial){
    return `
      ${conciliacaoSeletorContas()}
      ${saldoInicialForm(conta)}
    `;
  }

  const saldoInicial = Number(conta.saldoInicial) || 0;

  let movs = state.lancamentos.filter(l=>l.contaId===conta.id);
  if(conciliacaoPeriodo !== "all") movs = movs.filter(l=>l.data.slice(0,7)===conciliacaoPeriodo);
  movs = [...movs].sort((a,b)=> a.data.localeCompare(b.data) || a.id.localeCompare(b.id));

  // saldo corrente sempre parte do saldo inicial da conta, mesmo com filtro de período aplicado
  const movsAnteriores = conciliacaoPeriodo === "all" ? [] : state.lancamentos.filter(l=>l.contaId===conta.id && l.data.slice(0,7) < conciliacaoPeriodo);
  const saldoArraste = saldoInicial + movsAnteriores.reduce((a,l)=> a + (l.tipo==="receita" ? Number(l.valor) : -Number(l.valor)), 0);

  const totalEntradas = movs.filter(l=>l.tipo==="receita").reduce((a,l)=>a+Number(l.valor),0);
  const totalSaidas = movs.filter(l=>l.tipo==="despesa").reduce((a,l)=>a+Number(l.valor),0);

  let corrente = saldoArraste;
  const linhas = movs.map(l=>{
    corrente += (l.tipo==="receita" ? Number(l.valor) : -Number(l.valor));
    return { l, saldoCorrente: corrente };
  });
  const saldoAtual = corrente;
  const saldoAtualPeriodo = saldoInicial + totalEntradas - totalSaidas;

  conciliacaoExportCache = {
    contaLabel: contaLabel(conta.id),
    periodoLabel: conciliacaoPeriodo === "all" ? "Todo o período" : monthLabel(conciliacaoPeriodo),
    saldoInicial, saldoArraste, saldoAtual, totalEntradas, totalSaidas,
    linhas: linhas.map(({l,saldoCorrente})=>({
      data: fmtDate(l.data),
      descricao: l.descricao || "",
      parte: l.parte || "",
      classificacao: catName(l.tipo, l.categoriaId),
      tipo: l.tipo === "receita" ? "Receita" : "Despesa",
      status: l.status || "",
      valor: (l.tipo==="receita" ? 1 : -1) * (Number(l.valor)||0),
      saldoCorrente,
    })),
  };

  const months = getAvailableMonths();

  // mesmo padrão de ícone + chip de tendência usado no Dashboard: compara
  // com o mês anterior da mesma conta, só quando um período específico
  // (não "todo o período") está selecionado.
  let variEntradas = null, variSaidas = null, variSaldoAtual = null;
  if(conciliacaoPeriodo !== "all"){
    const anterior = mesAnterior(conciliacaoPeriodo);
    const movsAnt = state.lancamentos.filter(l=>l.contaId===conta.id && l.data.slice(0,7)===anterior);
    const totalEntradasAnt = movsAnt.filter(l=>l.tipo==="receita").reduce((a,l)=>a+Number(l.valor),0);
    const totalSaidasAnt = movsAnt.filter(l=>l.tipo==="despesa").reduce((a,l)=>a+Number(l.valor),0);
    const saldoAtualAnt = saldoInicial + totalEntradasAnt - totalSaidasAnt;
    if(totalEntradasAnt > 0) variEntradas = (totalEntradas-totalEntradasAnt)/totalEntradasAnt*100;
    if(totalSaidasAnt > 0) variSaidas = (totalSaidas-totalSaidasAnt)/totalSaidasAnt*100;
    if(saldoAtualAnt !== 0) variSaldoAtual = (saldoAtualPeriodo-saldoAtualAnt)/Math.abs(saldoAtualAnt)*100;
  }

  return `
    ${conciliacaoSeletorContas()}

    <div class="cards-row cards-row-4">
      <div class="card acc-navy">
        <div class="card-top">
          <div>
            <div class="kpi-label">Saldo inicial</div>
            <div class="kpi-value" style="color:var(--navy-900)">R$ ${fmtMoney(saldoInicial)}</div>
          </div>
          <span class="card-icon navy">${ICONS.saldo}</span>
        </div>
        <div class="kpi-sub">${conta.saldoInicialData ? "Referência: "+fmtDate(conta.saldoInicialData) : "Ainda não definido"}</div>
      </div>
      <div class="card acc-green">
        <div class="card-top">
          <div>
            <div class="kpi-label">Entradas no período</div>
            <div class="kpi-value green">R$ ${fmtMoney(totalEntradas)}</div>
          </div>
          <span class="card-icon green">${ICONS.receita}</span>
        </div>
        <div class="kpi-sub">${movs.filter(l=>l.tipo==="receita").length} lançamento(s)</div>
        ${trendBadge(variEntradas, true)}
      </div>
      <div class="card acc-red">
        <div class="card-top">
          <div>
            <div class="kpi-label">Saídas no período</div>
            <div class="kpi-value red">R$ ${fmtMoney(totalSaidas)}</div>
          </div>
          <span class="card-icon red">${ICONS.despesa}</span>
        </div>
        <div class="kpi-sub">${movs.filter(l=>l.tipo==="despesa").length} lançamento(s)</div>
        ${trendBadge(variSaidas, false)}
      </div>
      <div class="card ${saldoAtualPeriodo>=0?'acc-green':'acc-red'}">
        <div class="card-top">
          <div>
            <div class="kpi-label">Saldo atual da conta</div>
            <div class="kpi-value" style="color:${saldoAtualPeriodo>=0 ? 'var(--green)':'var(--red)'}">R$ ${fmtMoney(saldoAtualPeriodo)}</div>
          </div>
          <span class="card-icon ${saldoAtualPeriodo>=0?'green':'red'}">${ICONS.saldo}</span>
        </div>
        <div class="kpi-sub">${saldoAtualPeriodo>=0 ? "Posição positiva" : "Posição negativa"}</div>
        ${trendBadge(variSaldoAtual, true)}
      </div>
    </div>

    <div class="panel">

function initials(nome){
  const parts = (nome||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return (parts[0][0] + (parts.length>1 ? parts[parts.length-1][0] : "")).toUpperCase();
}

function dreReport(){
  const usandoCompetencia = dreCompetenciaPeriod !== "all";
  const lancsBase = usandoCompetencia
    ? state.lancamentos.filter(l => (l.competencia || l.data.slice(0,7)) === dreCompetenciaPeriod)
    : filteredByPeriod(state.lancamentos, drePeriod);
  const lancs = dreIncluirOperacional
    ? lancsBase
    : lancsBase.filter(l => (l.tipoResultado || "Resultado") !== "Operacional");
  const excluidosOperacional = lancsBase.length - lancs.length;
  const receitas = lancs.filter(l=>l.tipo==="receita");
  const despesas = lancs.filter(l=>l.tipo==="despesa");

  const receitaBruta = receitas.reduce((a,l)=>a+Number(l.valor),0);

  const somaGrupo = (grupo) => despesas
    .filter(l=> (catGrupoDRE(l.categoriaId) === grupo))
    .reduce((a,l)=>a+Number(l.valor),0);

  const impostos = somaGrupo("imposto");
  const receitaLiquida = receitaBruta - impostos;
  const custos = somaGrupo("custo");
  const lucroBruto = receitaLiquida - custos;
  const adminstrativas = somaGrupo("administrativa");
  const resultado = lucroBruto - adminstrativas;

  const detalhe = (grupo) => {
    const map = {};
    despesas.filter(l=>catGrupoDRE(l.categoriaId)===grupo).forEach(l=>{

function catReport(tipo){
  const lancs = filteredByPeriod(state.lancamentos, drePeriod).filter(l=>l.tipo===tipo);
  const cats = tipo === "receita" ? state.categoriasReceita : state.categoriasDespesa;
  const map = {};
  lancs.forEach(l=>{ map[l.categoriaId] = (map[l.categoriaId]||0) + Number(l.valor); });
  const rows = cats
    .map(c=>({nome:c.nome, valor: map[c.id]||0, count: lancs.filter(l=>l.categoriaId===c.id).length}))
    .filter(r=>r.valor>0)
    .sort((a,b)=>b.valor-a.valor);
  const total = rows.reduce((a,r)=>a+r.valor,0);
  const max = Math.max(1, ...rows.map(r=>r.valor));
  const cor = tipo === "receita" ? "green" : "red";

  return `
    <div class="panel">
      <div class="panel-head">
        <h2>${tipo==="receita" ? "Receitas" : "Despesas"} por Classificação</h2>
        <span class="hint">${drePeriod==="all"?"todo o período":monthLabel(drePeriod)} · total R$ ${fmtMoney(total)}</span>
      </div>
      ${rows.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Classificação</th><th>Lançamentos</th><th style="text-align:right">Valor</th><th style="text-align:right">% do total</th><th class="dist-col" style="min-width:160px">Distribuição</th></tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${r.nome}</td>
              <td class="mono">${r.count}</td>
              <td class="mono" style="text-align:right; color:var(--${cor})">R$ ${fmtMoney(r.valor)}</td>
              <td class="mono" style="text-align:right">${total>0 ? (r.valor/total*100).toFixed(1) : "0.0"}%</td>
              <td class="dist-col"><div class="bar-track" style="max-width:160px;"><div class="bar-fill ${cor}" style="width:${(r.valor/max*100).toFixed(1)}%"></div></div></td>
            </tr>
          `).join("")}
        </tbody>
      </table>` : `<div class="empty-state"><div class="glyph">📊</div><div class="t">Sem dados para o período selecionado</div></div>`}
      </div>
    </div>
  `;
}

function fluxoCaixaReport(){
  const months = getAvailableMonths().slice().sort();
  const data = months.map(m=>{
    const lm = filteredByPeriod(state.lancamentos, m);

    const d = lm.filter(l=>l.tipo==="despesa").reduce((a,l)=>a+Number(l.valor),0);

function agruparReceitaDespesa(lancs, keyFn, labelFn){
  const map = {};
  lancs.forEach(l=>{
    const key = keyFn(l) || "__vazio__";
    if(!map[key]) map[key] = { label: labelFn(key, l), receita:0, despesa:0 };
    if(l.tipo === "receita") map[key].receita += Number(l.valor);
    else map[key].despesa += Number(l.valor);
  });
  return Object.values(map)
    .map(v=>Object.assign({}, v, { saldo: v.receita - v.despesa }))
    .sort((a,b)=> (b.receita+b.despesa) - (a.receita+a.despesa));
}

function carregarAcessos(){
  if(!FIREBASE_READY || !db) return;
  acessosCarregando = true;
  render();
  db.collection("nff_acessos").orderBy("entrada","desc").limit(300).get()
    .then(snap=>{
      acessosLog = snap.docs.map(d=>{
        const v = d.data();
        return {
          id: d.id,
          email: v.email || "—",
          entrada: v.entrada && v.entrada.toDate ? v.entrada.toDate() : null,
          saida: v.saida && v.saida.toDate ? v.saida.toDate() : null,
        };
      });
      acessosCarregado = true;
      acessosCarregando = false;
      render();
    })
    .catch(e=>{
      console.warn("Falha ao carregar acessos:", e);
      acessosCarregando = false;
      acessosCarregado = true;
      render();
    });
}

function fmtDuracao(entrada, saida){
  if(!entrada) return "—";
  const fim = saida || new Date();
  const ms = fim.getTime() - entrada.getTime();
  if(ms < 0) return "—";
  const min = Math.floor(ms/60000);
  const h = Math.floor(min/60);
  const m = min%60;
  return h > 0 ? `${h}h ${m}min` : `${m}min`;
}

function acessosView(){
  if(!acessosCarregado && !acessosCarregando) carregarAcessos();

  return `

function analiseView(){
  const lancs = filteredByPeriod(state.lancamentos, analisePeriod);
  const { receitas, despesas, totalR, totalD, saldo, margem } = resumoFinanceiro(lancs);

  const positivos = [];
  const atencao = [];

  if(!lancs.length){
    return `
      <div class="report-tabs no-print">
        <div></div>
        <div>${periodSelector("analisePeriodSel", analisePeriod)}</div>
      </div>
      <div class="panel"><div class="empty-state"><div class="glyph">🔎</div><div class="t">Sem lançamentos no período selecionado</div>Registre receitas e despesas para gerar a análise.</div></div>
    `;
  }

  // resultado do período
  if(saldo > 0) positivos.push(`Resultado positivo de <strong>R$ ${fmtMoney(saldo)}</strong> no período${margem!==null?` (margem de ${margem.toFixed(1)}%)`:""}.`);
  else if(saldo < 0) atencao.push(`Resultado negativo de <strong>R$ ${fmtMoney(Math.abs(saldo))}</strong> no período — despesas superaram receitas.`);

  // comparação com mês anterior
  if(analisePeriod !== "all"){
    const anterior = mesAnterior(analisePeriod);
    const lancsAnt = filteredByPeriod(state.lancamentos, anterior);
    const { totalR: totalRAnt, totalD: totalDAnt } = resumoFinanceiro(lancsAnt);
    if(totalRAnt > 0){
      const variR = (totalR-totalRAnt)/totalRAnt*100;
      if(variR >= 5) positivos.push(`Receita cresceu <strong>${variR.toFixed(1)}%</strong> em relação ao mês anterior.`);
      else if(variR <= -5) atencao.push(`Receita caiu <strong>${Math.abs(variR).toFixed(1)}%</strong> em relação ao mês anterior.`);
    }
    if(totalDAnt > 0){
      const variD = (totalD-totalDAnt)/totalDAnt*100;
      if(variD <= -5) positivos.push(`Despesas caíram <strong>${Math.abs(variD).toFixed(1)}%</strong> em relação ao mês anterior.`);
      else if(variD >= 15) atencao.push(`Despesas subiram <strong>${variD.toFixed(1)}%</strong> em relação ao mês anterior — bem acima do usual.`);
    }
  }

  // margem líquida
  if(margem !== null){
    if(margem >= 20) positivos.push(`Margem líquida de <strong>${margem.toFixed(1)}%</strong> está em um patamar saudável para serviços terceirizados.`);
    else if(margem < 10) atencao.push(`Margem líquida de <strong>${margem.toFixed(1)}%</strong> está abaixo do recomendado para o setor (referência: 15–25%).`);
  }

  // concentração de clientes
  if(receitas.length){
    const porCliente = {};
    receitas.forEach(l=>{ const k=(l.parte||"").trim(); if(k) porCliente[k]=(porCliente[k]||0)+Number(l.valor); });
    const ranking = Object.entries(porCliente).sort((a,b)=>b[1]-a[1]);
    if(ranking.length){
      const [topNome, topValor] = ranking[0];
      const pct = topValor/totalR*100;
      if(pct >= 40) atencao.push(`O cliente <strong>${topNome}</strong> concentra <strong>${pct.toFixed(1)}%</strong> da receita do período — depender de poucos clientes é um risco.`);
      else if(ranking.length >= 3 && pct < 25) positivos.push(`Boa diversificação de carteira: nenhum cliente concentra mais que <strong>${pct.toFixed(0)}%</strong> da receita do período.`);
    }
  }

  // maior linha de despesa
  if(despesas.length){
    const porCat = {};
    despesas.forEach(l=>{ porCat[l.categoriaId]=(porCat[l.categoriaId]||0)+Number(l.valor); });
    const ranking = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
    if(ranking.length){
      const [catId, catValor] = ranking[0];
      const pct = catValor/totalD*100;
      const nome = catName("despesa", catId);
      if(pct >= 50) atencao.push(`<strong>${nome}</strong> representa <strong>${pct.toFixed(1)}%</strong> das despesas do período — é a maior linha de custo.`);
    }
  }

  // inadimplência (visão geral, não só do período)
  const emAberto = state.lancamentos.filter(l=>l.status==="Pendente" || l.status==="Atrasado");
  const atrasados = emAberto.filter(l=>l.status==="Atrasado");
  const pendentes = emAberto.filter(l=>l.status==="Pendente");
  if(atrasados.length){
    atencao.push(`<strong>${atrasados.length}</strong> lançamento(s) atrasado(s), somando <strong>R$ ${fmtMoney(atrasados.reduce((a,l)=>a+Number(l.valor),0))}</strong>.`);
  } else {
    positivos.push(`Nenhum lançamento atrasado no momento.`);
  }
  if(pendentes.length){
    atencao.push(`<strong>${pendentes.length}</strong> lançamento(s) pendente(s), somando <strong>R$ ${fmtMoney(pendentes.reduce((a,l)=>a+Number(l.valor),0))}</strong>.`);
  }

  return `
    <div class="report-tabs no-print">
      <div></div>
      <div>${periodSelector("analisePeriodSel", analisePeriod)}</div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Resumo do cenário</h2><span class="hint">${analisePeriod==="all"?"todo o período":monthLabel(analisePeriod)}</span></div>
      <div class="dre-margin">
        <div class="mcard">
          <div class="kpi-label">Resultado</div>
          <div class="mv" style="color:${saldo>=0?'var(--green)':'var(--red)'}">R$ ${fmtMoney(saldo)}</div>
        </div>
        <div class="mcard">
          <div class="kpi-label">Margem líquida</div>
          <div class="mv" style="color:var(--navy-900)">${margem===null?"—":margem.toFixed(1)+"%"}</div>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Pontos positivos</h2><span class="hint">${positivos.length}</span></div>
        ${positivos.length ? `<ul class="analise-list positivo">${positivos.map(p=>`<li>${p}</li>`).join("")}</ul>`
          : `<div class="empty-state"><div class="glyph">🙂</div><div class="t">Nada de especialmente positivo a destacar</div></div>`}
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Pontos de atenção</h2><span class="hint">${atencao.length}</span></div>

          : `<div class="empty-state"><div class="glyph">✅</div><div class="t">Nenhum ponto de atenção identificado</div></div>`}

      margem, concentração de clientes e despesas, e inadimplência). Não substitui a avaliação de um contador ou gestor financeiro.

}

function catGrupoDRE(categoriaId){
  const c = state.categoriasDespesa.find(c=>c.id===categoriaId);
  return c ? (c.grupoDRE || "administrativa") : "administrativa";
}

function porCategoriaReceita(receitas){
  const map = {};
  receitas.forEach(l=>{ map[l.categoriaId] = (map[l.categoriaId]||0) + Number(l.valor); });
  return state.categoriasReceita
    .filter(c=>map[c.id])
    .map(c=>({nome:c.nome, valor:map[c.id]}));
}


function gerencialDetalhesHtml(lancamentos, titulo, cor=""){
  const lista=[...lancamentos].sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  if(!lista.length) return `<div class="gerencial-detail"><div class="gerencial-detail-head">${titulo}</div><div class="gerencial-derived">Nenhum lançamento compõe este valor no filtro atual.</div></div>`;
  const total=lista.reduce((a,l)=>a+Number(l.valor||0),0);
  return `<div class="gerencial-detail">
    <div class="gerencial-detail-head">${titulo} · ${lista.length} lançamento(s) · ${fGerencialDetalhe(total)}</div>
    <div class="gerencial-detail-list">${lista.map(l=>{
      const banco=(state.bancos||[]).find(b=>b.id===l.bancoId);
      const conta=(state.contasBancarias||[]).find(c=>c.id===l.contaId);
      return `<div class="gerencial-detail-item">
        <div class="muted">${fmtDate(l.data)}</div>
        <div class="desc">${escGerencial(l.descricao||"Sem descrição")}<div class="muted">${escGerencial(l.subClassificacao||"")}</div></div>
        <div class="bank">${escGerencial(banco?.nome||"Banco não informado")}${conta?.numero?` · Conta ${escGerencial(conta.numero)}`:""}</div>
        <div class="money" style="color:${cor||"var(--ink)"}">${fGerencialDetalhe(Number(l.valor||0))}</div>
      </div>`;
    }).join("")}</div>
  </div>`;
}
function escGerencial(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function fGerencialDetalhe(v){return `${Number(v)<0?'-':''}R$ ${fmtMoney(Math.abs(Number(v)||0))}`;}

function analiseGerencialView(){
  const f = v => `${Number(v)<0?'-':''}R$ ${fmtMoney(Math.abs(Number(v)||0))}`;
  const pct = v => `${Number(v||0).toFixed(2).replace(".",",")}%`;
  const pct1 = v => `${Number(v||0).toFixed(1).replace(".",",")}%`;

  const competencias = getAvailableCompetencias();
  const periodo = gerencialCompetencia || "all";
  const period = periodo !== "all" ? periodo : (competencias[0] || thisMonthYM());
  const mesSeguinte = (()=>{ const [y,m]=period.split("-").map(Number); const d=new Date(y,m,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; })();
  const periodoLabel = periodo === "all" ? "TODO O PERÍODO" : monthLabelFull(period).toUpperCase();
  const proximoLabel = periodo === "all" ? "PROJEÇÃO" : monthLabelFull(mesSeguinte).toUpperCase();
  const capaPeriodo = (()=>{
    if(periodo === "all") return "TODO O PERÍODO";
    const meses = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
    const [anoP,mesP] = period.split("-").map(Number);
    const [anoS,mesS] = mesSeguinte.split("-").map(Number);
    return anoP===anoS ? `${meses[mesP-1]} / ${meses[mesS-1]} ${anoP}` : `${meses[mesP-1]}/${anoP} — ${meses[mesS-1]}/${anoS}`;
  })();
  const capaAno = periodo === "all" ? new Date().getFullYear() : Number(mesSeguinte.split("-")[0]);

  const filtroDataLanc = l => {
    const d = l.data || "";
    return !gerencialDataLanc || d === gerencialDataLanc;
  };
  const filtroBanco = l => gerencialBancoId === "all" || (l.bancoId || "") === gerencialBancoId;
  const filtroCompetencia = l => periodo === "all" || (l.competencia || l.data.slice(0,7)) === periodo;
  const filtroGerencial = l => filtroCompetencia(l) && filtroDataLanc(l) && filtroBanco(l);

  const baseCompetencia = state.lancamentos.filter(filtroGerencial);
  const baseResultado = baseCompetencia.filter(l => (l.tipoResultado || "Resultado") !== "Operacional");
  const receitas = baseResultado.filter(l=>l.tipo==="receita");
  const despesasLanc = baseResultado.filter(l=>l.tipo==="despesa");
  const somaGrupo = grupo => despesasLanc.filter(l=>catGrupoDRE(l.categoriaId)===grupo).reduce((a,l)=>a+Number(l.valor||0),0);

  const receitaBruta = receitas.reduce((a,l)=>a+Number(l.valor||0),0);
  const impostos = somaGrupo("imposto");
  const receitaLiquida = receitaBruta - impostos;
  const custos = somaGrupo("custo");
  const margemContrib = receitaLiquida - custos;
  const despesas = somaGrupo("administrativa");
  const resultado = margemContrib - despesas;
  const margemContribPct = receitaBruta>0 ? margemContrib/receitaBruta*100 : 0;
  const margemResultadoPct = receitaBruta>0 ? resultado/receitaBruta*100 : 0;

  // Caixa: somente lançamentos efetivamente pagos/recebidos na competência pela DATA.
  const caixaBase = state.lancamentos.filter(l => filtroGerencial(l) && l.status === "Pago");
  const caixaResultado = caixaBase.filter(l => (l.tipoResultado || "Resultado") !== "Operacional");
  const receitaRecebida = caixaResultado.filter(l=>l.tipo==="receita").reduce((a,l)=>a+Number(l.valor||0),0);
  const impostosPagos = caixaResultado.filter(l=>l.tipo==="despesa" && catGrupoDRE(l.categoriaId)==="imposto").reduce((a,l)=>a+Number(l.valor||0),0);
  const custosPagos = caixaResultado.filter(l=>l.tipo==="despesa" && catGrupoDRE(l.categoriaId)==="custo").reduce((a,l)=>a+Number(l.valor||0),0);
  const despesasPagas = caixaResultado.filter(l=>l.tipo==="despesa" && catGrupoDRE(l.categoriaId)==="administrativa").reduce((a,l)=>a+Number(l.valor||0),0);
  const receitaLiquidaCaixa = receitaRecebida - impostosPagos;
  const margemCaixa = receitaLiquidaCaixa - custosPagos;
  const resultadoCaixa = margemCaixa - despesasPagas;
  const diferenca = resultadoCaixa - resultado;

  // Lançamentos operacionais (ex.: mútuo), separados do resultado econômico.
  const operacionais = caixaBase.filter(l => (l.tipoResultado || "Resultado") === "Operacional");
  const mutuo = operacionais.reduce((a,l)=>a + (l.tipo==="receita" ? Number(l.valor||0) : -Number(l.valor||0)),0);

  // Saldo inicial estimado pelas contas bancárias, respeitando a data de referência de cada saldo.
  const saldoInicial = (state.contasBancarias||[]).reduce((total,c)=>{
    const ref = c.saldoInicialData || "0000-00-00";
    if(periodo === "all") return total + Number(c.saldoInicial||0);
    if(ref.slice(0,7) > period) return total;
    const antes = state.lancamentos.filter(l=>l.contaId===c.id && l.data.slice(0,7) < period && filtroDataLanc(l) && filtroBanco(l))
      .reduce((a,l)=>a + (l.tipo==="receita" ? Number(l.valor||0) : -Number(l.valor||0)),0);
    return total + Number(c.saldoInicial||0) + antes;
  },0);
  const saldoFinal = saldoInicial + baseCompetencia
    .reduce((a,l)=>a + (l.tipo==="receita" ? Number(l.valor||0) : -Number(l.valor||0)),0);

  // Ponto de equilíbrio calculado exclusivamente a partir dos lançamentos do período.
  const pe = margemContribPct>0 ? despesas/(margemContribPct/100) : null;
  const coberturaPE = pe && pe>0 ? receitaBruta/pe*100 : null;

  // Concentração da carteira baseada nas receitas lançadas na competência.
  const porCliente = {};
  receitas.forEach(l=>{ const k=(l.parte||"").trim() || "Sem cliente informado"; porCliente[k]=(porCliente[k]||0)+Number(l.valor||0); });
  const clientes = Object.entries(porCliente).sort((a,b)=>b[1]-a[1]).map(([nome,valor])=>({nome,valor,p:receitaBruta>0?valor/receitaBruta*100:0}));
  const topCliente = clientes[0] || null;
  const topDoisPct = clientes.slice(0,2).reduce((a,c)=>a+c.p,0);

  const recebimentoPct = receitaBruta>0 ? receitaRecebida/receitaBruta*100 : 0;
  const positivos=[]; const atencao=[];
  if(resultado>=0) positivos.push(`Resultado econômico de <strong>${f(resultado)}</strong>, com margem de <strong>${pct(margemResultadoPct)}</strong>.`);
  else atencao.push(`Resultado econômico negativo de <strong>${f(resultado)}</strong> no período.`);
  if(recebimentoPct>=80) positivos.push(`Boa conversão em caixa: <strong>${pct(recebimentoPct)}</strong> do faturamento da competência foi recebido no período de referência.`);
  else if(receitaBruta>0) atencao.push(`Apenas <strong>${pct(recebimentoPct)}</strong> do faturamento da competência foi recebido no período de referência; acompanhar contas a receber.`);
  if(topCliente && topCliente.p>=40) atencao.push(`O cliente <strong>${topCliente.nome}</strong> concentra <strong>${pct(topCliente.p)}</strong> da receita; há risco de concentração da carteira.`);
  else if(clientes.length>=3) positivos.push(`Carteira com <strong>${clientes.length}</strong> clientes identificados; o maior representa <strong>${pct(topCliente.p)}</strong> da receita.`);
  if(pe && receitaBruta>=pe) positivos.push(`Faturamento acima do ponto de equilíbrio em <strong>${f(receitaBruta-pe)}</strong>, cobrindo a estrutura de despesas do período.`);
  else if(pe) atencao.push(`Faturamento abaixo do ponto de equilíbrio em <strong>${f(pe-receitaBruta)}</strong>; é necessário ampliar receita ou reduzir despesas.`);
  if(operacionais.length) positivos.push(`Foram identificados <strong>${operacionais.length}</strong> lançamento(s) operacional(is), mantidos fora do resultado econômico.`);
  if(resultadoCaixa<resultado) atencao.push(`O resultado de caixa foi <strong>${f(resultadoCaixa)}</strong>, inferior ao resultado por competência em <strong>${f(Math.abs(diferenca))}</strong>.`);

  const diretivas=[];
  if(receitaBruta>0 && pe && receitaBruta<pe) diretivas.push(`<strong>Superar o ponto de equilíbrio:</strong> priorizar novos contratos e/ou aumento de faturamento até ${f(pe)}.`);
  if(topCliente && topCliente.p>=40) diretivas.push(`<strong>Diversificar a carteira:</strong> reduzir a dependência de ${topCliente.nome} com novos clientes relevantes.`);
  if(recebimentoPct<80) diretivas.push(`<strong>Acelerar recebimentos:</strong> acompanhar contas a receber e prazos de pagamento dos clientes.`);
  if(margemContribPct<30 && receitaBruta>0) diretivas.push(`<strong>Proteger margem:</strong> revisar custos classificados no grupo de custos para preservar a margem de contribuição.`);
  if(!diretivas.length) diretivas.push(`<strong>Manter disciplina:</strong> acompanhar margem, caixa, concentração de clientes e ponto de equilíbrio nos próximos períodos.`);

  const pctCell=(v,base)=>base?pct(v/base*100):"0,00%";

  return `
    <div class="gerencial-wrap">
      <div class="gerencial-toolbar no-print">
        <div>
          <div class="gerencial-kicker">Grupo NFF · Uso interno / Acionistas</div>

          <div class="gerencial-sub">Indicadores calculados diretamente dos lançamentos do sistema.</div>
        </div>
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
          <div style="display:flex;flex-direction:column;gap:4px;"><label style="font-size:10px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;">Data competência</label><select id="gerencialCompetenciaSel" class="period-select"><option value="all" ${gerencialCompetencia==="all"?"selected":""}>Todas as competências</option>${competencias.map(m=>`<option value="${m}" ${m===gerencialCompetencia?"selected":""}>${monthLabel(m)}</option>`).join("")}</select></div>
          <div style="display:flex;flex-direction:column;gap:4px;"><label style="font-size:10px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;">Data lançamento</label><input type="date" id="gerencialDataLanc" class="period-select" value="${gerencialDataLanc}" /></div>
          <div style="display:flex;flex-direction:column;gap:4px;"><label style="font-size:10px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;">Banco</label><select id="gerencialBancoSel" class="period-select"><option value="all" ${gerencialBancoId==="all"?"selected":""}>Todos os bancos</option>${(state.bancos||[]).map(b=>`<option value="${b.id}" ${b.id===gerencialBancoId?"selected":""}>${b.nome}</option>`).join("")}</select></div>
          <button class="btn ghost" id="btnPrintAnaliseGerencial">${ICONS.print} Imprimir / Salvar PDF</button>
        </div>

async function importJsonBackup(file){
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed || typeof parsed !== "object" || (!parsed.lancamentos && !parsed.categoriasReceita)){
        alert("Este arquivo .json não parece ser um backup válido do sistema NFF Financeiro.");
        return;
      }
      if(!(await confirmarAcao("Importar este backup vai substituir TODOS os dados atuais (lançamentos, classificações e usuários). Continuar?", {confirmLabel:"Substituir dados"}))) return;
      state = Object.assign({}, DEFAULT_STATE, parsed);
      if(!Array.isArray(state.usuarios)) state.usuarios = [];
      state.categoriasDespesa = (state.categoriasDespesa||[]).map(c=>
        c.grupoDRE ? c : Object.assign({}, c, {grupoDRE:"administrativa"})
      );
      await gravarLancamentosEmLote(state.lancamentos, { apagarAntesDeGravar:true });
      await gravarUsuariosEmLote(state.usuarios, { apagarAntesDeGravar:true });
      await saveConfig();
      render();
    }catch(err){
      alert("Não foi possível ler este arquivo .json. Verifique se é um backup válido gerado pelo botão \"Exportar dados\".");
    }
  };
  reader.onerror = ()=> alert("Falha ao ler o arquivo. Tente novamente.");
  reader.readAsText(file);
}

function getCell(row, aliases){
  const keys = Object.keys(row);
  for(const alias of aliases){
    const found = keys.find(k=> k.trim().toLowerCase() === alias);
    if(found !== undefined && String(row[found]).trim() !== "") return row[found];
  }
  return undefined;
}

function parseValor(raw){
  if(typeof raw === "number") return raw;
  const s = String(raw||"").replace(/[R$\s]/g,"").trim();
  if(!s) return NaN;
  if(s.includes(",") && s.lastIndexOf(",") > s.lastIndexOf(".")){
    return parseFloat(s.replace(/\./g,"").replace(",","."));
  }
  return parseFloat(s.replace(/,/g,""));
}

function parseDataCell(raw){
  if(raw instanceof Date && !isNaN(raw)){
    const off = raw.getTimezoneOffset();
    const d = new Date(raw.getTime() - off*60000);
    return d.toISOString().slice(0,10);
  }
  if(typeof raw === "number" && typeof XLSX !== "undefined"){
    const d = XLSX.SSF.parse_date_code(raw);
    if(d) return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
  }
  const s = String(raw||"").trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){
    const [d,m,y] = s.split("/");
    return `${y}-${m}-${d}`;
  }
  return null;
}

function parseCompetenciaCell(raw){
  if(raw instanceof Date && !isNaN(raw)){
    const off = raw.getTimezoneOffset();
    const d = new Date(raw.getTime() - off*60000);
    return d.toISOString().slice(0,7);
  }
  if(typeof raw === "number" && typeof XLSX !== "undefined"){
    const d = XLSX.SSF.parse_date_code(raw);
    if(d) return `${d.y}-${String(d.m).padStart(2,"0")}`;
  }
  const s = String(raw||"").trim();
  if(/^\d{4}-\d{2}$/.test(s)) return s;
  if(/^\d{2}\/\d{4}$/.test(s)){
    const [m,y] = s.split("/");
    return `${y}-${m}`;
  }
  const full = parseDataCell(raw);
  return full ? full.slice(0,7) : null;
}

function parseSpreadsheetRows(rows){
  const result = { added:0, errors:[], novosLancamentos:[] };
  rows.forEach((row, idx)=>{
    const linha = idx + 2; // +1 para header, +1 porque idx começa em 0
    try{
      const valorBruto = parseValor(getCell(row, ["valor","valor (r$)","valor(r$)"]));
      if(!isFinite(valorBruto) || valorBruto === 0) throw new Error(`coluna "Valor" ausente ou inválida`);
      const valor = Math.abs(valorBruto);

      const tipoRaw = String(getCell(row, ["tipo"]) || "").trim().toLowerCase();
      let tipo = null;
      if(tipoRaw.startsWith("r")) tipo = "receita";
      else if(tipoRaw.startsWith("d")) tipo = "despesa";
      if(!tipo){
        // sem coluna "Tipo" na planilha: infere pelo sinal do valor (negativo = despesa, positivo = receita)
        tipo = valorBruto < 0 ? "despesa" : "receita";
      }

      const dataISO = parseDataCell(getCell(row, ["data"]));
      if(!dataISO) throw new Error(`coluna "Data" ausente ou em formato inválido (use DD/MM/AAAA)`);

      const compRaw = getCell(row, ["competência","competencia","comp"]);
      const competencia = compRaw ? (parseCompetenciaCell(compRaw) || dataISO.slice(0,7)) : dataISO.slice(0,7);

      const descricao = String(getCell(row, ["descrição","descricao","desc"]) || "").trim();
      if(!descricao) throw new Error(`coluna "Descrição" ausente`);

      const categoriaNome = String(getCell(row, ["classificação","classificacao","categoria"]) || "").trim();
      if(!categoriaNome) throw new Error(`coluna "Classificação" ausente`);
      const cats = tipo === "receita" ? state.categoriasReceita : state.categoriasDespesa;
      let cat = cats.find(c=>c.nome.toLowerCase() === categoriaNome.toLowerCase());
      if(!cat){
        cat = { id: uid(), nome: categoriaNome };
        if(tipo === "despesa") cat.grupoDRE = "administrativa";
        cats.push(cat);
      }

      const parte = String(getCell(row, ["cliente/fornecedor","cliente","fornecedor","parte"]) || "").trim();

      const bancoNome = String(getCell(row, ["banco"]) || "").trim();
      let bancoId = "";
      if(bancoNome){
        let banco = state.bancos.find(b=>b.nome.toLowerCase() === bancoNome.toLowerCase());
        if(!banco){ banco = { id: uid(), nome: bancoNome }; state.bancos.push(banco); }
        bancoId = banco.id;
      }

      const contaRaw = String(getCell(row, ["conta","número da conta","numero da conta","nº da conta","n° da conta"]) || "").trim();
      let contaId = "";
      if(contaRaw){
        const digitosConta = contaRaw.replace(/\D/g,"");
        let conta = state.contasBancarias.find(c => digitosConta && String(c.numero||"").replace(/\D/g,"") === digitosConta);
        if(!conta && bancoId){
          // conta ainda não cadastrada: cria automaticamente vinculada ao banco da linha
          conta = { id: uid(), bancoId, tipoConta: "Corrente", agencia: "", numero: contaRaw, titular: "" };
          state.contasBancarias.push(conta);
        }
        if(conta) contaId = conta.id;
      }

      const tipoTransNome = String(getCell(row, ["tipo de transação","tipo de transacao","transação","transacao","forma de pagamento"]) || "").trim();
      let tipoTransacaoId = "";
      if(tipoTransNome){
        let tt = state.tiposTransacao.find(t=>t.nome.toLowerCase() === tipoTransNome.toLowerCase());
        if(!tt){ tt = { id: uid(), nome: tipoTransNome }; state.tiposTransacao.push(tt); }
        tipoTransacaoId = tt.id;
      }

      const status = String(getCell(row, ["status"]) || "Pago").trim() || "Pago";
      const obs = String(getCell(row, ["observações","observacoes","obs"]) || "").trim();

      const subClassificacao = String(getCell(row, ["sub-classificação","sub classificação","subclassificacao","sub-classificacao"]) || "").trim();

      const tipoDespRaw = String(getCell(row, ["tipo despesas","tipo de despesa","tipo despesa"]) || "").trim().toLowerCase();
      const tipoResultado = tipoDespRaw.startsWith("oper") ? "Operacional" : "Resultado";

      const tipoLancRaw = String(getCell(row, ["tipo de lançamento","tipo de lancamento","tipo lançamento"]) || "").trim().toLowerCase();
      const tipoLancamento = tipoLancRaw.startsWith("prev") ? "Previsto" : "Realizado";

      const novoLancamento = {
        id: uid(), tipo, data: dataISO, competencia, descricao, categoriaId: cat.id,
        subClassificacao, tipoResultado, tipoLancamento,
        valor, parte, bancoId, contaId, tipoTransacaoId, status, obs
      };
      state.lancamentos.push(novoLancamento);
      result.novosLancamentos.push(novoLancamento);
      result.added++;
    }catch(err){
      result.errors.push(`Linha ${linha}: ${err.message}`);
    }
  });
  return result;
}

function importSpreadsheet(file){
  if(typeof XLSX === "undefined"){
    alert("Não foi possível carregar o leitor de planilhas. Verifique sua conexão com a internet e tente novamente.");
    return;
  }
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:"array", cellDates:true});
      if(!wb.SheetNames.length) throw new Error("A planilha não contém nenhuma aba.");
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
      if(!rows.length){
        alert("Essa planilha está vazia ou não contém uma tabela de dados na primeira aba.");
        return;
      }
      const primeiraLinha = Object.keys(rows[0]).map(k=>k.trim().toLowerCase());
      const colunasEsperadas = ["data","descrição","classificação","valor"];
      const faltando = colunasEsperadas.filter(c=> !primeiraLinha.some(h=>h.includes(c.replace("ç","c").slice(0,4)) || h===c));
      if(faltando.length >= 3){
        alert("Essa planilha não parece seguir o modelo esperado.\n\n"+
          "Colunas mínimas: Data, Descrição, Classificação, Valor (e opcionalmente Tipo, Cliente/Fornecedor, Banco, Conta, Tipo de Transação, Status, Observações).\n\n"+
          "Se a planilha não tiver a coluna \"Tipo\", o sistema identifica Receita/Despesa automaticamente pelo sinal do valor (negativo = despesa).\n\n"+
          "Clique em \"Baixar modelo de planilha\" para ver um exemplo pronto.");
        return;
      }

      const result = parseSpreadsheetRows(rows);
      if(result.added > 0){ await gravarLancamentosEmLote(result.novosLancamentos); await saveConfig(); }
      render();

      if(result.errors.length){
        const preview = result.errors.slice(0,12).join("\n") + (result.errors.length>12 ? `\n...e mais ${result.errors.length-12} linha(s).` : "");
        alert(`Importação concluída.\n\n${result.added} lançamento(s) adicionados com sucesso.\n${result.errors.length} linha(s) não puderam ser importadas:\n\n${preview}`);
      } else {
        mostrarBanner(`${result.added} lançamento(s) importados com sucesso da planilha.`);
        render();
      }
    }catch(err){
      alert("Não foi possível ler esta planilha. Verifique se o arquivo não está corrompido, protegido por senha, ou tente exportá-lo novamente em formato .xlsx.");
    }
  };
  reader.onerror = ()=> alert("Falha ao ler o arquivo. Tente novamente.");
  reader.readAsArrayBuffer(file);
}

function preserveFocus(id, cursorPos){
  const el = document.getElementById(id);
  if(!el) return;
  el.focus();
  if(typeof cursorPos === "number" && typeof el.setSelectionRange === "function"){
    el.setSelectionRange(cursorPos, cursorPos);
  }
}

// campos de busca: espera uma pausa na digitação antes de re-renderizar (a
// tabela/lista inteira é recriada a cada render, então refazer isso a cada
// tecla pesava e, pior, perdia a posição do cursor no meio do texto — por
// isso também guarda e restaura a posição exata do cursor, em vez do antigo
// truque de resetar o value (que sempre jogava o cursor pro fim do campo).
const _buscaDebounceTimers = {};
function ligarBuscaComDebounce(id, aplicar, delayMs){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener("input", e=>{
    const valor = e.target.value;
    const cursorPos = e.target.selectionStart;
    clearTimeout(_buscaDebounceTimers[id]);
    _buscaDebounceTimers[id] = setTimeout(()=>{
      aplicar(valor);
      render();
      preserveFocus(id, cursorPos);
    }, delayMs || 250);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function normalizarTexto(str){
  return String(str).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

// "Raiz" simplificada da palavra, pra pegar variações como
// cadastrar/cadastro/cadastrado ou lançar/lançamento/lancei.
function stemPt(palavra){
  if(palavra.length >= 6) return palavra.slice(0, palavra.length - 2);
  if(palavra.length >= 4) return palavra.slice(0, palavra.length - 1);
  return palavra;
}

function calcularResumoMesAtual(){
  const mesAtual = thisMonthYM();
  const lts = (state.lancamentos || []).filter(l=>{
    const comp = l.competencia || (l.data ? l.data.slice(0,7) : "");
    return comp === mesAtual;
  });
  const faturamento = lts.filter(l=>l.tipo === "receita").reduce((a,l)=>a + (Number(l.valor)||0), 0);
  const despesas = lts.filter(l=>l.tipo === "despesa").reduce((a,l)=>a + (Number(l.valor)||0), 0);
  return { mesAtual, faturamento, despesas, resultado: faturamento - despesas };
}

function pontuarFrase(q, frase){
  const palavras = normalizarTexto(frase).split(/\s+/).filter(Boolean);
  let acertos = 0;
  palavras.forEach(p=>{ if(q.includes(stemPt(p))) acertos++; });
  // conta só se pelo menos metade das palavras da frase apareceram
  if(acertos === 0 || acertos < palavras.length / 2) return 0;
  return acertos + (acertos === palavras.length ? 1 : 0); // bônus por frase inteira
}

function responderPergunta(pergunta){
  const q = normalizarTexto(pergunta);

  // Perguntas sobre números do mês atual — calculadas na hora, sem IA.
  if(/(quanto|qual).*(faturei|faturamento)/.test(q) || q.includes("faturamento deste mes") || q.includes("faturamento do mes")){
    const r = calcularResumoMesAtual();
    return { text:`Em ${monthLabel(r.mesAtual)}, o faturamento lançado até agora é de ${fmtMoney(r.faturamento)} (por competência). Para números oficiais, confira o Dashboard ou os Relatórios.`, matched:true };
  }
  if(/(quanto|qual).*(gastei|despesa)/.test(q) || q.includes("despesas do mes") || q.includes("despesas deste mes")){
    const r = calcularResumoMesAtual();
    return { text:`Em ${monthLabel(r.mesAtual)}, as despesas lançadas somam ${fmtMoney(r.despesas)} (por competência). Veja o detalhamento em Relatórios ou na Análise.`, matched:true };
  }
  if(q.includes("resultado do mes") || q.includes("lucro do mes") || (q.includes("resultado") && q.includes("mes"))){
    const r = calcularResumoMesAtual();
    return { text:`O resultado de ${monthLabel(r.mesAtual)} (faturamento − despesas, por competência) é de ${fmtMoney(r.resultado)}. Pode mudar até o fechamento do mês, conforme novos lançamentos entrarem.`, matched:true };
  }

  // Busca no FAQ com tolerância a variações de palavra.
  let melhor = null, melhorScore = 0;
  AI_FAQ.forEach(item=>{
    let score = 0;
    item.keywords.forEach(k=>{ score = Math.max(score, pontuarFrase(q, k)); });
    if(score > melhorScore){ melhorScore = score; melhor = item; }
  });
  if(melhor) return { text:melhor.answer, matched:true };

  return { text:AI_FALLBACK_TEXT, matched:false };
}

      </div>
      <div class="ai-input-row">
        <input type="text" id="aiInput" placeholder="Digite sua dúvida..." />
        <button id="aiSendBtn" aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </div>
  `;
  document.getElementById("aiFabBtn").addEventListener("click", ()=>{
    aiOpen = !aiOpen;
    if(aiOpen) armAiInactivityTimer(); else clearAiTimers();
    renderAssistant();
  });
  const closeBtn = document.getElementById("aiCloseBtn");
  if(closeBtn) closeBtn.addEventListener("click", ()=>{ aiOpen = false; clearAiTimers(); renderAssistant(); });
  const input = document.getElementById("aiInput");
  if(input){
    input.addEventListener("keydown", e=>{ if(e.key === "Enter") sendAssistantMessage(); });
    if(aiOpen) input.focus();
  }
  const sendBtn = document.getElementById("aiSendBtn");
  if(sendBtn) sendBtn.addEventListener("click", ()=> sendAssistantMessage());
  document.querySelectorAll(".ai-chip").forEach(chip=>{

  const msgsEl = document.getElementById("aiMessages");
  if(msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
}

function clearAiTimers(){
  if(aiInactivityTimer){ clearTimeout(aiInactivityTimer); aiInactivityTimer = null; }
  if(aiCloseTimer){ clearTimeout(aiCloseTimer); aiCloseTimer = null; }
}

// 1 minuto sem interação -> pergunta se pode ajudar em mais algo.
// Mais 30s sem resposta depois disso -> encerra (fecha) a conversa.
function armAiInactivityTimer(){
  clearAiTimers();
  aiInactivityTimer = setTimeout(()=>{
    aiMessages.push({ role:"bot", text:"Ainda por aqui? Posso ajudar em mais alguma coisa?", chips:true });
    renderAssistant();
    aiCloseTimer = setTimeout(()=>{
      aiMessages.push({ role:"bot", text:"Vou encerrar esta conversa por enquanto. Toque no ícone sempre que precisar de ajuda! 👋" });
      aiOpen = false;
      renderAssistant();
    }, 30000);
  }, 60000);
}

function sendAssistantMessage(perguntaFixa){
  const input = document.getElementById("aiInput");
  const question = (perguntaFixa || (input ? input.value.trim() : ""));
  if(!question) return;
  aiMessages.push({ role:"user", text:question });
  const resposta = responderPergunta(question);
  aiMessages.push({ role:"bot", text:resposta.text, chips: !resposta.matched });
  if(input) input.value = "";
  armAiInactivityTimer();
  renderAssistant();
}
