<style>
  :root{
    --navy-950:#0d1626;
    --navy-900:#12203b;
    --navy-800:#182b4d;
    --navy-700:#213862;
    --paper:#f5f6f8;
    --paper-line:#e4e7ec;
    --card:#ffffff;
    --ink:#182338;
    --ink-soft:#5b6576;
    --gold:#c9a227;
    --green:#1c8f6f;
    --green-soft:#e4f4ee;
    --red:#c94c4c;
    --red-soft:#fbeaea;
    --radius:14px;
    --shadow: 0 1px 2px rgba(13,22,38,.06), 0 8px 24px -12px rgba(13,22,38,.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:#fff; }

  /* ---------- layout shell ---------- */
  #root{ display:flex; min-height:100vh; }

  .sidebar{
    width:250px;
    flex-shrink:0;
    background: linear-gradient(180deg, var(--navy-900), var(--navy-950));
    color:#fff;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
    overflow-x:hidden;
    overflow-y:auto;
  }
  .sidebar::before{
    content:"";
    position:absolute; right:-70px; bottom:-40px; width:340px; height:340px;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M0 70 L25 30 L40 55 L65 10' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-size:contain; opacity:.05; pointer-events:none;
    transform:rotate(8deg);
  }
  .sidebar::after{
    content:"";
    position:absolute; top:0; right:0; width:3px; height:100%;
    background:linear-gradient(180deg, var(--gold), transparent 70%);
    opacity:.55;
  }
  .sidebar-logo{
    padding:28px 22px 20px 22px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .sidebar-logo img{ width:100%; max-width:180px; display:block; }
  .sidebar-tag{
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(255,255,255,.45); margin-top:10px; font-weight:500;
  }

  .nav{ padding:18px 12px; display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-label{
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(255,255,255,.32); padding:14px 12px 6px;
    font-weight:600;
  }
  .nav button{
    all:unset; box-sizing:border-box; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    padding:8px 10px; border-radius:11px;
    font-size:13.5px; color:rgba(255,255,255,.72); font-weight:500;
    transition:background .15s, color .15s;
    position:relative;
  }
  .nav button:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .nav button.active{ background:rgba(201,162,39,.14); color:#fff; font-weight:600; }
  .nav button .ic{
    width:28px; height:28px; padding:6px; box-sizing:border-box; flex-shrink:0;
    border-radius:8px; background:rgba(255,255,255,.07); opacity:1;
    transition:background .15s, color .15s;
  }
  .nav button:hover .ic{ background:rgba(255,255,255,.12); }
  .nav button.active .ic{ background:var(--gold); color:var(--navy-950); }

  .sidebar-balance{
    margin:4px 14px 14px; padding:13px 14px; border-radius:13px;
    background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.09);
    position:relative; z-index:1;
  }
  .sidebar-balance .sb-label{
    font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:rgba(255,255,255,.42); font-weight:700;
  }
  .sidebar-balance .sb-row{ display:flex; align-items:baseline; gap:8px; margin-top:4px; }
  .sidebar-balance .sb-value{ font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600; color:#fff; }
  .sidebar-balance .sb-trend{ display:inline-flex; align-items:center; gap:2px; font-size:11px; font-weight:700; }
  .sidebar-balance .sb-trend.up{ color:#6fe3bc; }
  .sidebar-balance .sb-trend.down{ color:#f3a3a3; }

  .sidebar-foot{
    padding:16px 22px 20px; font-size:11px; color:rgba(255,255,255,.32);
    border-top:1px solid rgba(255,255,255,.08);
  }
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  .topbar{
    padding:22px 34px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--paper-line);
    background:var(--card);
    position:relative;
  }
  .topbar::after{
    content:""; position:absolute; left:0; bottom:-1px; width:100%; height:2px;
    background:linear-gradient(90deg, var(--navy-900) 0%, var(--gold) 18%, transparent 18.5%);
  }
  .topbar .kicker{ font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); font-weight:700; margin-bottom:3px; }
  .topbar h1{ font-family:'Sora', sans-serif; font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .topbar .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .topbar-right{ display:flex; align-items:center; gap:14px; }
  .period-select{
    font-family:'IBM Plex Mono', monospace; font-size:12.5px;
    border:1px solid var(--paper-line); background:var(--paper);
    padding:8px 12px; border-radius:8px; color:var(--ink); cursor:pointer;
  }

  /* menu de dados & backup (topbar) */
  .settings-menu-wrap{ position:relative; }
  .settings-trigger{
    all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:9px; border:1px solid var(--paper-line);
    background:var(--paper); color:var(--ink); transition:background .12s, color .12s, border-color .12s;
  }
  .settings-trigger:hover, .settings-trigger.active{ background:var(--navy-900); color:#fff; border-color:var(--navy-900); }
  .settings-dropdown{
    position:absolute; top:calc(100% + 8px); right:0; width:290px;
    background:var(--card); border:1px solid var(--paper-line); border-radius:12px;
    box-shadow:0 10px 30px -10px rgba(13,22,38,.28), 0 2px 8px rgba(13,22,38,.08);
    padding:14px; z-index:70;
  }
  .settings-dropdown .sd-label{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); margin-bottom:8px; padding:0 6px;
  }
  .settings-dropdown .sd-item{
    all:unset; box-sizing:border-box; display:flex; align-items:center; gap:8px; width:100%;
    cursor:pointer; font-size:13px; font-weight:500; color:var(--ink); padding:9px 6px; border-radius:8px;
  }
  .settings-dropdown .sd-item:hover{ background:var(--paper); }
  .settings-dropdown .sd-hint{ font-size:10.5px; color:var(--ink-soft); padding:4px 6px 2px; line-height:1.4; }
  .settings-dropdown .sd-divider{ height:1px; background:var(--paper-line); margin:10px 0; }
  .settings-dropdown .sd-danger{
    margin-top:2px; padding:8px 8px 4px; border-radius:9px; background:var(--red-soft); border:1px solid rgba(201,76,76,.25);
  }
  .settings-dropdown .sd-danger-label{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--red); margin-bottom:2px; padding:0 6px;
  }
  .settings-dropdown .sd-danger .sd-item{ color:var(--red); }
  .settings-dropdown .sd-danger .sd-item:hover{ background:rgba(201,76,76,.14); }
  @media (max-width:880px){
    .settings-dropdown{ right:-8px; width:260px; }
  }

  .content{ padding:28px 34px 60px; flex:1; }

  /* ---------- generic components ---------- */
  .cards-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:22px; }
  .card{
    background:var(--card); border-radius:var(--radius); padding:20px 22px;
    box-shadow:var(--shadow); border:1px solid var(--paper-line);
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; width:100%; height:3px;
    background:var(--bar-color, var(--navy-700));
  }
  .card.acc-green::before{ background:var(--green); }
  .card.acc-red::before{ background:var(--red); }
  .card.acc-navy::before{ background:var(--navy-700); }
  .card.card-featured{ border-width:1.5px; }
  .card.card-featured.acc-green{ background:linear-gradient(180deg,#fff,var(--green-soft) 180%); border-color:rgba(28,143,111,.3); }
  .card.card-featured.acc-red{ background:linear-gradient(180deg,#fff,var(--red-soft) 180%); border-color:rgba(201,76,76,.3); }
  .card.card-featured::before{ height:4px; }
  .card.card-featured .kpi-value{ font-size:32px; }
  .card.card-featured .kpi-label{ font-weight:700; }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card-top svg{ flex-shrink:0; margin-top:2px; }
  .card-icon{
    width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .card-icon svg{ width:17px; height:17px; }
  .card-icon.green{ background:var(--green-soft); color:var(--green); }
  .card-icon.red{ background:var(--red-soft); color:var(--red); }
  .card-icon.navy{ background:#eef1f6; color:var(--navy-700); }
  .kpi-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:600; }
  .kpi-value{ font-family:'IBM Plex Mono', monospace; font-size:28px; font-weight:600; margin-top:8px; letter-spacing:-.01em; }
  .kpi-value.green{ color:var(--green); }
  .kpi-value.red{ color:var(--red); }
  .kpi-sub{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  .panel{
    background:var(--card); border-radius:var(--radius); border:1px solid var(--paper-line);
    box-shadow:var(--shadow); padding:24px;
    transition:box-shadow .18s;
  }
  .panel:hover{ box-shadow:0 2px 4px rgba(13,22,38,.07), 0 12px 28px -12px rgba(13,22,38,.16); }
  .panel + .panel{ margin-top:18px; }
  .grid-2 > .panel + .panel, .cat-cols > .panel + .panel{ margin-top:0; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--paper-line); position:relative; }
  .panel-head::after{ content:""; position:absolute; left:0; bottom:-1px; width:34px; height:2px; background:var(--gold); }
  .panel-head h2{ font-family:'Sora', sans-serif; font-size:15.5px; font-weight:700; }
  .panel-head .hint{ font-size:12px; color:var(--ink-soft); }

  @keyframes fadeIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  .content{ animation:fadeIn .28s ease; }

  .grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start; }
  .grid-2 + .grid-2{ margin-top:18px; }
  .cards-row-4{ grid-template-columns:repeat(4,1fr); }

  /* bars */
  .bar-row{ display:flex; align-items:center; gap:12px; padding:9px 0; }
  .bar-row .label{ width:150px; flex-shrink:0; font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; height:8px; background:var(--paper-line); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; }
  .bar-fill.green{ background:linear-gradient(90deg, var(--green), #2fb894); }
  .bar-fill.red{ background:linear-gradient(90deg, var(--red), #e07070); }
  .bar-val{ width:88px; text-align:right; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink); flex-shrink:0; }

  /* table */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .table-scroll table{ min-width:560px; }
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--ink-soft); font-weight:600; padding:0 10px 10px; border-bottom:1px solid var(--paper-line);
  }
  tbody td{ padding:12px 10px; border-bottom:1px solid var(--paper-line); vertical-align:middle; }
  tbody tr:hover{ background:#fafbfc; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .tag{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:500;
    padding:4px 9px; border-radius:20px; white-space:nowrap;
  }
  .tag.receita{ background:var(--green-soft); color:var(--green); }
  .tag.despesa{ background:var(--red-soft); color:var(--red); }
  .tag .bar{ width:3px; height:10px; border-radius:2px; }
  .tag.receita .bar{ background:var(--green); }
  .tag.despesa .bar{ background:var(--red); }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .icon-btn{
    all:unset; box-sizing:border-box; cursor:pointer; width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    border-radius:7px; color:var(--ink-soft); transition:background .12s, color .12s;
  }
  .icon-btn:hover{ background:var(--paper-line); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--red-soft); color:var(--red); }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state .glyph{ font-size:30px; margin-bottom:10px; }
  .empty-state .t{ font-weight:600; color:var(--ink); font-size:14px; margin-bottom:4px; }

  /* forms */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px 18px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .field label.req::after{ content:" *"; color:var(--red); font-weight:700; }
  .field input, .field select, .field textarea{
    font-family:'Inter', sans-serif; font-size:13.5px; padding:10px 12px;
    border:1px solid var(--paper-line); border-radius:9px; background:var(--paper); color:var(--ink);
    transition:border-color .12s, background .12s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--navy-700); background:#fff;
  }
  .field textarea{ resize:vertical; min-height:64px; font-family:'Inter', sans-serif; }
  .field.money input{ font-family:'IBM Plex Mono', monospace; }

  .btn{
    all:unset; box-sizing:border-box; cursor:pointer; font-family:'Inter', sans-serif; font-weight:600; font-size:13.5px;
    padding:11px 20px; border-radius:9px; text-align:center; transition:filter .12s, transform .05s;
  }
  .btn:active{ transform:translateY(1px); }
  .btn.primary.receita{ background:var(--green); color:#fff; }
  .btn.primary.despesa{ background:var(--red); color:#fff; }
  .btn.primary.neutral{ background:var(--navy-900); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--paper-line); }
  .btn.ghost:hover{ background:var(--paper); color:var(--ink); }
  .form-actions{ display:flex; gap:10px; margin-top:6px; grid-column:1 / -1; }

  .banner{
    display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:10px;
    font-size:13px; font-weight:500; margin-bottom:16px;
  }
  .banner.ok{ background:var(--green-soft); color:var(--green); }
  .banner.err-banner{ background:var(--red-soft); color:var(--red); }

  /* sync status */
  .sync-status{ display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600; color:rgba(255,255,255,.55); }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); flex-shrink:0; box-shadow:0 0 0 3px rgba(28,143,111,.18); }
  .sync-dot.err{ background:var(--red); box-shadow:0 0 0 3px rgba(201,76,76,.18); }
  .last-updated{ font-size:10.5px; color:rgba(255,255,255,.35); margin-top:3px; margin-bottom:12px; }

  /* setup screen */
  .setup-screen{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
    background:var(--navy-950); padding:40px 20px;
  }
  .setup-card{
    max-width:640px; background:#fff; border-radius:18px; padding:40px 44px;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.5);
  }
  .setup-card h1{ font-family:'Sora',sans-serif; font-size:22px; font-weight:700; margin-bottom:14px; color:var(--ink); }
  .setup-card .lead{ font-size:14px; color:var(--ink-soft); line-height:1.6; margin-bottom:20px; }
  .setup-card ol{ padding-left:20px; margin-bottom:18px; }
  .setup-card ol li{ font-size:13.5px; line-height:1.9; color:var(--ink); }
  .setup-card code{
    background:var(--paper); border:1px solid var(--paper-line); padding:1px 6px; border-radius:5px;
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--navy-900);
  }
  .setup-card pre{
    background:var(--navy-950); color:#d8e0ee; padding:16px 18px; border-radius:10px;
    font-family:'IBM Plex Mono', monospace; font-size:12px; line-height:1.6; overflow-x:auto; margin-bottom:16px;
  }
  .setup-card .note{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; background:var(--paper); padding:12px 14px; border-radius:9px; }

  /* autenticação */
  .auth-screen{
    position:relative; overflow:hidden;
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--navy-900), var(--navy-950)); padding:20px;
  }
  #authNetworkCanvas{ position:absolute; inset:0; width:100%; height:100%; z-index:0; }

  /* logo girando no eixo vertical (3D, sempre de frente) — usado tanto na
     tela de carregamento inicial quanto em qualquer "Carregando…" do app */
  .logo-spinner-wrap{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; perspective:700px; }
  .spin-logo-3d{ transform-style:preserve-3d; animation: logoSpin3d 2.4s linear infinite, logoSpinGlow 2.4s ease-in-out infinite; }
  .spin-logo-3d.lg{ width:110px; }
  .spin-logo-3d.sm{ width:46px; }
  @keyframes logoSpin3d{ from{ transform:rotateY(0deg); } to{ transform:rotateY(360deg); } }
  @keyframes logoSpinGlow{ 0%,100%{ filter:drop-shadow(0 0 0 rgba(201,162,39,0)); } 50%{ filter:drop-shadow(0 0 14px rgba(201,162,39,.55)); } }
  @media (prefers-reduced-motion: reduce){
    .spin-logo-3d{ animation:none; }
  }
  .auth-card{
    position:relative; z-index:1;
    width:100%; max-width:380px; background:#fff; border-radius:18px; padding:38px 34px;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.5); text-align:center;
  }
  .auth-logo{ width:120px; margin:0 auto 22px; display:block; }
  .auth-card h1{ font-family:'Sora',sans-serif; font-size:19px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .auth-card .auth-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:22px; line-height:1.5; }
  .auth-card form{ text-align:left; }
  .auth-card .banner{ text-align:left; margin-bottom:16px; }
  .auth-link{
    all:unset; box-sizing:border-box; cursor:pointer; display:inline-block; margin-top:18px; font-size:12.5px; font-weight:600;
    color:var(--navy-700); text-decoration:underline; text-underline-offset:2px;
  }
  .auth-link:hover{ color:var(--navy-900); }

  .logged-user{ display:flex; align-items:center; gap:9px; padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,.1); }
  .logged-user .lu-email{ font-size:11.5px; font-weight:600; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .logged-user .auth-link{ color:rgba(255,255,255,.5); margin-top:2px; font-size:11px; }
  .logged-user .auth-link:hover{ color:#fff; }

  /* classificacoes */
  .cat-cols{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .cat-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .cat-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; background:var(--paper); border:1px solid var(--paper-line); border-radius:9px; font-size:13px;
  }
  .cat-item .name{ display:flex; align-items:center; gap:9px; }
  .cat-add{ display:flex; gap:8px; margin-top:14px; }
  .cat-add input{ flex:1; }

  .services-strip{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .service-chip{
    display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--paper);
    border:1px solid var(--paper-line); border-radius:20px; font-size:12px; font-weight:500; color:var(--ink-soft);
  }
  .service-chip .sq{ width:7px; height:7px; border-radius:2px; background:var(--gold); }

  .filters-row{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .filters-row select, .filters-row input{
    font-size:12.5px; padding:8px 12px; border-radius:8px; border:1px solid var(--paper-line); background:var(--paper);
  }
  .search-input{
    width:100%; font-size:13px; padding:10px 14px; border-radius:9px; border:1px solid var(--paper-line);
    background:var(--paper); margin-bottom:16px; font-family:'Inter', sans-serif;
  }
  .search-input:focus{ outline:none; border-color:var(--navy-700); background:#fff; }
  .form-divider{
    margin-top:4px; padding-top:14px; border-top:1px solid var(--paper-line);
  }
  .form-divider span{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft);
  }

  /* usuários */
  .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--navy-900); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:700; font-size:13px; flex-shrink:0;
  }
  .user-row{ display:flex; align-items:center; gap:12px; }
  .user-meta .nm{ font-weight:600; font-size:13px; }
  .user-meta .em{ font-size:11.5px; color:var(--ink-soft); }
  .status-pill{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .status-pill.ativo, .status-pill.pago{ background:var(--green-soft); color:var(--green); }
  .status-pill.inativo, .status-pill.atrasado{ background:var(--red-soft); color:var(--red); }
  .status-pill.pendente{ background:#fbf1d9; color:#9c7a12; }
  .role-pill{ font-size:11.5px; font-weight:500; padding:3px 9px; border-radius:20px; background:#eef1f6; color:var(--navy-700); }

  /* alerta de pendências no dashboard */
  .pending-alert{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .pa-item{
    flex:1; min-width:220px; display:flex; align-items:center; gap:10px;
    padding:13px 16px; border-radius:12px; cursor:pointer; font-size:13px; color:var(--ink);
    border:1px solid transparent; transition:filter .12s;
  }
  .pa-item:hover{ filter:brightness(0.97); }
  .pa-item.atrasado{ background:var(--red-soft); border-color:rgba(201,76,76,.25); }
  .pa-item.pendente{ background:#fbf1d9; border-color:rgba(156,122,18,.25); }
  .pa-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .pa-item.atrasado .pa-dot{ background:var(--red); }
  .pa-item.pendente .pa-dot{ background:#9c7a12; }
  .pa-val{ font-family:'IBM Plex Mono', monospace; margin-left:6px; font-weight:600; }

  .totals-row td{
    border-top:2px solid var(--navy-900); border-bottom:none; padding-top:12px;
    font-size:12.5px; font-weight:600; color:var(--ink-soft); background:#fafbfd;
  }
  .pagination-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-top:14px; padding-top:14px; border-top:1px solid var(--paper-line);
  }
  .pagination-info{ font-size:12px; color:var(--ink-soft); }
  .pagination-nav{ display:flex; align-items:center; gap:10px; }
  .pagination-pag{ font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap; }
  .pagination-row .icon-btn[disabled]{ opacity:.35; cursor:default; pointer-events:none; }
  .readonly-tag{
    font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:#e0b84a; background:rgba(224,184,74,.12); border:1px solid rgba(224,184,74,.3);
    padding:5px 9px; border-radius:7px; margin-bottom:12px; display:inline-block;
  }
  .analise-list{ list-style:none; display:flex; flex-direction:column; gap:10px; }
  .analise-list li{
    font-size:13px; line-height:1.5; padding:10px 12px 10px 34px; border-radius:9px; position:relative;
  }
  .analise-list li::before{ position:absolute; left:11px; top:10px; font-size:13px; }
  .analise-list.positivo li{ background:var(--green-soft); color:#0e5a44; }
  .analise-list.positivo li::before{ content:"✓"; color:var(--green); font-weight:700; }
  .analise-list.atencao li{ background:var(--red-soft); color:#7a2626; }
  .analise-list.atencao li::before{ content:"!"; color:var(--red); font-weight:700; }

  /* DRE */
  .dre-period{ display:flex; justify-content:flex-end; margin-bottom:14px; }
  .dre-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .dre-table tr td{ padding:11px 8px; border-bottom:1px solid var(--paper-line); }
  .dre-table tr.line-main td{ font-weight:700; font-family:'Sora', sans-serif; font-size:13.5px; color:var(--navy-900); background:#fafbfd; }
  .dre-table tr.line-sub td.label{ padding-left:26px; color:var(--ink-soft); font-size:12.5px; }
  .dre-table tr.line-total td{ font-weight:700; border-top:2px solid var(--navy-900); border-bottom:none; padding-top:13px; }
  .dre-table td.val{ text-align:right; font-family:'IBM Plex Mono', monospace; white-space:nowrap; }
  .dre-table tr.negativo td.val{ color:var(--red); }
  .dre-table tr.positivo td.val{ color:var(--green); }
  .dre-note{ font-size:12px; color:var(--ink-soft); margin-top:14px; line-height:1.5; }
  .dre-margin{ display:flex; gap:24px; margin-top:18px; }
  .dre-margin .mcard{ flex:1; background:var(--paper); border:1px solid var(--paper-line); border-radius:10px; padding:14px 16px; }
  .dre-margin .mcard .mv{ font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600; margin-top:4px; }
  .grupo-select{ font-size:12px; padding:6px 8px; border-radius:6px; border:1px solid var(--paper-line); background:#fff; }

  /* report tabs */
  .report-tabs{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .tabs-group{ display:flex; gap:4px; background:var(--card); padding:4px; border-radius:11px; border:1px solid var(--paper-line); box-shadow:var(--shadow); }
  .tab-btn{
    all:unset; box-sizing:border-box; cursor:pointer; font-size:12.5px; font-weight:600; padding:9px 15px; border-radius:8px;
    color:var(--ink-soft); transition:background .15s, color .15s;
  }
  .tab-btn:hover:not(.active){ background:var(--paper); color:var(--ink); }
  .tab-btn.active{ background:var(--navy-900); color:#fff; }

  .mobile-menu-btn{
    display:none; align-items:center; justify-content:center; flex-shrink:0;
    width:36px; height:36px; border-radius:9px; border:1px solid var(--paper-line);
    background:var(--paper); color:var(--ink); cursor:pointer;
  }
  .mobile-overlay{ display:none; }

  @media (max-width: 880px){
    .sidebar{
      display:flex; position:fixed; top:0; left:0; height:100vh; z-index:60;
      transform:translateX(-100%); transition:transform .25s ease;
      box-shadow:0 0 40px rgba(0,0,0,.35);
    }
    .sidebar.mobile-open{ transform:translateX(0); }
    .mobile-overlay.show{
      display:block; position:fixed; inset:0; background:rgba(13,22,38,.5); z-index:55;
    }
    .mobile-menu-btn{ display:flex; }
    .cards-row, .grid-2, .cat-cols, .form-grid{ grid-template-columns:1fr; }
    .content{ padding:20px; }
    .topbar{ padding:16px 20px; flex-wrap:wrap; row-gap:10px; }
    .topbar-right{ flex-wrap:wrap; width:100%; }
    .topbar-right .period-select{ flex:1; min-width:140px; }
  }


  /* ---------------------------------------------------------
     ANÁLISE GERENCIAL — RELATÓRIO EXECUTIVO
  --------------------------------------------------------- */
  .gerencial-wrap{ max-width:1180px; margin:0 auto; }
  .gerencial-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-bottom:18px;
  }
  .gerencial-kicker{
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);
  }
  .gerencial-title{
    font-family:'Sora',sans-serif; font-size:23px; font-weight:700; color:var(--navy-900); margin:3px 0 2px;
  }
  .gerencial-sub{ font-size:12.5px; color:var(--ink-soft); }
  .gerencial-page{
    background:#fff; border:1px solid var(--paper-line); border-radius:16px; overflow:hidden;
    box-shadow:var(--shadow); margin-bottom:20px;
  }
  .gerencial-head{
    background:linear-gradient(135deg,#0b2458,#122e6d); color:#fff; padding:22px 26px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .gerencial-brand{ display:flex; align-items:center; gap:15px; min-width:0; }
  .gerencial-brand img{ width:92px; max-height:46px; object-fit:contain; object-position:left center; filter:brightness(0) invert(1); }

  }
  .gerencial-cover{
    background:linear-gradient(160deg,#0b2458,#122e6d 55%,#0d2c63); color:#fff;

  .gerencial-cover .cover-kicker{
    font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.85;

  .gerencial-cover .cover-mid{ margin-top:38px; }
  .gerencial-cover .cover-title{
    font-family:'Sora',sans-serif; font-weight:700; font-size:clamp(30px,4.4vw,46px); line-height:1.08; margin:0 0 12px;
  }
  .gerencial-cover .cover-sub{ font-size:14.5px; opacity:.85; max-width:460px; }
  .gerencial-cover .cover-period{
    margin-top:22px; font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700;

  .gerencial-cover .cover-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:36px; }

  }
  .gerencial-cover .cover-box h4{
    margin:0 0 10px; font-family:'Sora',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:.03em;
  }
  .gerencial-cover .cover-box ul{ margin:0; padding:0; list-style:none; display:grid; gap:6px; }
  .gerencial-cover .cover-box li{ font-size:11px; opacity:.9; padding-left:14px; position:relative; }
  .gerencial-cover .cover-box li::before{ content:"•"; position:absolute; left:0; color:#d8b04b; }
  .gerencial-cover .cover-bottom{ margin-top:30px; }
  .gerencial-cover .cover-notes{ font-size:10px; opacity:.65; line-height:1.55; }
  .gerencial-cover .cover-foot{

  @media (max-width:880px){

  }

  /* impressão / PDF de relatórios */
  .print-header{ display:none; }
  @media print{
    @page{ size:A4; margin:12mm 14mm; }

    /* esconde tudo que não é o relatório — sem reservar espaço no layout */

    .content{ padding:0; animation:none; }

      overflow:visible; break-after:page; page-break-after:always;
    }
    .gerencial-page:last-child{ break-after:auto; page-break-after:auto; }
    .gerencial-page.gerencial-cover{
      width:210mm; min-height:297mm; box-sizing:border-box;
      padding:18mm 16mm 12mm;
    }
    .gerencial-head{ border-radius:0; padding:14px 18px; }
    .gerencial-body{ padding:16px 18px 18px; }
    .gerencial-title{ font-size:18px; }

    .panel{ box-shadow:none !important; border:1px solid #ddd !important; padding:12px 14px; break-inside:avoid; }
    .panel:hover{ box-shadow:none !important; }
    .panel-head{ margin-bottom:8px; padding-bottom:6px; }

    table{ font-size:10px; }
    thead th{ padding:0 5px 5px; font-size:8.5px; }
    tbody td{ padding:5px; }
    tr{ break-inside:avoid; }

    .dre-table tr td{ padding:4px 5px; font-size:10px; }

    .dre-table tr.line-sub td.label{ padding-left:16px; font-size:9px; }

    .dre-margin{ margin-top:8px; gap:14px; }

    .dist-col{ display:none; }
  }

/* ---------------------------------------------------------
   ASSISTENTE DE IA
--------------------------------------------------------- */
.ai-fab{
  position:fixed; right:20px; bottom:20px; z-index:80;
  width:56px; height:56px; border-radius:50%; border:0; cursor:pointer;
  background:linear-gradient(160deg, var(--navy-900), var(--navy-950));
  color:#fff; box-shadow:0 8px 22px -6px rgba(13,22,38,.45);
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s ease;
}
.ai-fab:hover{ transform:scale(1.05); }
.ai-fab svg{ width:24px; height:24px; }
.ai-panel{
  position:fixed; right:20px; bottom:88px; z-index:81;
  width:360px; max-width:calc(100vw - 40px); height:min(560px, 70vh);
  background:var(--card); border-radius:16px; border:1px solid var(--paper-line);
  box-shadow:0 20px 50px -12px rgba(13,22,38,.35);
  display:none; flex-direction:column; overflow:hidden;
}
.ai-panel.open{ display:flex; }
.ai-panel-head{
  padding:14px 16px; background:linear-gradient(160deg, var(--navy-900), var(--navy-950));
  color:#fff; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
}
.ai-panel-head .title{ font-family:'Sora',sans-serif; font-size:13.5px; font-weight:700; }
.ai-panel-head .sub{ font-size:10.5px; color:rgba(255,255,255,.55); margin-top:2px; }
.ai-panel-close{
  all:unset; cursor:pointer; width:26px; height:26px; border-radius:8px;
  display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.8);
}
.ai-panel-close:hover{ background:rgba(255,255,255,.1); }
.ai-messages{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--paper); }
.ai-msg{ max-width:85%; padding:9px 12px; border-radius:12px; font-size:12.5px; line-height:1.5; white-space:pre-wrap; }
.ai-msg.bot{ align-self:flex-start; background:#fff; border:1px solid var(--paper-line); color:var(--ink); border-bottom-left-radius:3px; }
.ai-msg.user{ align-self:flex-end; background:var(--navy-900); color:#fff; border-bottom-right-radius:3px; }
.ai-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
.ai-chip{
  all:unset; cursor:pointer; font-size:11px; padding:7px 11px; border-radius:999px;
  background:#fff; border:1px solid var(--paper-line); color:var(--navy-900);
}
.ai-chip:hover{ background:var(--paper); }
.ai-input-row{ display:flex; gap:8px; padding:10px; border-top:1px solid var(--paper-line); background:var(--card); flex-shrink:0; }
.ai-input-row input{
  flex:1; border:1px solid var(--paper-line); border-radius:10px; padding:9px 12px;
  font-size:12.5px; font-family:inherit; background:var(--paper); color:var(--ink);
}
.ai-input-row button{
  all:unset; cursor:pointer; width:36px; height:36px; border-radius:10px; flex-shrink:0;
  background:var(--navy-900); color:#fff; display:flex; align-items:center; justify-content:center;
}
.ai-input-row button:disabled{ opacity:.5; cursor:default; }
.ai-input-row button svg{ width:16px; height:16px; }
@media (max-width:640px){
  .ai-fab{ right:16px; bottom:16px; }
  .ai-panel{
    right:0; left:0; bottom:0; width:100%; max-width:100%;
    height:80vh; border-radius:16px 16px 0 0;
  }
}

/* ---------------------------------------------------------
   MODAL DE CONFIRMAÇÃO — substitui o confirm() nativo do
   navegador (uma caixa cinza do sistema operacional) por um
   modal com o visual do resto do sistema.
--------------------------------------------------------- */
.confirm-overlay{
  position:fixed; inset:0; z-index:200; background:rgba(13,22,38,.55);
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.confirm-modal{
  background:var(--card); border-radius:16px; max-width:420px; width:100%;
  padding:24px; box-shadow:0 24px 60px -16px rgba(13,22,38,.45);
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;
}
.confirm-modal-icon{
  width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.confirm-modal-icon svg{ width:22px; height:22px; }
.confirm-modal-text{ font-size:13.5px; color:var(--ink); line-height:1.5; white-space:pre-wrap; }
.confirm-modal-actions{ display:flex; gap:10px; width:100%; margin-top:4px; }
.confirm-modal-actions .btn{ flex:1; }
</style>

      "Seus apps" → clique no ícone </> (Web) → registre um app.
   4. Copie o objeto de configuração exibido e cole abaixo, substituindo
      os valores de exemplo.
   5. Em "Firestore Database" → aba "Regras", cole:

      rules_version = '2';
      service cloud.firestore {
        match /databases/{database}/documents {
          match /nff_financeiro/{docId} {
            allow read, write: if true;
          }
        }
      }

      Isso permite que qualquer pessoa com o link leia e grave os dados
      (sem necessidade de login), conforme solicitado.
--------------------------------------------------------- */

--------------------------------------------------------- */
let authReady = false;
let authUser = null;
let authView = "login"; // login | esqueci
let authError = null;
let authMsg = null;
let authBusy = false;

function usuarioLogado(){
  if(!authUser || !authUser.email) return null;
  return (state.usuarios||[]).find(u => (u.email||"").toLowerCase() === authUser.email.toLowerCase()) || null;
}
function perfilAtual(){
  const u = usuarioLogado();
  // sem cadastro correspondente em Usuários = acesso total (evita travar contas já existentes)
  return u ? u.perfil : "Administrador";
}
function podeEditar(){
  return perfilAtual() !== "Somente Leitura";
}
function podeGerenciarUsuarios(){
  return perfilAtual() === "Administrador";
}

const ADMIN_EMAIL = "jvo.wallas@gmail.com";
let sessaoDocId = null;

function registrarAcessoInicio(){
  if(!FIREBASE_READY || !db || !authUser) return;
  db.collection("nff_acessos").add({
    email: authUser.email || "desconhecido",
    entrada: firebase.firestore.FieldValue.serverTimestamp(),
    saida: null,
    userAgent: navigator.userAgent || "",
  }).then(ref=>{ sessaoDocId = ref.id; }).catch(e=>console.warn("Falha ao registrar acesso:", e));
}

function registrarAcessoFim(){
  if(!FIREBASE_READY || !db || !sessaoDocId) return Promise.resolve();
  const id = sessaoDocId;
  sessaoDocId = null;
  return db.collection("nff_acessos").doc(id).update({
    saida: firebase.firestore.FieldValue.serverTimestamp(),
  }).catch(e=>console.warn("Falha ao encerrar registro de acesso:", e));
}

function iniciarAutenticacao(){
  if(!FIREBASE_READY || !auth){ authReady = true; render(); return; }
  auth.onAuthStateChanged(user=>{
    const eraLogado = !!authUser;
    authUser = user;
    authReady = true;
    authView = "login";
    authError = null;
    authMsg = null;
    if(user){
      if(!eraLogado) registrarAcessoInicio();
      loadState();
    } else {
      ready = false;
      render();
    }
    render();
  });
}

function traduzErroAuth(code){
  const mapa = {
    "auth/invalid-email": "E-mail inválido.",
    "auth/user-disabled": "Este usuário foi desativado.",
    "auth/user-not-found": "E-mail ou senha incorretos.",
    "auth/wrong-password": "E-mail ou senha incorretos.",
    "auth/invalid-credential": "E-mail ou senha incorretos.",
    "auth/missing-password": "Informe a senha.",
    "auth/too-many-requests": "Muitas tentativas. Aguarde um momento e tente novamente.",
    "auth/network-request-failed": "Falha de conexão. Verifique sua internet.",
  };
  return mapa[code] || "Não foi possível concluir. Tente novamente.";
}

function uid(){ return Math.random().toString(36).slice(2,10); }

function migrarEstado(parsed){
  state = Object.assign({}, DEFAULT_STATE, parsed);
  if(!Array.isArray(state.usuarios)) state.usuarios = [];
  if(!Array.isArray(state.clientes)) state.clientes = [];
  if(!Array.isArray(state.fornecedores)) state.fornecedores = [];
  if(!Array.isArray(state.contasBancarias)) state.contasBancarias = [];
  if(!Array.isArray(state.bancos) || !state.bancos.length) state.bancos = JSON.parse(JSON.stringify(DEFAULT_STATE.bancos));
  if(!Array.isArray(state.tiposTransacao) || !state.tiposTransacao.length) state.tiposTransacao = JSON.parse(JSON.stringify(DEFAULT_STATE.tiposTransacao));
  // migra contas bancárias antigas que ainda não possuem saldo inicial (conciliação bancária)
  state.contasBancarias = (state.contasBancarias||[]).map(c=>
    ("saldoInicial" in c) ? c : Object.assign({}, c, {saldoInicial:0, saldoInicialData:null})
  );
  state.categoriasDespesa = (state.categoriasDespesa||[]).map(c=>
    c.grupoDRE ? c : Object.assign({}, c, {grupoDRE:"administrativa"})
  );
  // migra lançamentos antigos que usavam o campo único "formaPagamento" (texto)
  state.lancamentos = (state.lancamentos||[]).map(l=>{
    if(l.tipoTransacaoId || !l.formaPagamento) return l;
    const match = state.tiposTransacao.find(t=>t.nome.toLowerCase() === String(l.formaPagamento).toLowerCase());
    return Object.assign({}, l, { tipoTransacaoId: match ? match.id : "" });
  });
}

// aplica um payload de CONFIGURAÇÃO (tudo exceto lançamentos e usuários) sobre o
// state atual, preservando o que os listeners das coleções próprias já carregaram
function migrarEstadoConfig(parsed){
  const lancamentosAtuais = state.lancamentos;
  const usuariosAtuais = state.usuarios;
  migrarEstado(Object.assign({lancamentos: lancamentosAtuais, usuarios: usuariosAtuais}, parsed));
}

function estaDigitandoEmFormulario(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = (el.tagName||"").toLowerCase();
  return (tag==="input" || tag==="textarea" || tag==="select") && !!el.closest("form");
}

/* ---------------------------------------------------------
   PERSISTÊNCIA — lançamentos e usuários em coleções próprias (1 doc
   cada), demais cadastros (categorias, bancos, clientes...) num
   documento de config. Usuários ficam em coleção própria (chave =
   e-mail) para que as regras do Firestore consigam checar o perfil
   de quem está escrevendo e bloquear "Somente Leitura" no banco, não
   só na interface. O documento único antigo (nff_financeiro/estado)
   nunca é mais escrito — fica intacto como backup da migração.
--------------------------------------------------------- */
let configCarregado = false;
let lancamentosCarregados = false;
let usuariosCarregados = false;
let migracaoColecoesVerificada = false;

function marcarProntoSeCompleto(){
  if(configCarregado && lancamentosCarregados && usuariosCarregados){ ready = true; render(); }
}

async function gravarLancamentosEmLote(lista, opts){
  opts = opts || {};
  const TAM_LOTE = 450; // limite do Firestore é 500 operações por batch
  if(opts.apagarAntesDeGravar){
    const existentes = await lancamentosRef.get();
    let batch = db.batch(), n = 0;
    for(const doc of existentes.docs){
      batch.delete(doc.ref); n++;
      if(n === TAM_LOTE){ await batch.commit(); batch = db.batch(); n = 0; }
    }
    if(n > 0) await batch.commit();
  }
  for(let i=0; i<lista.length; i+=TAM_LOTE){
    const batch = db.batch();
    lista.slice(i, i+TAM_LOTE).forEach(l=>{
      const id = l.id || uid();
      batch.set(lancamentosRef.doc(id), Object.assign({}, l, {id}));
    });
    await batch.commit();
  }
}

async function gravarUsuariosEmLote(lista, opts){
  opts = opts || {};
  const TAM_LOTE = 450;
  if(opts.apagarAntesDeGravar){
    const existentes = await usuariosRef.get();
    let batchDel = db.batch(), n = 0;
    for(const doc of existentes.docs){
      batchDel.delete(doc.ref); n++;
      if(n === TAM_LOTE){ await batchDel.commit(); batchDel = db.batch(); n = 0; }
    }
    if(n > 0) await batchDel.commit();
  }
  const comEmail = (lista||[]).filter(u=>{
    if(!u.email){ console.warn("Usuário sem e-mail ignorado:", u); return false; }
    return true;
  });
  for(let i=0; i<comEmail.length; i+=TAM_LOTE){
    const batch = db.batch();
    comEmail.slice(i, i+TAM_LOTE).forEach(u=>{
      batch.set(usuariosRef.doc(u.email.toLowerCase()), u);
    });
    await batch.commit();
  }
}

// migração única: só roda se "config" ainda não existir. Lê o documento único
// antigo (se existir), normaliza com a mesma lógica de sempre (migrarEstado) e
// grava cada lançamento/usuário como documento próprio + o resto num doc de
// config. O documento antigo NUNCA é apagado nem sobrescrito — fica como backup.
async function garantirMigracaoParaColecoes(){
  if(migracaoColecoesVerificada) return;
  migracaoColecoesVerificada = true;

  const configSnap = await configRef.get();
  if(configSnap.exists) return;

  let parsedAntigo = null;
  try{
    const oldSnap = await docRef.get();
    if(oldSnap.exists && oldSnap.data().payload){
      parsedAntigo = JSON.parse(oldSnap.data().payload);
    }
  }catch(e){ console.warn("Não foi possível ler o documento antigo para migração.", e); }

  migrarEstado(parsedAntigo || {});
  const lancamentosParaMigrar = state.lancamentos || [];
  const usuariosParaMigrar = state.usuarios || [];
  const { lancamentos, usuarios, ...cfgSemLancamentosEUsuarios } = state;

  await gravarLancamentosEmLote(lancamentosParaMigrar);
  await gravarUsuariosEmLote(usuariosParaMigrar);
  await configRef.set({
    payload: JSON.stringify(cfgSemLancamentosEUsuarios),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  });

  console.info(`[NFF] Migração para a nova estrutura concluída: ${lancamentosParaMigrar.length} lançamento(s) e ${usuariosParaMigrar.length} usuário(s) movidos para coleções próprias. O documento antigo foi mantido intacto.`);
}

async function loadState(){
  if(!FIREBASE_READY){ ready = true; render(); return; }

  try{
    await garantirMigracaoParaColecoes();
  }catch(e){
    console.error("Falha ao preparar a nova estrutura de dados:", e);
    syncError = "Não foi possível preparar o banco de dados. Verifique a configuração do Firebase e as regras do Firestore.";
    ready = true;
    render();
    return;
  }

  configRef.onSnapshot(
    (snap)=>{
      if(snap.exists){
        const data = snap.data();
        try{
          const parsed = data.payload ? JSON.parse(data.payload) : null;
          if(parsed) migrarEstadoConfig(parsed);
        }catch(e){ console.warn("Payload de configuração inválido.", e); }
        lastUpdated = data.updatedAt && data.updatedAt.toDate ? data.updatedAt.toDate() : lastUpdated;
      }
      configCarregado = true;
      syncError = null;
      marcarProntoSeCompleto();
      render();
    },
    (err)=>{
      console.error("Erro de sincronização (config):", err);
      syncError = "Não foi possível conectar ao banco de dados. Verifique a configuração do Firebase e as regras do Firestore.";
      configCarregado = true;
      marcarProntoSeCompleto();
      render();
    }
  );

  lancamentosRef.onSnapshot(
    async (snap)=>{
      state.lancamentos = snap.docs.map(d=>d.data());
      const primeiraCarga = !lancamentosCarregados;
      lancamentosCarregados = true;
      if(primeiraCarga){
        try{
          await validarExtrato072026();
        }catch(e){
          console.error("[NFF] Falha na validação do Extrato 07/2026:", e);
        }
      }
      syncError = null;
      marcarProntoSeCompleto();
      render();
    },
    (err)=>{
      console.error("Erro de sincronização (lançamentos):", err);
      syncError = "Não foi possível conectar ao banco de dados. Verifique a configuração do Firebase e as regras do Firestore.";
      lancamentosCarregados = true;
      marcarProntoSeCompleto();
      render();
    }
  );

  usuariosRef.onSnapshot(
    (snap)=>{
      state.usuarios = snap.docs.map(d=>d.data());
      usuariosCarregados = true;
      syncError = null;
      marcarProntoSeCompleto();
      render();
    },
    (err)=>{
      console.error("Erro de sincronização (usuários):", err);
      syncError = "Não foi possível conectar ao banco de dados. Verifique a configuração do Firebase e as regras do Firestore.";
      usuariosCarregados = true;
      marcarProntoSeCompleto();
      render();
    }
  );
}

async function saveConfig(){
  if(!FIREBASE_READY) return;
  savingNow = true;
  try{
    const { lancamentos, usuarios, ...cfg } = state;
    await configRef.set({
      payload: JSON.stringify(cfg),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    syncError = null;

    console.error("Falha ao salvar no Firestore:", e);
    syncError = "Não foi possível salvar suas alterações. Verifique sua conexão com a internet.";

  savingNow = false;
}

// usuários ficam em coleção própria, com o e-mail (minúsculo) como ID do
// documento, pra regras do Firestore conseguirem checar o perfil de quem
// escreve. Se o e-mail mudar numa edição, apaga o doc antigo e cria o novo.
async function salvarUsuario(u, emailAntigo){
  if(!FIREBASE_READY) return;
  savingNow = true;
  try{
    const emailNovo = (u.email||"").toLowerCase();
    if(emailAntigo && emailAntigo.toLowerCase() !== emailNovo){
      await usuariosRef.doc(emailAntigo.toLowerCase()).delete();
    }
    await usuariosRef.doc(emailNovo).set(u);
    syncError = null;
  }catch(e){
    console.error("Falha ao salvar usuário:", e);
    syncError = "Não foi possível salvar o usuário. Verifique sua conexão com a internet.";
  }
  savingNow = false;
}

async function excluirUsuario(email){
  if(!FIREBASE_READY || !email) return;
  savingNow = true;
  try{
    await usuariosRef.doc(email.toLowerCase()).delete();
    syncError = null;
  }catch(e){
    console.error("Falha ao excluir usuário:", e);
    syncError = "Não foi possível excluir o usuário. Verifique sua conexão com a internet.";
  }
  savingNow = false;
}

function reconNormText(v){
  let x = String(v ?? "").trim().toLowerCase().replace(/\s+/g," ");
  if(/[ÃÂ]/.test(x)){
    try{ x = decodeURIComponent(escape(x)); }catch(e){}
  }
  return x.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function reconKey(data, descricao, valor, banco){
  const dt = String(data||"").slice(0,10);
  const desc = reconNormText(descricao);
  const val = Math.round(Math.abs(Number(valor)||0)*100)/100;
  const bco = reconNormText(banco);
  return `${dt}|${desc}|${val.toFixed(2)}|${bco}`;
}

function inferGrupoDRERecon(nome){
  const n = reconNormText(nome);
  if(n.includes("imposto") || n.includes("iss") || n.includes("simples")) return "imposto";
  if(n.includes("custo")) return "custo";
  return "administrativa";
}

async function validarExtrato072026(){
  const VERSAO = "extrato-07-2026-v1";
  state._validacoesGerenciais = state._validacoesGerenciais || {};
  if(state._validacoesGerenciais["07/2026"] === VERSAO) return {corrigidos:0, correspondidos:0, naoEncontrados:0};

  const mapa = new Map();
  EXTRATO_VALIDACAO_072026.forEach(r=>{
    const k = reconKey(r[0],r[1],r[2],r[3]);
    if(!mapa.has(k)) mapa.set(k, r);
  });

  let correspondidos = 0, corrigidos = 0, naoEncontrados = 0;
  const categorias = state.categoriasDespesa || [];
  const lancamentosAlterados = [];

  (state.lancamentos || []).forEach(l=>{
    if(l.tipo !== "despesa") return;
    // A planilha é a base de validação de julho/2026.
    if(String(l.data||"").slice(0,7) !== "2026-07") return;

    const k = reconKey(l.data, l.descricao, l.valor, bancoName(l.bancoId));
    const r = mapa.get(k);
    if(!r){ naoEncontrados++; return; }

    correspondidos++;
    const nomeClass = String(r[4]||"").trim();
    const subClass = String(r[5]||"").trim();

    let cat = categorias.find(c=>reconNormText(c.nome) === reconNormText(nomeClass));
    if(!cat){
      cat = {id:uid(), nome:nomeClass, grupoDRE:inferGrupoDRERecon(nomeClass)};
      categorias.push(cat);
    }

    let mudou = false;
    if(l.categoriaId !== cat.id){ l.categoriaId = cat.id; mudou = true; }
    if(String(l.subClassificacao||"").trim() !== subClass){ l.subClassificacao = subClass; mudou = true; }

    if(mudou){ corrigidos++; lancamentosAlterados.push(l); }
  });

  state._validacoesGerenciais["07/2026"] = VERSAO;
  await gravarLancamentosEmLote(lancamentosAlterados);
  await saveConfig();
  console.info("[NFF] Validação do Extrato 07/2026 concluída.", {
    correspondidos, corrigidos, naoEncontrados
  });
  return {corrigidos, correspondidos, naoEncontrados};
}

/* ---------------------------------------------------------
   MÁSCARA DE VALOR MONETÁRIO (R$ 0,00) — campos de valor usavam
   <input type="number"> nativo: sem separador de milhar, fácil mudar
   o valor sem querer com a rodinha do mouse, e visualmente diferente
   do "R$ 0,00" usado no resto do sistema. Esses campos agora são
   <input type="text" inputmode="decimal">, com os dígitos digitados
   tratados como centavos (mesma lógica de qualquer caixa eletrônico):
   1234 vira 12,34; 123456 vira 1.234,56.
--------------------------------------------------------- */
function formatarCentavos(valorDigitado, negativo){
  let digits = String(valorDigitado||"").replace(/\D/g, "");
  digits = digits.replace(/^0+(?=\d)/, "");
  while(digits.length < 3) digits = "0" + digits;
  const inteiro = digits.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const centavos = digits.slice(-2);
  return (negativo ? "-" : "") + inteiro + "," + centavos;
}
function valorMascaraParaNumero(str){
  if(!str) return 0;
  const negativo = /^\s*-/.test(String(str));
  const limpo = String(str).replace(/[^\d,]/g, "").replace(",", ".");
  const n = Number(limpo) || 0;
  return negativo ? -n : n;
}
function ligarMascaraMoeda(id, opts){
  opts = opts || {};
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener("input", ()=>{
    const negativo = !!(opts.permiteNegativo && el.value.includes("-"));
    el.value = formatarCentavos(el.value, negativo);
    el.setSelectionRange(el.value.length, el.value.length);
  });
}
function ultimosNMeses(refYM, n){
  const ref = (refYM === "all" || !refYM) ? thisMonthYM() : refYM;
  const [y,m] = ref.split("-").map(Number);
  const meses = [];
  for(let i=n-1; i>=0; i--){
    const d = new Date(y, m-1-i, 1);
    meses.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  return meses;
}
function sparklineSVG(valores, cor){
  const comDados = valores.filter(v => v !== 0).length;
  if(comDados < 2){
    return `<div style="font-size:9px; color:var(--ink-soft); text-align:right; line-height:1.3; max-width:60px;">Histórico insuficiente</div>`;
  }
  const w=52, h=26;
  const max = Math.max(...valores);
  const min = Math.min(...valores);
  const range = (max-min) || 1;
  const step = valores.length>1 ? w/(valores.length-1) : w;
  const pontos = valores.map((v,i)=> `${(i*step).toFixed(1)},${(h-((v-min)/range)*h).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pontos}" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function progressRingSVG(pct, cor){
  const clamped = Math.max(0, Math.min(100, pct===null||!isFinite(pct) ? 0 : pct));
  return `<svg width="40" height="40" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--paper-line)" stroke-width="3.5"/>
    <circle cx="18" cy="18" r="15.5" fill="none" stroke="${cor}" stroke-width="3.5" stroke-dasharray="${clamped.toFixed(1)} 100" stroke-linecap="round" transform="rotate(-90 18 18)"/>
  </svg>`;
}
function prepararFatiasDonut(lista, max){
  const top = lista.slice(0, max);
  const outrosValor = lista.slice(max).reduce((a,c)=>a+c.valor,0);
  const fatias = top.map(c=>({nome:c.nome, valor:c.valor}));
  if(outrosValor > 0) fatias.push({nome:"Outros", valor:outrosValor});
  return fatias;
}
function donutSVG(fatias, cores){
  const total = fatias.reduce((a,f)=>a+f.valor,0);
  let offset = 25;
  let circulos = `<circle cx="21" cy="21" r="15.9" fill="transparent" stroke="var(--paper-line)" stroke-width="6"></circle>`;
  fatias.forEach((f,i)=>{
    const pct = total>0 ? (f.valor/total*100) : 0;
    circulos += `<circle cx="21" cy="21" r="15.9" fill="transparent" stroke="${cores[i%cores.length]}" stroke-width="6" stroke-dasharray="${pct.toFixed(2)} 100" stroke-dashoffset="${offset.toFixed(2)}"></circle>`;
    offset -= pct;
  });
  return `<svg width="92" height="92" viewBox="0 0 42 42">${circulos}</svg>`;
}
function evolucaoMensalSVG(seriesDados){
  const w=760, h=110;
  const n = seriesDados.length;
  const max = Math.max(1, ...seriesDados.map(x=>Math.max(x.r,x.d)));
  const step = n>1 ? w/(n-1) : w;
  const ptsR = seriesDados.map((x,i)=> `${(i*step).toFixed(1)},${(h-(x.r/max*h)).toFixed(1)}`).join(" ");
  const ptsD = seriesDados.map((x,i)=> `${(i*step).toFixed(1)},${(h-(x.d/max*h)).toFixed(1)}`).join(" ");
  return `
    <svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polygon points="0,${h} ${ptsR} ${w},${h}" fill="var(--green)" opacity="0.14"></polygon>
      <polyline points="${ptsR}" fill="none" stroke="var(--green)" stroke-width="2"></polyline>
      <polygon points="0,${h} ${ptsD} ${w},${h}" fill="var(--red)" opacity="0.12"></polygon>
      <polyline points="${ptsD}" fill="none" stroke="var(--red)" stroke-width="2"></polyline>
    </svg>
    <div style="display:flex; margin-top:6px;">
      ${seriesDados.map(x=>`<div style="flex:1; text-align:center; font-size:10.5px; color:var(--ink-soft);">${monthLabel(x.ym).split("/")[0]}</div>`).join("")}
    </div>
  `;
}
function trendBadge(pct, orientacaoAltaBoa, sufixo){
  if(pct === null || !isFinite(pct)) return "";
  const bom = orientacaoAltaBoa ? pct >= 0 : pct <= 0;
  const seta = pct >= 0 ? "↑" : "↓";
  const cor = bom ? "var(--green)" : "var(--red)";
  const bg = bom ? "var(--green-soft)" : "var(--red-soft)";
  return `<div style="display:flex; align-items:center; gap:6px; margin-top:8px;">
    <span style="display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700; color:${cor}; background:${bg}; padding:3px 9px; border-radius:20px;">${seta} ${Math.abs(pct).toFixed(1)}${sufixo||"%"}</span>
    <span style="font-size:11px; color:var(--ink-soft);">vs mês anterior</span>
  </div>`;
}

}

function formatDocumento(tipoPessoa, raw){
  const d = String(raw||"").replace(/\D/g,"");
  if(tipoPessoa === "juridica"){
    if(d.length !== 14) return raw || "—";
    return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5");
  }
  if(d.length !== 11) return raw || "—";
  return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
}
function bancoNomeById(id){
  const b = (state.bancos||[]).find(b=>b.id===id);
  return b ? b.nome : "";
}
function valorPorExtenso(valor){
  const UNIDADES = ["","um","dois","três","quatro","cinco","seis","sete","oito","nove"];
  const DEZ_A_DEZENOVE = ["dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
  const DEZENAS = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
  const CENTENAS = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];

  function trescentos(n){
    if(n===0) return "";
    if(n===100) return "cem";
    const c = Math.floor(n/100), r = n%100;
    const partes = [];
    if(c) partes.push(CENTENAS[c]);
    if(r){
      if(r<10) partes.push(UNIDADES[r]);
      else if(r<20) partes.push(DEZ_A_DEZENOVE[r-10]);
      else {
        const d = Math.floor(r/10), u = r%10;
        partes.push(DEZENAS[d] + (u ? " e "+UNIDADES[u] : ""));
      }
    }
    return partes.join(" e ");
  }

  function inteiroPorExtenso(n){
    if(n===0) return "zero";
    const milhoes = Math.floor(n/1000000);
    const milhares = Math.floor((n%1000000)/1000);
    const resto = n%1000;
    const partes = [];
    if(milhoes) partes.push(trescentos(milhoes) + (milhoes>1 ? " milhões" : " milhão") + ((milhares===0 && resto===0) ? " de" : ""));
    if(milhares) partes.push((milhares===1 ? "mil" : trescentos(milhares)+" mil"));
    if(resto) partes.push(trescentos(resto));
    return partes.join(" e ");
  }

  const v = Math.round((Number(valor)||0) * 100) / 100;
  const inteiros = Math.floor(v);
  const centavos = Math.round((v - inteiros) * 100);
  const reaisTxt = inteiroPorExtenso(inteiros) + (inteiros === 1 ? " real" : " reais");
  if(centavos === 0) return reaisTxt;
  const centavosTxt = inteiroPorExtenso(centavos) + (centavos === 1 ? " centavo" : " centavos");
  return `${reaisTxt} e ${centavosTxt}`;
}

function statusPill(status){
  const cls = status === "Pago" ? "pago" : status === "Atrasado" ? "atrasado" : status === "Pendente" ? "pendente" : "";
  return `<span class="status-pill ${cls}">${status||"—"}</span>`;
}
function contaLabel(id){
  const c = (state.contasBancarias||[]).find(c=>c.id===id);
  if(!c) return "";
  const banco = bancoNomeById(c.bancoId);
  const partes = [banco, c.agencia?`Ag ${c.agencia}`:"", c.numero?`Cc ${c.numero}`:"", c.tipoConta].filter(Boolean);
  return partes.join(" · ");
}

// modal de confirmação próprio, no lugar do confirm() nativo do navegador —
// mesma assinatura de uso (await confirmarAcao(mensagem)), mas resolve a
// Promise só depois do usuário escolher um dos botões no modal.
function confirmarAcao(mensagem, opts){
  opts = opts || {};
  const destrutivo = opts.destrutivo !== false;
  return new Promise(resolve=>{
    const root = document.getElementById("confirm-modal-root");
    root.innerHTML = `
      <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-modal">
          <div class="confirm-modal-icon ${destrutivo ? "red" : "navy"}">${ICONS.alert}</div>
          <div class="confirm-modal-text">${escapeHtml(mensagem)}</div>
          <div class="confirm-modal-actions">
            <button type="button" class="btn ghost" id="confirmCancelBtn">${opts.cancelLabel || "Cancelar"}</button>
            <button type="button" class="btn primary ${destrutivo ? "despesa" : "neutral"}" id="confirmOkBtn">${opts.confirmLabel || (destrutivo ? "Remover" : "Confirmar")}</button>
          </div>
        </div>
      </div>
    `;
    const finalizar = val=>{ root.innerHTML = ""; resolve(val); };
    document.getElementById("confirmCancelBtn").addEventListener("click", ()=>finalizar(false));
    document.getElementById("confirmOkBtn").addEventListener("click", ()=>finalizar(true));
    document.getElementById("confirmOverlay").addEventListener("click", e=>{ if(e.target.id === "confirmOverlay") finalizar(false); });
    document.getElementById("confirmOkBtn").focus();
  });
}

function sidebarSaldoWidget(){
  const mesAtual = thisMonthYM();

}

// fundo animado (pontos conectados por linhas, à deriva) atrás do card de
// login/esqueci-senha — iniciado/parado junto com cada render() pra nunca
// ficar mais de um loop de requestAnimationFrame rodando ao mesmo tempo.
let authNetworkRAF = null;
let authNetworkResizeHandler = null;
function pararRedeAuth(){
  if(authNetworkRAF){ cancelAnimationFrame(authNetworkRAF); authNetworkRAF = null; }
  if(authNetworkResizeHandler){ window.removeEventListener("resize", authNetworkResizeHandler); authNetworkResizeHandler = null; }
}
function iniciarRedeAuth(){
  const canvas = document.getElementById("authNetworkCanvas");
  if(!canvas) return;
  pararRedeAuth();
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = canvas.getContext("2d");
  let w, h, pts;
  function resize(){
    w = canvas.width = canvas.clientWidth;
    h = canvas.height = canvas.clientHeight;
    const n = Math.max(18, Math.round((w*h) / 9000));
    pts = Array.from({length:n}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.18, vy: (Math.random()-0.5)*0.18
    }));
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    pts.forEach(p=>{
      p.x += p.vx; p.y += p.vy;
      if(p.x<0||p.x>w) p.vx*=-1;
      if(p.y<0||p.y>h) p.vy*=-1;
    });
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const a=pts[i], b=pts[j];
        const d = Math.hypot(a.x-b.x, a.y-b.y);
        const maxD = w*0.16;
        if(d < maxD){
          ctx.strokeStyle = `rgba(201,162,39,${(0.22*(1-d/maxD)).toFixed(3)})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    pts.forEach(p=>{
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath(); ctx.arc(p.x,p.y,1.4,0,Math.PI*2); ctx.fill();
    });
    authNetworkRAF = requestAnimationFrame(tick);
  }
  authNetworkResizeHandler = resize;
  window.addEventListener("resize", authNetworkResizeHandler);
  resize();
  tick();
}

function attachAuthHandlers(){
  iniciarRedeAuth();
  const loginForm = document.getElementById("loginForm");
  if(loginForm){
    loginForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const fd = new FormData(loginForm);
      const email = String(fd.get("email")||"").trim();
      const senha = String(fd.get("senha")||"");
      authBusy = true; authError = null; render();
      try{
        await auth.signInWithEmailAndPassword(email, senha);
        // onAuthStateChanged cuida do resto
      }catch(err){
        authBusy = false;
        authError = traduzErroAuth(err.code);
        render();
      }
    });
  }
  const btnEsqueciSenha = document.getElementById("btnEsqueciSenha");
  if(btnEsqueciSenha) btnEsqueciSenha.addEventListener("click", ()=>{
    authView = "esqueci"; authError = null; authMsg = null; render();
  });
  const btnVoltarLogin = document.getElementById("btnVoltarLogin");
  if(btnVoltarLogin) btnVoltarLogin.addEventListener("click", ()=>{
    authView = "login"; authError = null; authMsg = null; render();
  });
  const forgotForm = document.getElementById("forgotForm");
  if(forgotForm){
    forgotForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const fd = new FormData(forgotForm);
      const email = String(fd.get("email")||"").trim();
      authBusy = true; authError = null; authMsg = null; render();
      try{
        await auth.sendPasswordResetEmail(email);
        authBusy = false;
        authMsg = "Link de redefinição enviado! Confira sua caixa de entrada (e o spam).";
        render();
      }catch(err){
        authBusy = false;
        authError = traduzErroAuth(err.code);
        render();
      }
    });
  }
}
